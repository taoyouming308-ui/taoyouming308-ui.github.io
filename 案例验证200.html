<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>200例烫发案例验证</title>
<style>
:root{--bg:#0f0f1a;--surface:#1a1a2e;--text:#e8e8f0;--accent:#d4a574;--danger:#e0556a;--warning:#e0b055;--border:#2a2a45;--green:#4caf84}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:var(--bg);color:var(--text);max-width:600px;margin:0 auto;padding:12px}
h1{text-align:center;margin:16px 0;color:var(--accent)}
.filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.filters select,.filters button{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px}
.case{border:1px solid var(--border);border-radius:10px;padding:12px;margin:8px 0;background:var(--surface)}
.case-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.case-id{font-size:11px;color:var(--text);opacity:.5}
.case-hair{font-weight:700;color:var(--accent)}
.case-safety{font-size:11px;padding:2px 8px;border-radius:4px}
.safe{background:rgba(76,175,132,.15);color:var(--green)}
.warn{background:rgba(224,176,85,.15);color:var(--warning)}
.danger{background:rgba(224,85,106,.15);color:var(--danger)}
.case-body{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px}
.case-body span{color:var(--text);opacity:.7}
.case-body b{color:var(--text)}
.verify-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.verify-row button{padding:4px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px}
.btn-ok{background:rgba(76,175,132,.2);color:var(--green)}
.btn-no{background:rgba(224,85,106,.2);color:var(--danger)}
.btn-fix{background:rgba(224,176,85,.2);color:var(--warning)}
.verify-note{font-size:11px;margin-left:8px;color:var(--accent)}
.hidden{display:none}
.count{text-align:center;font-size:12px;color:var(--text);opacity:.5;margin:8px 0}
</style>
</head>
<body>
<h1>🔥 200例烫发案例</h1>
<div class="filters">
<select id="filter-level" onchange="filter()">
<option value="">全部发质</option>
<option value="1级">1级健康</option>

<option value="3级">3级受损</option>

</select>
<select id="filter-style" onchange="filter()">

</select>
<select id="filter-status" onchange="filter()">
<option value="">全部状态</option>
<option value="ok">✅ 通过</option>
<option value="no">❌ 不对</option>
<option value="fix">🔧 需调整</option>
<option value="pending">⏳ 未验证</option>
</select>
</div>
<div class="count" id="count"></div>

// 初始状态: 全部未验证
DATA.forEach(c => { if(!c.verified) c.verified = 'pending'; });

let filtered = [...DATA];

function render() {
  const container = document.getElementById('cases');
  const count = document.getElementById('count');
  const stats = {ok:0,no:0,fix:0,pending:0};
  DATA.forEach(c => stats[c.verified]++);
  count.textContent = `显示 ${filtered.length}/${DATA.length} · ✅${stats.ok} ❌${stats.no} 🔧${stats.fix} ⏳${stats.pending}`;
  
  let html = '';
  filtered.forEach(c => {
    const s = {'ok':'✅','no':'❌','fix':'🔧','pending':'⏳'}[c.verified];
    const sc = {'ok':'safe','no':'danger','fix':'warn','pending':''}[c.verified];
    html += `<div class="case" data-id="${c.id}">
      <div class="case-header">
        <span class="case-id">#${c.id} <span class="${sc}">${s}</span></span>
        <span class="case-hair">${c['发质']}</span>
        <span class="case-safety ${c['安全'].includes('安全')?'safe':c['安全'].includes('危')?'danger':'warn'}">${c['安全']}</span>
      </div>
      <div class="case-body">
        <div><span>PH</span> <b>${c['PH']}</b></div>
        <div><span>TGA:CA</span> <b>${c['TGA:CA']}</b></div>
        <div><span>药性</span> <b>${c['药性']}</b></div>
        <div><span>蛋白</span> <b>${c['蛋白']}</b></div>
        <div><span>款式</span> <b>${c['款式']}</b></div>
        <div><span>杠号</span> <b>${c['杠号']}</b></div>
        <div><span>手法</span> <b>${c['手法']}${c['角度']}${c['起点']}</b></div>
        <div><span>目标软化</span> <b>${c['目标软化']}</b></div>
        <div><span>刹车上限</span> <b>${c['刹车上限']}</b></div>
        <div><span>渗透式</span> <b>${c['渗透式']}</b></div>
      </div>
      <div class="verify-row">
        <button class="btn-ok" onclick="verify(${c.id},'ok')">✅</button>
        <button class="btn-no" onclick="verify(${c.id},'no')">❌</button>
        <button class="btn-fix" onclick="verify(${c.id},'fix')">🔧</button>
        <span class="verify-note" id="note-${c.id}"></span>
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

function verify(id, status) {
  const c = DATA.find(x => x.id === id);
  c.verified = status;
  // 保存到localStorage
  localStorage.setItem('perm200_verify', JSON.stringify(DATA.map(x=>({id:x.id,v:x.verified}))));
  filter();
}

function filter() {
  const lv = document.getElementById('filter-level').value;
  const st = document.getElementById('filter-style').value;
  const vs = document.getElementById('filter-status').value;
  filtered = DATA.filter(c => {
    if (lv && !c['发质'].startsWith(lv)) return false;
    if (st && c['款式'] !== st) return false;
    if (vs && c.verified !== vs) return false;
    return true;
  });
  render();
}

// 恢复状态
const saved = localStorage.getItem('perm200_verify');
if (saved) {
  const map = {};
  JSON.parse(saved).forEach(x => map[x.id] = x.v);
  DATA.forEach(c => { if (map[c.id]) c.verified = map[c.id]; });
}

// 款式列表
const styles = [...new Set(DATA.map(c => c['款式']))].sort();
const ss = document.getElementById('filter-style');
styles.forEach(s => { const o = document.createElement('option'); o.value=s; o.textContent=s; ss.appendChild(o); });

render();
</script>
