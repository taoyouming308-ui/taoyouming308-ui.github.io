<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>自由手艺人 · 后台管理</title>
<style>
:root { --bg:#000; --surface:#16181c; --surface-2:#111; --border:#333; --border-soft:#222; --text:#e5e5e5; --muted:#888; --danger:#e0556a; --success:#4ade80; --accent:#facc15; --info:#60a5fa; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.login-box { max-width:360px; margin:15vh auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:40px 30px; }
.login-box h1 { font-size:20px; color:#fff; text-align:center; margin-bottom:24px; }
.login-box input { width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:#fff; font-size:14px; margin-bottom:12px; }
.login-box button { width:100%; padding:12px; background:#fff; color:#000; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
.login-box .error { color:var(--danger); font-size:13px; margin-top:8px; text-align:center; }
.header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--surface); border-bottom:1px solid var(--border); }
.header h2 { font-size:16px; color:#fff; }
.header button { padding:6px 16px; background:transparent; color:var(--danger); border:1px solid var(--danger); border-radius:6px; cursor:pointer; font-size:13px; }
.tabs { display:flex; gap:0; padding:0 20px; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; }
.tab { padding:10px 16px; color:var(--muted); cursor:pointer; font-size:14px; border-bottom:2px solid transparent; white-space:nowrap; flex:0 0 auto; }
.tab.active { color:#fff; border-bottom-color:#fff; }
.content { padding:20px; max-width:1000px; margin:0 auto; }
.content > div { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:20px; }
th { text-align:left; padding:8px; color:var(--muted); border-bottom:1px solid var(--border); font-weight:400; }
td { padding:8px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
td button { padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px; margin-right:4px; }
.btn-edit { background:transparent; color:#fff; border:1px solid #555; }
.btn-del { background:transparent; color:var(--danger); border:1px solid var(--danger); }
.btn-add { padding:8px 20px; background:#fff; color:#000; border:none; border-radius:6px; font-size:14px; cursor:pointer; margin-bottom:16px; }
.btn-add:disabled, .btn-save:disabled, .login-box button:disabled { opacity:0.65; cursor:not-allowed; }
.badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; }
.badge-admin { background:#3a1a1a; color:var(--danger); }
.badge-staff { background:#1a2a3a; color:var(--info); }
.status-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; }
.status-active { background:var(--success); }
.status-inactive { background:var(--muted); }
.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center; }
.modal.show { display:flex; }
.modal-box { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:30px; width:min(420px, calc(100vw - 32px)); max-height:min(80vh, 720px); overflow-y:auto; }
.modal-box h3 { font-size:16px; color:#fff; margin-bottom:16px; }
.modal-box label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
.modal-box input, .modal-box textarea, .modal-box select { width:100%; padding:10px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:#fff; font-size:13px; }
.modal-box select { appearance:none; }
.modal-box textarea { min-height:80px; resize:vertical; font-family:monospace; }
.modal-box .btn-row { display:flex; gap:8px; margin-top:16px; }
.modal-box .btn-row button { flex:1; padding:10px; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
.btn-save { background:#fff; color:#000; font-weight:600; }
.btn-cancel { background:transparent; color:#888; border:1px solid #555!important; }
#admin-panel { display:none; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:10px 24px; border-radius:8px; font-size:13px; z-index:200; }
.toast.ok { background:#1a3a1a; color:var(--success); }
.toast.err { background:#3a1a1a; color:var(--danger); }
.img-thumb { width:100%;max-width:360px;height:auto;min-height:200px;object-fit:contain;border-radius:8px;cursor:pointer;background:var(--surface-2);display:block; }
.img-thumb:hover { opacity:0.85; }
.ai-summary { cursor:pointer; padding:4px 6px; border-radius:4px; background:rgba(250,204,21,0.05); transition:background 0.2s; }
.ai-summary:hover { background:rgba(250,204,21,0.12); }
.img-modal { display:none; position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:999;align-items:center;justify-content:center;padding:20px; }
.img-modal.show { display:flex; }
.img-modal img { max-width:100%;max-height:90vh;border-radius:8px;object-fit:contain; }
.img-modal .close-img { position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:22px;cursor:pointer; }
.btn-approve { background:transparent; color:var(--success); border:1px solid var(--success); }
.btn-reject { background:transparent; color:var(--accent); border:1px solid var(--accent); }
.empty-row td { text-align:center; color:#555; padding:40px; }
</style>
</head>
<body>

<div id="login-page" class="login-box">
  <h1>后台管理</h1>
  <input type="text" id="login-user" placeholder="用户名" autocomplete="off">
  <input type="password" id="login-pass" placeholder="密码">
  <button onclick="doLogin()">登录</button>
  <div class="error" id="login-error"></div>
</div>

<div id="admin-panel">
  <div class="header">
    <h2>自由手艺人 · 后台管理</h2>
    <div style="display:flex;gap:6px;align-items:center;">
      <button onclick="location.reload()" title="刷新" style="padding:6px 10px;background:transparent;color:#888;border:1px solid #333;border-radius:6px;cursor:pointer;font-size:13px;">↻</button>
      <button onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="pending-alert" id="pending-alert" style="display:none;padding:10px 20px;background:#2a1a0a;color:#facc15;font-size:13px;text-align:center;border-bottom:1px solid #442200;cursor:pointer;" onclick="switchTab('images')">
    📸 有 <strong id="pending-count-text">0</strong> 张图片待审核，点击查看
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('staff')">员工管理</div>
    <div class="tab" onclick="switchTab('hair')">发质配置</div>
    <div class="tab" onclick="switchTab('style')">款式管理</div>
    <div class="tab" onclick="switchTab('perm')">烫发方案</div>
    <div class="tab" onclick="switchTab('images')">图片审核<span class="badge-tip" id="badge-images" style="display:none;margin-left:6px;background:#e0556a;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;"></span></div>
    <div class="tab" onclick="switchTab('carousel')">轮播管理</div>
  </div>
  <div class="content">
    <!-- 员工管理 -->
    <div id="tab-staff">
      <button class="btn-add" onclick="openModal('staff')">+ 新增员工</button>
      <table><thead><tr><th>用户名</th><th>角色</th><th>分店</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="table-staff"></tbody></table>
    </div>
    <div id="tab-hair" style="display:none">
      <button class="btn-add" onclick="openModal('hair')">+ 新增加</button>
      <table><thead><tr><th>名称</th><th>TGA:CA</th><th>PH</th><th>硫代</th><th>操作</th></tr></thead>
      <tbody id="table-hair"></tbody></table>
    </div>
    <div id="tab-style" style="display:none">
      <button class="btn-add" onclick="openModal('style')">+ 新增</button>
      <table><thead><tr><th>名称</th><th>描述</th><th>操作</th></tr></thead>
      <tbody id="table-style"></tbody></table>
    </div>
    <div id="tab-perm" style="display:none">
      <button class="btn-add" onclick="openModal('perm')">+ 新增方案</button>
      <table><thead><tr><th>发质</th><th>款式</th><th>PH</th><th>硫代</th><th>操作</th></tr></thead>
      <tbody id="table-perm"></tbody></table>
    </div>
    <div id="tab-images" style="display:none">
      <div style="font-size:12px;color:#888;margin-bottom:12px;">状态：
        <select id="img-filter" onchange="loadImages()" style="background:#000;color:#fff;border:1px solid #333;padding:4px 8px;border-radius:4px;">
          <option value="all" selected>全部</option>
          <option value="pending">待审核</option>
          <option value="approved">已通过</option>
          <option value="rejected">已拒绝</option>
        </select>
      </div>
      <table>
        <thead>
          <tr><th style="width:40px;">ID</th><th>预览</th><th>发型分析</th><th>上传者</th><th>状态</th><th>时间</th><th style="width:160px;">操作</th></tr>
        </thead>
        <tbody id="table-images"></tbody>
      </table>
    </div>
    <div id="tab-carousel" style="display:none">
      <div style="font-size:12px;color:#888;margin-bottom:8px;">首页轮播图（仅显示已审核的HTTP图片，建议750×1000px）</div>
      <div style="margin-bottom:16px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;">
        <label style="display:block;font-size:13px;color:#888;margin-bottom:6px;">轮播图 HTTP URL</label>
        <input type="url" id="car-url" placeholder="https://example.com/image.jpg" style="width:100%;padding:10px;border:1px solid #333;border-radius:6px;background:#000;color:#fff;font-size:13px;margin-bottom:10px;">
        <button class="btn-add" id="car-upload-btn" onclick="uploadCarousel()">保存</button>
        <div id="car-msg" style="font-size:13px;margin-top:8px;color:var(--accent);"></div>
      </div>
      <table>
        <thead><tr><th>预览</th><th>分类</th><th>上传者</th><th>操作</th></tr></thead>
        <tbody id="table-carousel"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box" id="modal-box"></div>
</div>

<div class="img-modal" id="img-modal" onclick="closeImageModal()">
  <img id="img-modal-src">
  <button class="close-img" onclick="closeImageModal()">✕</button>
</div>
<script>
const SUPABASE_URL = 'https://pdssrmpeiuwvxzsgschm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MDx4d2QzQpTojF8yLRHIqw_uKQW7A7t';
let currentTab = 'staff';
let editId = null;
let editingPermOriginal = null;
let pendingBadgeTimer = null;
let realtimeWs = null;
let realtimeReconnectTimer = null;
let realtimeHeartbeatTimer = null;
let realtimeManualClose = false;
let pendingBadgeErrorShown = false;

function restErrorMessage(r, fallback) {
  return r.text().then(function(txt) {
    if (!txt) return fallback || ('请求失败(' + r.status + ')');
    try {
      var data = JSON.parse(txt);
      return data.message || data.error || txt;
    } catch(e) {
      return txt;
    }
  }).catch(function() {
    return fallback || ('请求失败(' + r.status + ')');
  });
}

async function ensureOk(r, fallback) {
  if (r.ok) return r;
  throw new Error(await restErrorMessage(r, fallback));
}

function startPendingPolling() {
  if (!pendingBadgeTimer) pendingBadgeTimer = setInterval(updatePendingBadge, 5000);
}

function stopPendingPolling() {
  if (pendingBadgeTimer) {
    clearInterval(pendingBadgeTimer);
    pendingBadgeTimer = null;
  }
}

// 自动恢复登录（除非主动退出）
(function() {
  const s = localStorage.getItem('perm_admin');
  if (s) {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    loadData('staff');
    updatePendingBadge();
    startPendingPolling();
    connectRealtime();
  }
  document.getElementById('login-pass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('login-user').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
})();

async function doLogin() {
  // 先请求通知权限（必须在用户点击操作中触发，Safari 必须）
  try {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  } catch(e) {}
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  if (!u || !p) return;
  const btn = document.querySelector('#login-page button');
  if (btn) btn.disabled = true;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/staff?select=username,password_hash,role,active&username=eq.${encodeURIComponent(u)}&limit=1`, {
      headers: { 'apikey': SUPABASE_KEY }
    });
    await ensureOk(r, '登录失败');
    const rows = await r.json();
    const user = rows[0];
    if (user && user.password_hash === p && user.active !== false) {
      localStorage.setItem('perm_admin', JSON.stringify({user: u, role: user.role}));
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      document.getElementById('login-error').textContent = '';
      loadData('staff');
      updatePendingBadge();
      startPendingPolling();
      connectRealtime();
    } else if (user && user.active === false) {
      document.getElementById('login-error').textContent = '账号已停用';
    } else {
      document.getElementById('login-error').textContent = '用户名或密码错误';
    }
  } catch(e) {
    document.getElementById('login-error').textContent = '登录失败：' + e.message;
  } finally {
    if (btn) btn.disabled = false;
  }
}

function doLogout() {
  localStorage.removeItem('perm_admin');
  stopRealtime();
  stopPendingPolling();
  document.getElementById('login-page').style.display = '';
  document.getElementById('admin-panel').style.display = 'none';
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['staff','hair','style','perm','images','carousel'][i] === tab);
  });
  document.querySelectorAll('#tab-staff, #tab-hair, #tab-style, #tab-perm, #tab-images, #tab-carousel').forEach(d => d.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = '';
  if (tab === 'images') {
    loadImages();
  } else if (tab === 'carousel') {
    loadCarousel();
  } else {
    loadData(tab);
  }
}

async function loadData(tab) {
  let url;
  if (tab === 'staff') {
    url = `${SUPABASE_URL}/rest/v1/staff?select=*&order=id`;
  } else if (tab === 'hair') {
    url = `${SUPABASE_URL}/rest/v1/hair_types?select=*&order=id`;
  } else if (tab === 'style') {
    url = `${SUPABASE_URL}/rest/v1/perm_styles?select=*&order=id`;
  } else {
    url = `${SUPABASE_URL}/rest/v1/perm_data?select=*&order=id&limit=100`;
  }
  try {
    const r = await fetch(url, { headers: { 'apikey': SUPABASE_KEY } });
    await ensureOk(r, '加载失败');
    const rows = await r.json();
    renderTable(tab, rows);
  } catch(e) {
    toast('加载失败: ' + e.message, 'err');
  }
}

function renderTable(tab, rows) {
  const tbody = document.getElementById('table-' + tab);
  rows = rows || [];
  if (tab === 'staff') {
    if (rows.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">暂无数据</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r => `<tr>
      <td><b>${esc(r.username)}</b></td>
      <td><span class="badge ${r.role==='admin'?'badge-admin':'badge-staff'}">${esc(r.role)}</span></td>
      <td>${esc(r.store||'')}</td>
      <td><span class="status-dot ${r.active?'status-active':'status-inactive'}"></span>${r.active?'启用':'停用'}</td>
      <td>${(r.created_at||'').substring(0,10)}</td>
      <td><button class="btn-edit" onclick="openModal('staff',${r.id})">编辑</button>
      <button class="btn-del" onclick="doDelete('staff',${r.id})">删除</button></td>
    </tr>`).join('');
  } else if (tab === 'hair') {
    if (rows.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">暂无数据</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r => `<tr>
      <td>${esc(r.name)}</td><td>${esc(r.tga_ca_ratio)}</td><td>${esc(r.base_ph)}</td><td>${esc(r.base_thio)}</td>
      <td><button class="btn-edit" onclick="openModal('hair',${r.id})">编辑</button>
      <button class="btn-del" onclick="doDelete('hair_types',${r.id})">删除</button></td>
    </tr>`).join('');
  } else if (tab === 'style') {
    if (rows.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="3">暂无数据</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r => `<tr>
      <td>${esc(r.name)}</td><td>${esc(r.description||'')}</td>
      <td><button class="btn-edit" onclick="openModal('style',${r.id})">编辑</button>
      <button class="btn-del" onclick="doDelete('perm_styles',${r.id})">删除</button></td>
    </tr>`).join('');
  } else {
    if (rows.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">暂无数据</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r => `<tr>
      <td>${esc(r.hair_type)}</td><td>${esc(r.style)}</td><td>${esc(r.soften_ph)}</td><td>${esc(r.soften_thio)}</td>
      <td><button class="btn-edit" onclick="openModal('perm',${r.id})">编辑</button>
      <button class="btn-del" onclick="doDelete('perm_data',${r.id})">删除</button></td>
    </tr>`).join('');
  }
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

async function loadOne(table, id) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}&limit=1`, { headers: {'apikey': SUPABASE_KEY} });
  await ensureOk(r, '加载失败');
  const rows = await r.json();
  return rows[0];
}

async function openModal(tab, id) {
  editId = id || null;
  editingPermOriginal = null;
  const box = document.getElementById('modal-box');
  
  if (tab === 'staff') {
    let data = { username:'', password_hash:'', role:'staff', store:'', active:true };
    if (id) {
      try {
        data = await loadOne('staff', id) || data;
      } catch(e) {
        toast(e.message, 'err');
        return;
      }
    }
    box.innerHTML = `<h3>${id?'编辑':'新增'}员工</h3>
      <label>用户名</label><input id="f-user" value="${esc(data.username)}" ${id?'readonly':''}>
      <label>密码</label><input id="f-pass" type="text" placeholder="${id?'留空则不修改':'请输入密码'}">
      <label>角色</label><select id="f-role"><option value="admin" ${data.role==='admin'?'selected':''}>管理员</option><option value="staff" ${data.role==='staff'?'selected':''}>员工</option></select>
      <label>分店</label><input id="f-store" value="${esc(data.store||'')}" placeholder="如：自由手艺人">
      <label>状态</label><select id="f-active"><option value="true" ${data.active!==false?'selected':''}>启用</option><option value="false" ${data.active===false?'selected':''}>停用</option></select>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-save" onclick="saveStaff(${id||0})">保存</button>
      </div>`;
  } else if (tab === 'hair') {
    let data = { name:'', tga_ca_ratio:'', base_ph:'', base_thio:'' };
    if (id) {
      try {
        data = await loadOne('hair_types', id) || data;
      } catch(e) {
        toast(e.message, 'err');
        return;
      }
    }
    box.innerHTML = `<h3>${id?'编辑':'新增'}发质</h3>
      <label>名称</label><input id="f-name" value="${esc(data.name)}">
      <label>TGA:CA配比</label><input id="f-ratio" value="${esc(data.tga_ca_ratio||'')}">
      <label>基础PH</label><input id="f-ph" value="${esc(data.base_ph||'')}">
      <label>基础硫代</label><input id="f-thio" value="${esc(data.base_thio||'')}">
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-save" onclick="saveHair(${id||0})">保存</button>
      </div>`;
  } else if (tab === 'style') {
    let data = { name:'', description:'' };
    if (id) {
      try {
        data = await loadOne('perm_styles', id) || data;
      } catch(e) {
        toast(e.message, 'err');
        return;
      }
    }
    box.innerHTML = `<h3>${id?'编辑':'新增'}款式</h3>
      <label>名称</label><input id="f-name" value="${esc(data.name)}">
      <label>描述</label><input id="f-desc" value="${esc(data.description||'')}">

async function savePerm(id) {
  let rodSizes = document.getElementById('f-rods').value.trim();
  if (rodSizes) {
    try {
      rodSizes = JSON.parse(rodSizes);
    } catch(e) {
      // 兼容历史文本值；合法 JSON 字符串或数组会被解析成结构化值。
    }
  } else {
    rodSizes = [];
  }
  const data = {
    hair_type: document.getElementById('f-ht').value,
    style: document.getElementById('f-style').value,
    soften_ph: document.getElementById('f-ph').value,
    soften_thio: document.getElementById('f-thio').value,
    rod_sizes: rodSizes,
    technique: document.getElementById('f-tech').value
  };
  if (!id) {
    data.steps = editingPermOriginal?.steps || [];
    data.soften_raw = editingPermOriginal?.soften_raw || {};
    data.warning = editingPermOriginal?.warning || '';
  }
  await upsert('perm_data', id, data);
}

async function upsert(table, id, data) {
  const btn = document.querySelector('#modal .btn-save');
  if (btn) btn.disabled = true;
  try {
    let r;
    if (id) {
      r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`, {
        method: 'PATCH',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify(data)
      });
    } else {
      r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify(data)
      });
    }
    await ensureOk(r, '保存失败');
    toast('保存成功', 'ok');
    closeModal();
    loadData(currentTab);
  } catch(e) {
    toast('保存失败: ' + e.message, 'err');
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function doDelete(table, id) {
  if (!confirm('确定删除？')) return;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Prefer': 'return=minimal' }
    });
    await ensureOk(r, '删除失败');
    toast('删除成功', 'ok');
    loadData(currentTab);
  } catch(e) {
    toast('删除失败: ' + e.message, 'err');
  }
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// 待审核角标计数 + 桌面通知
var _lastPendingCount = -1;
function updatePendingBadge() {
  fetch(`${SUPABASE_URL}/rest/v1/showcase_images?select=id&status=eq.pending`, {
    headers: { 'apikey': SUPABASE_KEY, 'Prefer': 'count=exact' }
  }).then(function(r) {
    return ensureOk(r, '加载待审核数量失败');
  }).then(function(r) {
    var count = parseInt(r.headers.get('content-range')?.split('/')[1] || '0', 10);
    pendingBadgeErrorShown = false;
    var badge = document.getElementById('badge-images');
    var alert = document.getElementById('pending-alert');
    var txt = document.getElementById('pending-count-text');
    if (count > 0) {
      badge.textContent = count;
      badge.style.display = 'inline';
      document.title = '(' + count + ') 自由手艺人 · 后台管理';
      try { navigator.setAppBadge(count); } catch(e) {}
      // 桌面通知：新增或首次发现待审核时弹
      if (count > _lastPendingCount) {
        try {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('新图片待审核', {
              body: count + ' 张图片等待审核，点击查看',
              tag: 'perm-pending'
            });
          }
        } catch(e) {}
      }
      // 页面内提示条
      alert.style.display = 'block';
      if (txt) txt.textContent = count;
    } else {
      badge.style.display = 'none';
      alert.style.display = 'none';
      if (txt) txt.textContent = '0';
      document.title = '自由手艺人 · 后台管理';
      try { navigator.clearAppBadge(); } catch(e) {}
    }
    _lastPendingCount = count;
  }).catch(function(e){
    if (!pendingBadgeErrorShown) {
      toast('加载待审核数量失败: ' + e.message, 'err');
      pendingBadgeErrorShown = true;
    }
  });
}

// === Supabase Realtime 实时订阅（数据写入即推送，零延迟）===
function connectRealtime() {
  if (!localStorage.getItem('perm_admin')) return;
  if (realtimeWs && (realtimeWs.readyState === WebSocket.OPEN || realtimeWs.readyState === WebSocket.CONNECTING)) return;
  clearTimeout(realtimeReconnectTimer);
  realtimeManualClose = false;
  var wsUrl = SUPABASE_URL.replace('https://', 'wss://') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(SUPABASE_KEY) + '&vsn=1.0.0';
  try {
    var ws = new WebSocket(wsUrl);
    realtimeWs = ws;
    var ref = 0;
    ws.onopen = function() {
      ref++; ws.send(JSON.stringify([null, ''+ref, 'realtime:showcase_images', 'phx_join', {}]));
      ref++; ws.send(JSON.stringify([null, ''+ref, 'realtime:showcase_images', 'postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'showcase_images'
      }]));
      clearInterval(realtimeHeartbeatTimer);
      realtimeHeartbeatTimer = setInterval(function() {
        if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify([null, null, 'phoenix', 'heartbeat', {}]));
      }, 30000);
    };
    ws.onmessage = function(e) {
      try {
        var m = JSON.parse(e.data);
        if (m && m[3] === 'postgres_changes') {
          updatePendingBadge();
          if (currentTab === 'images') loadImages();
        }
      } catch(ex) {}
    };
    ws.onclose = function() {
      clearInterval(realtimeHeartbeatTimer);
      realtimeHeartbeatTimer = null;
      if (realtimeWs === ws) realtimeWs = null;
      if (!realtimeManualClose && localStorage.getItem('perm_admin')) {
        realtimeReconnectTimer = setTimeout(connectRealtime, 3000);
      }
    };
    ws.onerror = function() {
      try { ws.close(); } catch(e) {}
    };
  } catch(e) {}
}

function stopRealtime() {
  realtimeManualClose = true;
  clearTimeout(realtimeReconnectTimer);
  realtimeReconnectTimer = null;
  clearInterval(realtimeHeartbeatTimer);
  realtimeHeartbeatTimer = null;
  if (realtimeWs) {
    try { realtimeWs.close(); } catch(e) {}
    realtimeWs = null;
  }
}
