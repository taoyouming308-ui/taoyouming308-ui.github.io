<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>发型审美训练｜烫发研习院</title><style>body{max-width:760px;margin:auto;padding:24px;background:#f8f7f3;color:#222;font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}h1{font-size:26px}a{color:inherit}.item{display:block;background:#fff;border:1px solid #e8e5df;border-radius:14px;padding:20px;margin:14px 0;text-decoration:none}.item strong{display:block;font-size:18px}.item small{color:#777}#status{color:#666;font-size:13px}</style><a href="../perm-app.html">← 返回发型审美训练</a><h1>烫发研习院 · 每日图文课</h1><p>科学原理 → 现场判断 → 技术操作 → 美感设计 → 顾客沟通</p><div id="lessons"><a class="item" href="2026-10-12.html"><small>2026-10-12</small><strong>同一头发的根中尾，为什么不能只用一个软化判断</strong>基础精读 · 原创图示 · 已核来源及适用限制</a><a class="item" href="2026-10-11.html"><small>2026-10-11 · 第01课</small><strong>为什么同样软化程度，卷度却不同？</strong>含水状态、张力、加热与卷形</a></div><p id="status">正在检查历史课程…</p><script>(async()=>{const el=document.getElementById('lessons'),st=document.getElementById('status');try{const r=await fetch('catalog.json',{cache:'no-store'});if(!r.ok)throw Error('目录暂不可用');const data=await r.json();if(data.schemaVersion!==1||!Array.isArray(data.items)||!data.items.length)throw Error('尚无课程');const dates=new Set();for(const x of data.items){if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||typeof x.title!=='string'||!x.title.trim()||x.url!==x.date+'.html'||dates.has(x.date))throw Error('目录格式不符');dates.add(x.date)}const items=[...data.items].sort((a,b)=>b.date.localeCompare(a.date));el.replaceChildren();for(const x of items){const a=document.createElement('a');a.className='item';a.href=x.url;const sm=document.createElement('small');sm.textContent=x.date;const title=document.createElement('strong');title.textContent=x.title;a.append(sm,title);el.append(a)}st.textContent='已加载 '+items.length+' 堂课程';}catch(e){st.textContent='暂时无法刷新目录，已显示已知课程。';}})();</script></html>
