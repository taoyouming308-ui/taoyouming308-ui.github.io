<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="卷入两圈不等于自然干后出现两道S的概念示意"><rect width="760" height="350" rx="20" fill="#F6F2EB"/><text x="28" y="42" fill="#323B3B" font-size="26">卷杠两圈 ≠ 成品两道S</text><rect x="24" y="64" width="340" height="237" rx="16" fill="#DDE9EA"/><rect x="390" y="64" width="346" height="237" rx="16" fill="#E1E9DE"/><text x="194" y="92" text-anchor="middle" fill="#384F54" font-size="19">操作：圆杠上的绕入路径</text><text x="563" y="92" text-anchor="middle" fill="#405849" font-size="19">观察：拆杠后自然垂落曲线</text><rect x="100" y="145" width="193" height="48" rx="23" fill="#9EB8B2" stroke="#5E8075" stroke-width="3"/><path d="M64 168 C110 101 159 101 207 169 S278 231 311 159" fill="none" stroke="#A77765" stroke-width="10" stroke-linecap="round"/><path d="M83 135 C130 230 180 230 228 161 S288 108 314 173" fill="none" stroke="#759FA6" stroke-width="7" stroke-linecap="round"/><text x="193" y="268" font-size="15" fill="#4A5D58" text-anchor="middle">实际圈数取决于有效长度和杠径</text><path d="M549 115 C487 148 621 178 553 206 C490 239 605 255 555 280" fill="none" stroke="#7E9E95" stroke-width="10" stroke-linecap="round"/><path d="M636 139 L598 157 L611 138" fill="none" stroke="#BC8975" stroke-width="3"/><text x="652" y="137" font-size="15" fill="#835F4F">第一弯</text><path d="M653 238 L607 229 L619 216" fill="none" stroke="#BC8975" stroke-width="3"/><text x="659" y="257" font-size="15" fill="#835F4F">主卷峰</text><text x="380" y="331" fill="#6B6F6A" text-anchor="middle" font-size="14">原创教学示意，不代表实测卷形、固定圈数或药剂安全参数</text></svg>
