<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="六区排杠需要独立标记有效长度和第一弯"><rect width="760" height="430" rx="18" fill="#F5F3EC"/><text x="28" y="42" fill="#303B38" font-size="26">六区执行：先定第一弯，再选杠径与圈数</text><ellipse cx="243" cy="238" rx="174" ry="177" fill="#DCE7DD" stroke="#7C9A8D" stroke-width="3"/><rect x="181" y="78" width="124" height="61" rx="20" fill="#BCD6D7"/><rect x="94" y="181" width="114" height="92" rx="21" fill="#D0E0D2"/><rect x="278" y="181" width="116" height="92" rx="21" fill="#E6D7D0"/><rect x="197" y="181" width="83" height="102" rx="20" fill="#BCD1C3"/><rect x="187" y="309" width="111" height="78" rx="20" fill="#DCC8B9"/><g font-size="20" fill="#344F48" text-anchor="middle"><text x="243" y="115">顶部</text><text x="151" y="230">左侧</text><text x="336" y="230">右侧</text><text x="238" y="231">枕骨</text><text x="241" y="353">后颈</text></g><g fill="none" stroke="#BC8C76" stroke-width="3"><path d="M401 226 L450 226 L436 213 M450 226 L436 240"/><path d="M242 145 L242 177 L230 165 M242 177 L255 165"/></g><g font-size="19" fill="#40554D"><text x="474" y="110">顶部：根向与柔C</text><text x="474" y="155">两侧：下颌第一弯</text><text x="474" y="200">枕骨：主S连接</text><text x="474" y="245">后颈：有效发长与收尾</text><text x="474" y="290">刘海脸周：另查发旋</text></g><text x="471" y="348" fill="#956C5E" font-size="17">每片独立记录杠径、方向、提升角、圈数</text><text x="471" y="376" fill="#956C5E" font-size="17">不按“每区固定两圈”机械复制</text><text x="33" y="416" fill="#68716D" font-size="13">教学示意；实际分区边界以门店六区标准图为准，箭头不代表涂药顺序</text></svg>
