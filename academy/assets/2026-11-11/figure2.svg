<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="630" viewBox="0 0 1020 630"><title>教学示意：六区功能分配及分区交界检查</title><rect width="1020" height="630" rx="26" fill="#F7F3ED"/><text x="40" y="54" font-size="28" fill="#303538">技术图 · 六区分配体积任务，而不是全头复制一个卷度</text><rect x="35" y="86" width="445" height="492" rx="19" fill="#DCE5DD"/><rect x="510" y="86" width="475" height="492" rx="19" fill="#E9E0D4"/><ellipse cx="255" cy="333" rx="125" ry="184" fill="#F3E6DC" stroke="#596B61" stroke-width="3"/><path d="M175 195 Q258 117 335 195 L320 246 Q252 226 191 248 Z" fill="#A8C1B5"/><text x="231" y="204" font-size="22">顶部</text><path d="M131 267 Q186 246 185 390 L162 436 Q116 400 131 267" fill="#D6E2E9"/><text x="135" y="328" font-size="20">左侧</text><path d="M326 254 Q379 264 381 392 L347 440 Q318 391 326 254" fill="#E2CCD1"/><text x="326" y="327" font-size="20">右侧</text><rect x="216" y="264" width="86" height="111" rx="34" fill="#D7C3AD"/><text x="218" y="325" font-size="19">枕骨</text><path d="M217 399 L303 399 L318 471 Q255 515 202 471 Z" fill="#B8C9B9"/><text x="223" y="449" font-size="20">后颈</text><rect x="201" y="243" width="117" height="32" rx="15" fill="#C6B4A8"/><text x="202" y="265" font-size="15">刘海/脸周</text><text x="54" y="546" font-size="17">分区边界以门店六区标准图复核；此处仅示意功能。</text><text x="542" y="139" font-size="24" fill="#2F3B37">各区任务 → 检查交界</text><text x="542" y="189" font-size="19">顶部：有限支撑，避免尖高</text><text x="542" y="237" font-size="19">左右：脸周宽窄、第一弯</text><text x="542" y="285" font-size="19">枕骨：后脑圆度，避免台阶</text><text x="542" y="333" font-size="19">后颈：底线重量与肩颈空间</text><text x="542" y="381" font-size="19">刘海/脸周：流向与可见额头</text><line x1="544" y1="405" x2="947" y2="405" stroke="#8B9A8B" stroke-width="2"/><text x="542" y="445" font-size="19" fill="#995B49">交界检查：发长 / 层次 / 第一弯 / 束感</text><text x="542" y="480" font-size="19" fill="#995B49">杠轴 / 提升角 / 温和张力 / 圈数</text><text x="542" y="538" font-size="17">图中均为设计箭头及位置概念，非用药次序。</text><text x="37" y="607" font-size="17" fill="#995B49">仅公仔头无药无热几何教学，非真人热烫参数或实测效果。</text></svg>
