<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="610" viewBox="0 0 1020 610"><title>教学示意：局部C/S曲率、毛束排列与整体轮廓是不同层次</title><rect width="1020" height="610" rx="28" fill="#F7F3ED"/><text x="42" y="57" font-size="28" fill="#303538">原理图 · 相同局部卷度，不等于相同整体体积</text><rect x="35" y="86" width="290" height="470" rx="22" fill="#D6E2E9"/><rect x="365" y="86" width="290" height="470" rx="22" fill="#DCE5DD"/><rect x="695" y="86" width="290" height="470" rx="22" fill="#E9DCE0"/><text x="62" y="137" font-size="24" fill="#303538">① 单束曲线</text><path d="M100 195 C210 145 125 290 220 275 S180 415 245 440" stroke="#4F6670" stroke-width="13" fill="none" stroke-linecap="round"/><text x="70" y="484" font-size="20">观察 C / S 弯曲形状</text><text x="70" y="515" font-size="17" fill="#5A656A">不是整头宽度</text><text x="392" y="137" font-size="24">② 毛束聚拢</text><path d="M465 185 Q445 280 485 345 T473 448 M493 185 Q475 280 510 345 T502 448 M522 185 Q495 280 532 345 T524 448" stroke="#648475" stroke-width="9" fill="none"/><text x="392" y="484" font-size="20">方向相近 → 束感集中</text><text x="392" y="515" font-size="17" fill="#52675D">光泽与重量仍受发质影响</text><text x="721" y="137" font-size="24">③ 头部外轮廓</text><ellipse cx="840" cy="273" rx="58" ry="87" fill="#E7D8C8" stroke="#756B67" stroke-width="2"/><path d="M807 189 C741 193 743 284 734 324 C710 415 764 446 748 468 M875 189 C937 191 957 281 950 333 C970 418 926 451 935 469" stroke="#A17D87" stroke-width="22" fill="none" stroke-linecap="round"/><line x1="721" y1="349" x2="969" y2="349" stroke="#B56E57" stroke-width="2" stroke-dasharray="7 6"/><text x="731" y="484" font-size="20">最大宽度取决于分区重量</text><text x="731" y="515" font-size="17">并非局部弯曲越大越宽</text><text x="42" y="584" font-size="17" fill="#9F604C">仅为原创概念示意，不是毛发显微测量、真人结果或审美定律。</text></svg>
