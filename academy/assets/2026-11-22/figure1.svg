<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"><title>入水沉浮、表面润湿与内部孔隙是不同指标</title><rect width="760" height="400" rx="18" fill="#F7F3ED"/><text x="32" y="45" font-size="26" font-family="sans-serif" fill="#30373A">入水沉浮 ≠ 内部孔隙测量</text><g font-family="sans-serif" text-anchor="middle"><rect x="25" y="77" width="218" height="262" rx="16" fill="#DEE8E9"/><rect x="271" y="77" width="218" height="262" rx="16" fill="#E0E9DF"/><rect x="517" y="77" width="218" height="262" rx="16" fill="#EEDFDA"/><text x="134" y="112" fill="#36545A" font-size="20">表面沉浮</text><text x="380" y="112" fill="#405A4B" font-size="20">水汽吸附与膨润</text><text x="626" y="112" fill="#70554C" font-size="20">内部孔体积</text><path d="M46 217Q134 198 223 217" fill="none" stroke="#719BA9" stroke-width="5"/><path d="M61 199L206 199" stroke="#836E5D" stroke-width="9" stroke-linecap="round"/><circle cx="173" cy="179" r="10" fill="white" stroke="#719BA9"/><path d="M312 154L445 154L445 256L312 256Z" fill="none" stroke="#739A8E" stroke-width="5"/><g fill="#9EBEB1"><circle cx="330" cy="176" r="9"/><circle cx="360" cy="196" r="9"/><circle cx="405" cy="174" r="9"/><circle cx="431" cy="212" r="9"/><circle cx="370" cy="237" r="9"/></g><ellipse cx="627" cy="201" rx="68" ry="58" fill="#D0B9AA" stroke="#977769" stroke-width="4"/><g fill="#F7F3ED"><circle cx="600" cy="186" r="8"/><circle cx="647" cy="176" r="11"/><circle cx="622" cy="217" r="16"/><circle cx="661" cy="220" r="7"/></g><g fill="#495B59" font-size="15"><text x="134" y="284">浮沉受气泡、表面张力</text><text x="134" y="305">和操作状态影响</text><text x="380" y="284">仪器控制相对湿度</text><text x="380" y="305">研究吸湿与结构响应</text><text x="626" y="284">孔径、孔体积与面积</text><text x="626" y="305">需要材料学测量</text></g></g><text x="380" y="374" text-anchor="middle" font-size="16" fill="#936E62">三者可能有关，但不能用一杯水的沉浮直接互换</text></svg>