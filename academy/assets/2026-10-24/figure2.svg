<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530"><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#638778"/></marker></defs><rect width="960" height="530" rx="28" fill="#F8F5EF"/><text x="45" y="61" font-size="29" font-weight="bold" fill="#41494A">三段历史｜排杠前先划定安全有效发长</text><text x="45" y="94" font-size="18" fill="#68786E">原创头模教学示意，不表示药水涂放顺序或具体软化终点</text><ellipse cx="282" cy="221" rx="120" ry="111" fill="#E7DDD0" stroke="#8F9E90" stroke-width="4"/><path d="M210 133Q139 236 165 320Q151 387 180 452" fill="none" stroke="#A5B6A9" stroke-width="14"/><path d="M351 132Q420 244 401 333Q427 384 391 451" fill="none" stroke="#A5B6A9" stroke-width="14"/><path d="M202 132Q171 205 177 250" fill="none" stroke="#6A9380" stroke-width="12"/><path d="M177 250Q162 318 170 390" fill="none" stroke="#B7A788" stroke-width="12"/><path d="M170 390L180 452" fill="none" stroke="#C68477" stroke-width="12"/><path d="M287 130Q329 152 315 204" fill="none" stroke="#638778" stroke-width="5" marker-end="url(#b)"/><path d="M336 281Q365 294 347 330" fill="none" stroke="#638778" stroke-width="5" marker-end="url(#b)"/><rect x="483" y="126" width="420" height="95" rx="17" fill="#D7E5DC"/><text x="507" y="162" fill="#43584B" font-size="22" font-weight="bold">① 新生区：确认原始基线</text><text x="507" y="198" fill="#43584B" font-size="17">直径、回弹、毛流与产品适用范围</text><rect x="483" y="240" width="420" height="95" rx="17" fill="#EEE5D4"/><text x="507" y="275" fill="#605948" font-size="22" font-weight="bold">② 染后中段：单独观察</text><text x="507" y="312" fill="#605948" font-size="17">不要把新生区的表现直接套用</text><rect x="483" y="355" width="420" height="102" rx="17" fill="#EEDDD8"/><text x="507" y="391" fill="#6B4943" font-size="22" font-weight="bold">③ 旧漂发尾：安全界限</text><text x="507" y="428" fill="#6B4943" font-size="17">异常伸长／失弹／发黏／断丝，停</text><text x="45" y="490" font-size="18" fill="#9D6C5D">先标出可安全参与的长度，再确定第一弯、杠径与圈数</text></svg>