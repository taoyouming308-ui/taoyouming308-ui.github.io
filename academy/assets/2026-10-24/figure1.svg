<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#AA7567"/></marker></defs><rect width="960" height="520" rx="28" fill="#F8F5EF"/><text x="48" y="62" font-size="30" font-weight="bold" fill="#41494A">能伸长，与能回弹，是两项不同观察</text><text x="48" y="96" font-size="18" fill="#637176">原创材料学教学示意｜不能据示意图推算二硫键断裂率</text><rect x="45" y="132" width="420" height="314" rx="20" fill="#DAE6E9"/><rect x="496" y="132" width="420" height="314" rx="20" fill="#EADCD6"/><text x="75" y="179" font-size="23" font-weight="bold" fill="#3D535B">A · 轻拉后能够恢复</text><text x="526" y="179" font-size="23" font-weight="bold" fill="#704D49">B · 伸长后不易恢复</text><path d="M125 215Q80 279 125 342" stroke="#527C8D" stroke-width="11" fill="none"/><path d="M280 215Q325 279 280 342" stroke="#527C8D" stroke-width="11" fill="none"/><path d="M160 275H250" stroke="#AA7567" stroke-width="4" marker-end="url(#a)"/><text x="83" y="397" font-size="18" fill="#3D535B">观察：撤去轻微拉力后的回弹</text><path d="M569 210Q609 275 633 369" stroke="#AE827B" stroke-width="11" fill="none"/><path d="M738 210Q785 278 814 369" stroke="#AE827B" stroke-width="11" fill="none"/><path d="M658 278H731" stroke="#AA7567" stroke-width="4" marker-end="url(#a)"/><text x="534" y="397" font-size="18" fill="#704D49">观察：发黏、异常延伸或断丝</text><text x="50" y="481" font-size="18" fill="#A06D5E">判断顺序：历史 → 初始湿态 → 小幅拉伸 → 回弹 → 是否损伤异常</text></svg>