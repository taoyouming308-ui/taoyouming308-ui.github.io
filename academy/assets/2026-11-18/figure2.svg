<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 354"><rect width="720" height="354" rx="20" fill="#F7F4EF"/><text x="25" y="37" font-size="22" font-weight="600" fill="#374643">技术：八步先定长度与主S，六区再分配终点</text><ellipse cx="207" cy="192" rx="129" ry="136" fill="#E1E9E1" stroke="#829D8D" stroke-width="3"/><path d="M90 153Q207 112 324 153M86 251Q207 213 324 251M207 57V324" stroke="#77978B" stroke-width="2" fill="none"/><rect x="160" y="90" width="93" height="51" rx="10" fill="#C0DADB"/><rect x="94" y="164" width="101" height="56" rx="9" fill="#EBD9D3"/><rect x="219" y="164" width="101" height="56" rx="9" fill="#EBD9D3"/><rect x="163" y="258" width="90" height="42" rx="9" fill="#CADCCB"/><g text-anchor="middle" font-size="15" fill="#465A50"><text x="207" y="118">顶部·柔C</text><text x="144" y="197">左侧·脸周</text><text x="269" y="197">右侧·流向</text><text x="208" y="285">后颈·重量</text></g><g stroke="#B88574" stroke-width="3" fill="none"><path d="M117 216Q96 244 114 267M298 216Q324 244 305 267M214 299V322"/></g><g fill="#405B54" font-size="16"><text x="379" y="105">① 顶部：哪些发束承担支撑？</text><text x="379" y="145">② 两侧：第一弯落下颌以下</text><text x="379" y="185">③ 枕骨：避免短发尾与主峰叠加</text><text x="379" y="225">④ 后颈：保留主S需要的长度</text><text x="379" y="265">⑤ 刘海脸周：弱C和耳后连接</text></g><text x="380" y="313" font-size="13" fill="#9E735F">箭头为几何衔接，不是药剂涂放方向</text></svg>
