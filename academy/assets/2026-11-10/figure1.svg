<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540"><title>原理图：还原→水洗→氧化</title><rect width="900" height="540" rx="24" fill="#F7F3EC"/><text x="35" y="53" font-size="26" fill="#343A3C">原理图 · 还原 → 水洗 → 氧化</text><rect x="35" y="90" width="270" height="325" rx="18" fill="#B4C9D1"/><text x="60" y="135" font-size="23" fill="#303638">还原</text><rect x="328" y="90" width="270" height="325" rx="18" fill="#B4C5B9"/><text x="353" y="135" font-size="23" fill="#303638">水洗</text><rect x="621" y="90" width="270" height="325" rx="18" fill="#D8BCC4"/><text x="646" y="135" font-size="23" fill="#303638">配套氧化</text><text x="60" y="202" font-size="17">毛鳞片 / 皮质层</text><text x="60" y="242" font-size="17">部分二硫键被还原</text><text x="60" y="282" font-size="16">接触 ≠ 全部完成</text><text x="352" y="202" font-size="17">降低可洗出的还原剂</text><text x="352" y="242" font-size="17">部分交联平衡变化</text><text x="352" y="282" font-size="16">水清 ≠ 内部零残留</text><text x="646" y="202" font-size="17">部分共价交联重建</text><text x="646" y="242" font-size="17">不可擅自替换二剂</text><text x="646" y="282" font-size="16">水洗不代替氧化</text><path d="M280 352 L323 352 M574 352 L615 352" stroke="#6C7A7C" stroke-width="5"/><polygon points="323,352 309,344 309,360" fill="#6C7A7C"/><polygon points="615,352 601,344 601,360" fill="#6C7A7C"/><text x="45" y="474" font-size="16">教学示意：非残留浓度测定、非安全冲洗分钟数</text></svg>