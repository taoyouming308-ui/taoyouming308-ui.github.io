<g font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#2E2B29"><text x="75" y="197">后脑分区（教学图）</text><text x="82" y="621">同区检查：湿润感 / 不滴水 / 纸尾平整</text></g>
<rect x="587" y="164" width="562" height="480" rx="26" fill="#D7E2EA"/>
<g font-family="Noto Sans CJK SC, PingFang SC, sans-serif" fill="#2E2B29"><text x="615" y="206" font-size="29" font-weight="bold">候选排杠观察表</text><text x="623" y="267" font-size="23">顶部：轻 C 支撑｜60–80°｜28–32 mm</text><text x="623" y="322" font-size="23">枕部：轻圆弧衔接｜45–70°｜24–28 mm</text><text x="623" y="377" font-size="23">两侧：首弯下移｜25–50°｜30–34 mm</text><text x="623" y="432" font-size="23">后颈：控量留白｜0–25°｜不卷/大杠</text><text x="623" y="487" font-size="23">刘海：顺分缝毛流｜20–45°｜可不卷</text><text x="623" y="555" font-size="20">角度相对局部头皮切线；不是设备参数</text><text x="623" y="589" font-size="20">实际杠体外径优先于“14/16/18号”</text></g>
<text x="58" y="683" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" fill="#A16959" font-size="22">风险边界：染漂旧尾若湿态异常软黏、拉伸不回弹或易断，退出化学热烫范围。</text></svg>