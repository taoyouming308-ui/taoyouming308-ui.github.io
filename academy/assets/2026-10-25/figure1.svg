<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><rect width="960" height="520" rx="24" fill="#F9F6EF"/><text x="46" y="62" font-size="30" fill="#41484A">表面接触 ≠ 已经测得内部还原程度</text><text x="46" y="100" font-size="18" fill="#707878">毛鳞片／皮质层示意，不是显微照片和化学测量</text><rect x="45" y="134" width="425" height="300" rx="20" fill="#DFE8EC"/><rect x="490" y="134" width="425" height="300" rx="20" fill="#E3EADF"/><text x="75" y="176" font-size="23" fill="#425962">外表：接触与润湿</text><text x="523" y="176" font-size="23" fill="#527061">内部：进入与反应</text><ellipse cx="254" cy="294" rx="125" ry="83" stroke="#738F97" stroke-width="14" fill="#F7F6EE"/><ellipse cx="254" cy="294" rx="91" ry="57" fill="#BDD0D0"/><ellipse cx="702" cy="294" rx="125" ry="83" stroke="#789589" stroke-width="14" fill="#F7F6EE"/><ellipse cx="702" cy="294" rx="91" ry="57" fill="#C0D1C7"/><g fill="none" stroke="#AE7C6B" stroke-width="5"><path d="M86 292H134"/><path d="M534 292H584"/><path d="M594 292H641"/></g><text x="84" y="414" font-size="17" fill="#555">不能由手感推断皮质断键率</text><text x="535" y="414" font-size="17" fill="#555">渗透须有受控实验依据</text><text x="45" y="479" font-size="20" fill="#A77568">记住：接触 → 扩散 → 结构反应 → 几何成形，是不同环节。</text></svg>