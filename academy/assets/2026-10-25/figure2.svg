<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><rect width="960" height="520" rx="24" fill="#F9F6EF"/><text x="44" y="61" font-size="30" fill="#41484A">顶部—两侧—枕骨—后颈：分区与贴杠</text><text x="45" y="100" font-size="18" fill="#707878">公仔头无热无药练习图；箭头示卷入方向，不是涂药流程</text><rect x="42" y="128" width="424" height="332" rx="20" fill="#E2EADF"/><rect x="492" y="128" width="425" height="332" rx="20" fill="#EADFD7"/><ellipse cx="248" cy="292" rx="119" ry="138" fill="#F7F0E5" stroke="#6F8C7E" stroke-width="4"/><g fill="none" stroke="#6F8C7E" stroke-width="4" stroke-dasharray="8 5"><path d="M136 263Q250 195 359 263"/><path d="M145 348Q247 296 352 348"/><path d="M249 164V413"/></g><g font-size="20" fill="#516B60"><text x="218" y="211">顶部</text><text x="208" y="302">枕骨</text><text x="208" y="392">后颈</text><text x="87" y="302">侧</text><text x="385" y="302">侧</text></g><g stroke="#A9796B" stroke-width="4" fill="none"><path d="M180 236L147 260"/><path d="M305 236L339 260"/><path d="M174 340L147 366"/><path d="M313 340L337 368"/></g><text x="521" y="179" font-size="21" fill="#624F47">薄铺与层叠</text><g fill="#96AE9C"><rect x="537" y="214" width="145" height="25" rx="12"/><rect x="537" y="253" width="145" height="25" rx="12"/><rect x="537" y="292" width="145" height="25" rx="12"/></g><text x="699" y="251" font-size="20" fill="#4C6557">薄铺平整</text><g fill="#B48A7C"><rect x="542" y="354" width="145" height="29" rx="12"/><rect x="556" y="364" width="145" height="29" rx="12"/><rect x="570" y="374" width="145" height="29" rx="12"/></g><text x="725" y="380" font-size="19" fill="#7B544B">厚片遮蔽</text><text x="47" y="491" font-size="18" fill="#A77568">先检查发片能否贴杠，再判断其他条件；不能把贴合等于渗透。</text></svg>