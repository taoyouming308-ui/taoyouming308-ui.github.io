<g fill="#3F524C" font-size="15"><text x="345" y="87">① 顶部：顺根向，保留轻柔支撑</text><text x="345" y="128">② 左右：第一弯的方向分别记录</text><text x="345" y="169">③ 枕骨：避免侧后卷峰叠加</text><text x="345" y="210">④ 后颈：检查肩线和重量</text><text x="345" y="251">⑤ 刘海脸周：顺发旋，不强拉</text></g>
<text x="340" y="296" font-size="12" fill="#7C5B50">箭头仅表示观察方向；不是药剂涂放顺序</text>
