<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><title>头部分区与落杠点</title><desc>技术：发根毛流、夹具压力与相邻杠轴；原创教学示意，不是真实顾客或测量证据。</desc><rect width="960" height="560" fill="#F6F1E9"/><rect x="24" y="20" width="912" height="518" rx="22" fill="#FBFAF6" stroke="#D8D0C5"/><text x="55" y="78" font-family="sans-serif" font-size="31" fill="#384043">头部分区与落杠点</text><text x="55" y="112" font-family="sans-serif" font-size="17" fill="#737B7B">技术：发根毛流、夹具压力与相邻杠轴｜原创概念图</text><ellipse cx="280" cy="316" rx="164" ry="161" fill="#E5DED3" stroke="#8B8C82" stroke-width="4"/><path d="M141 285 Q275 169 421 289" stroke="#719996" stroke-width="10" fill="none"/><path d="M150 343 Q278 265 405 343" stroke="#8EA897" stroke-width="9" fill="none"/><path d="M185 396 Q279 351 378 396" stroke="#C2A3A1" stroke-width="9" fill="none"/><ellipse cx="281" cy="263" rx="45" ry="16" fill="#9CBBB5" stroke="#597A78" stroke-width="3"/><ellipse cx="179" cy="342" rx="32" ry="15" fill="#9CBBB5" stroke="#597A78" stroke-width="3"/><ellipse cx="375" cy="342" rx="32" ry="15" fill="#9CBBB5" stroke="#597A78" stroke-width="3"/><text x="86" y="207" font-family="sans-serif" font-size="18" fill="#384043">顶部</text><text x="365" y="242" font-family="sans-serif" font-size="18" fill="#384043">枕骨</text><text x="69" y="378" font-family="sans-serif" font-size="18" fill="#384043">左侧</text><text x="379" y="379" font-family="sans-serif" font-size="18" fill="#384043">右侧</text><text x="213" y="470" font-family="sans-serif" font-size="20" fill="#384043">后颈可不卷</text><rect x="499" y="150" width="384" height="321" rx="20" fill="#E7EEE9"/><text x="528" y="193" font-family="sans-serif" font-size="22" fill="#384043">同杠径，不同落杠点</text><line x1="528" y1="259" x2="841" y2="259" stroke="#737A78" stroke-width="5"/><path d="M539 259 Q604 207 685 282" stroke="#6B9C91" stroke-width="8" fill="none"/><path d="M539 259 L693 259 L705 293" stroke="#AC7969" stroke-width="8" fill="none"/><rect x="636" y="299" width="124" height="28" rx="14" fill="#97A99B"/><text x="525" y="369" font-family="sans-serif" font-size="20" fill="#384043">先顺毛流，再看夹具压点</text><text x="525" y="409" font-family="sans-serif" font-size="20" fill="#384043">张力与提升方向要连续</text><text x="53" y="515" font-family="sans-serif" font-size="19" fill="#906C5F">所有图中方向仅作公仔头无药、无热几何教学。</text></svg>