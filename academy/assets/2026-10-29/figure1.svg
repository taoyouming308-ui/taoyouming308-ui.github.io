<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><title>从柔和C到局部尖折</title><desc>原理：夹具接触与弯曲约束的区别；原创教学示意，不是真实顾客或测量证据。</desc><rect width="960" height="560" fill="#F6F1E9"/><rect x="24" y="20" width="912" height="518" rx="22" fill="#FBFAF6" stroke="#D8D0C5"/><text x="55" y="78" font-family="sans-serif" font-size="31" fill="#384043">从柔和C到局部尖折</text><text x="55" y="112" font-family="sans-serif" font-size="17" fill="#737B7B">原理：夹具接触与弯曲约束的区别｜原创概念图</text><rect x="58" y="145" width="406" height="329" rx="20" fill="#E3EDF0"/><rect x="490" y="145" width="406" height="329" rx="20" fill="#E8EDE7"/><text x="86" y="191" font-family="sans-serif" font-size="25" fill="#384043">A · 连续曲率</text><text x="520" y="191" font-family="sans-serif" font-size="25" fill="#384043">B · 局部尖折</text><path d="M104 258 Q200 230 233 316 Q271 425 415 398" fill="none" stroke="#557F85" stroke-width="13" stroke-linecap="round"/><path d="M545 258 L679 257 L688 337 Q749 419 855 397" fill="none" stroke="#A06E60" stroke-width="13" stroke-linecap="round"/><rect x="625" y="221" width="130" height="32" rx="14" fill="#A6AAA0"/><line x1="706" y1="282" x2="781" y2="324" stroke="#A06E60" stroke-width="3"/><text x="727" y="351" font-family="sans-serif" font-size="19" fill="#384043">折点/夹具附近</text><text x="91" y="452" font-family="sans-serif" font-size="19" fill="#384043">平顺过渡，不追求死折</text><text x="527" y="452" font-family="sans-serif" font-size="19" fill="#384043">先查杠位、毛流、张力</text><text x="56" y="515" font-family="sans-serif" font-size="18" fill="#906C5F">注意：形态推演，不能据图推算二硫键断裂率或安全加热参数。</text></svg>