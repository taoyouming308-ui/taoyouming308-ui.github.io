<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" font-family="-apple-system, PingFang SC, Noto Sans CJK SC, sans-serif"><title>历史地图不是损伤排序</title><rect x="0" y="0" width="1440" height="960" rx="0" fill="#f7f6f2" /><text x="70" y="78" font-size="44" fill="#283b38" text-anchor="start" font-weight="600">历史地图不是损伤排序</text><text x="70" y="124" font-size="28" fill="#596a66" text-anchor="start" font-weight="400">先定位，再判断 · 色块仅表示观察位置，不表示健康等级</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" stroke="#596a66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="90" y="240" width="280" height="98" rx="4" fill="#c9d9dd" /><text x="230.0" y="222" font-size="34" fill="#283b38" text-anchor="middle" font-weight="600">根</text><rect x="370" y="240" width="280" height="98" rx="4" fill="#d8d2df" /><text x="510.0" y="222" font-size="34" fill="#283b38" text-anchor="middle" font-weight="600">中</text><rect x="650" y="240" width="280" height="98" rx="4" fill="#e5d8c6" /><text x="790.0" y="222" font-size="34" fill="#283b38" text-anchor="middle" font-weight="600">尾</text><path d="M105 257 C350 249 680 265 918 257" stroke="#596a66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M105 276 C350 268 680 284 918 276" stroke="#596a66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M105 295 C350 287 680 303 918 295" stroke="#596a66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M105 314 C350 306 680 322 918 314" stroke="#596a66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="535" y="234" width="65" height="110" rx="0" fill="none" /><line x1="540" y1="239" x2="555" y2="334" stroke="#596a66" stroke-width="2" /><line x1="552" y1="239" x2="567" y2="334" stroke="#596a66" stroke-width="2" /><line x1="564" y1="239" x2="579" y2="334" stroke="#596a66" stroke-width="2" /><line x1="576" y1="239" x2="591" y2="334" stroke="#596a66" stroke-width="2" /><line x1="588" y1="239" x2="603" y2="334" stroke="#596a66" stroke-width="2" /><text x="455" y="385" font-size="28" fill="#283b38" text-anchor="start" font-weight="400">另记：重复处理界线</text><text x="90" y="425" font-size="28" fill="#596a66" text-anchor="start" font-weight="400">本例坐标，不是所有人的损伤顺序</text><text x="90" y="461" font-size="23" fill="#596a66" text-anchor="start" font-weight="400">示例状态，不对应根中尾的实测结论</text><text x="90" y="518" font-size="28" fill="#283b38" text-anchor="start" font-weight="600">历史</text><rect x="320" y="478" width="180" height="58" rx="10" fill="#ffffff" /><text x="410" y="517" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">已知</text><rect x="525" y="478" width="180" height="58" rx="10" fill="#ffffff" /><text x="615" y="517" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">待核</text><rect x="730" y="478" width="180" height="58" rx="10" fill="#ffffff" /><text x="820" y="517" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">未知</text><text x="90" y="595" font-size="28" fill="#283b38" text-anchor="start" font-weight="600">表面观察</text><rect x="320" y="555" width="180" height="58" rx="10" fill="#ffffff" /><text x="410" y="594" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">已知</text><rect x="525" y="555" width="180" height="58" rx="10" fill="#ffffff" /><text x="615" y="594" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">待核</text><rect x="730" y="555" width="180" height="58" rx="10" fill="#ffffff" /><text x="820" y="594" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">未知</text><text x="90" y="672" font-size="28" fill="#283b38" text-anchor="start" font-weight="600">力学表现</text><rect x="320" y="632" width="180" height="58" rx="10" fill="#ffffff" /><text x="410" y="671" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">已知</text><rect x="525" y="632" width="180" height="58" rx="10" fill="#ffffff" /><text x="615" y="671" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">待核</text><rect x="730" y="632" width="180" height="58" rx="10" fill="#ffffff" /><text x="820" y="671" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">未知</text><text x="90" y="749" font-size="28" fill="#283b38" text-anchor="start" font-weight="600">服务适用性</text><rect x="320" y="709" width="180" height="58" rx="10" fill="#ffffff" /><text x="410" y="748" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">已知</text><rect x="525" y="709" width="180" height="58" rx="10" fill="#ffffff" /><text x="615" y="748" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">待核</text><rect x="730" y="709" width="180" height="58" rx="10" fill="#ffffff" /><text x="820" y="748" font-size="26" fill="#596a66" text-anchor="middle" font-weight="400">未知</text><rect x="1010" y="190" width="360" height="635" rx="16" fill="#eeefea" /><rect x="1040" y="225" width="300" height="205" rx="16" fill="#c9d9dd" /><text x="1190" y="280" font-size="30" fill="#283b38" text-anchor="middle" font-weight="600">表面观察</text><text x="1070" y="345" font-size="26" fill="#596a66" text-anchor="start" font-weight="400">记录表面形态</text><text x="1070" y="391" font-size="26" fill="#596a66" text-anchor="start" font-weight="400">保留未知项</text><rect x="1040" y="466" width="300" height="205" rx="16" fill="#d8d2df" /><text x="1190" y="520" font-size="30" fill="#283b38" text-anchor="middle" font-weight="600">内部检测</text><text x="1070" y="583" font-size="26" fill="#596a66" text-anchor="start" font-weight="400">依据适用测量</text><text x="1070" y="630" font-size="24" fill="#596a66" text-anchor="start" font-weight="400">不由外观直接推断</text><text x="1035" y="727" font-size="28" fill="#596a66" text-anchor="start" font-weight="400">回答的问题不同</text><text x="1035" y="769" font-size="28" fill="#596a66" text-anchor="start" font-weight="400">不直接互相替代</text><text x="1040" y="810" font-size="22" fill="#596a66" text-anchor="start" font-weight="400">观察窗口，非解剖分层图</text><text x="70" y="904" font-size="26" fill="#596a66" text-anchor="start" font-weight="400">依据 S1、S2、S4 的教学转译｜非显微照片｜非诊断工具</text></svg>