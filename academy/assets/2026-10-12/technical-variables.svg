<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1040" font-family="-apple-system, PingFang SC, Noto Sans CJK SC, sans-serif"><title>分区、提升、杠径、方向、张力分别记录</title><rect x="0" y="0" width="1440" height="1040" rx="0" fill="#f7f6f2" /><text x="70" y="78" font-size="44" fill="#283b38" text-anchor="start" font-weight="600">分区、提升、杠径、方向、张力分别记录</text><text x="70" y="124" font-size="28" fill="#596a66" text-anchor="start" font-weight="400">练习头机械推演 · 无化学、无加热 · 教学几何关系，不是热烫参数表</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" stroke="#596a66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect x="70" y="168" width="570" height="500" rx="16" fill="#eeefea" /><ellipse cx="285" cy="396" rx="165" ry="200" fill="#ffffff" stroke="#596a66" stroke-width="4" /><path d="M267 198 L285 168 L303 198" stroke="#283b38" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="285" y="165" font-size="24" fill="#283b38" text-anchor="middle" font-weight="400">鼻尖朝上</text><rect x="218" y="255" width="134" height="135" rx="18" fill="#c9d9dd" /><text x="285" y="324" font-size="28" fill="#283b38" text-anchor="middle" font-weight="400">顶区</text><text x="170" y="418" font-size="25" fill="#283b38" text-anchor="middle" font-weight="400">左侧</text><text x="398" y="418" font-size="25" fill="#283b38" text-anchor="middle" font-weight="400">右侧</text><line x1="205" y1="250" x2="205" y2="481" stroke="#a4b5ae" stroke-width="3" /><line x1="365" y1="250" x2="365" y2="481" stroke="#a4b5ae" stroke-width="3" /><line x1="160" y1="482" x2="410" y2="482" stroke="#a4b5ae" stroke-width="3" /><text x="285" y="529" font-size="27" fill="#283b38" text-anchor="middle" font-weight="400">后枕</text><text x="285" y="574" font-size="25" fill="#283b38" text-anchor="middle" font-weight="400">轮廓区</text><text x="105" y="634" font-size="24" fill="#596a66" text-anchor="start" font-weight="400">俯视 · 图左为人物左侧</text><rect x="479" y="228" width="116" height="285" rx="8" fill="#d8d2df" /><line x1="450" y1="414" x2="474" y2="414" stroke="#596a66" stroke-width="2" /><line x1="487" y1="351" x2="580" y2="341" stroke="#596a66" stroke-width="2" /><line x1="487" y1="365" x2="580" y2="355" stroke="#596a66" stroke-width="2" /><line x1="487" y1="379" x2="580" y2="369" stroke="#596a66" stroke-width="2" /><line x1="487" y1="393" x2="580" y2="383" stroke="#596a66" stroke-width="2" /><line x1="487" y1="407" x2="580" y2="397" stroke="#596a66" stroke-width="2" /><line x1="487" y1="421" x2="580" y2="411" stroke="#596a66" stroke-width="2" /><text x="465" y="555" font-size="23" fill="#283b38" text-anchor="start" font-weight="400">右侧中段：</text><text x="465" y="587" font-size="23" fill="#283b38" text-anchor="start" font-weight="600">暂停化学处理</text><text x="465" y="619" font-size="23" fill="#283b38" text-anchor="start" font-weight="600">重新评估</text><path d="M790 480 Q1030 340 1270 480" stroke="#596a66" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="790" y1="410" x2="1340" y2="410" stroke="#596a66" stroke-width="2" stroke-dasharray="8 7" /><text x="835" y="492" font-size="24" fill="#283b38" text-anchor="start" font-weight="400">头皮切线（示意）</text><path d="M1030 410 L1193 223" stroke="#647b93" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M1123 410 Q1119 367 1090 344" stroke="#608d81" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1130" y="368" font-size="38" fill="#608d81" text-anchor="start" font-weight="400">α</text><text x="940" y="297" font-size="26" fill="#647b93" text-anchor="start" font-weight="400">提升方向</text><rect x="1162" y="175" width="150" height="55" rx="20" fill="#e5d8c6" /><line x1="1137" y1="202" x2="1350" y2="202" stroke="#283b38" stroke-width="3" marker-end="url(#arrow)" /><text x="1190" y="154" font-size="26" fill="#283b38" text-anchor="start" font-weight="400">杠轴</text><path d="M1206 161 C1323 146 1354 254 1249 268" stroke="#608d81" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="1198" y="310" font-size="26" fill="#608d81" text-anchor="start" font-weight="400">卷绕方向</text><text x="805" y="543" font-size="27" fill="#596a66" text-anchor="start" font-weight="400">本图以切线为参照</text><text x="805" y="581" font-size="24" fill="#596a66" text-anchor="start" font-weight="400">α 为角度符号，不是推荐数值</text><text x="805" y="623" font-size="26" fill="#596a66" text-anchor="start" font-weight="400">杠轴与卷绕方向分开记录</text><circle cx="235" cy="800" r="64" fill="#e5d8c6" stroke="#596a66" stroke-width="3" /><path d="M213.11 739.86 A64 64 0 0 1 298.94 797.13" stroke="#608d81" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="235" y="907" font-size="25" fill="#283b38" text-anchor="middle" font-weight="400">较缓几何弯曲</text><circle cx="530" cy="800" r="37" fill="#e5d8c6" stroke="#596a66" stroke-width="3" /><path d="M517.35 765.23 A37 37 0 1 1 539.06 835.87" stroke="#608d81" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="530" y="907" font-size="25" fill="#283b38" text-anchor="middle" font-weight="400">较紧几何弯曲</text><text x="93" y="712" font-size="25" fill="#596a66" text-anchor="start" font-weight="400">同长度柔性带 · 仅作定性几何比较</text><rect x="845" y="752" width="355" height="66" rx="3" fill="#c9d9dd" /><line x1="875" y1="839" x2="875" y2="745" stroke="#596a66" stroke-width="2" marker-end="url(#arrow)" /><line x1="923" y1="839" x2="923" y2="745" stroke="#596a66" stroke-width="2" marker-end="url(#arrow)" /><line x1="971" y1="839" x2="971" y2="745" stroke="#596a66" stroke-width="2" marker-end="url(#arrow)" /><line x1="1019" y1="839" x2="1019" y2="745" stroke="#596a66" stroke-width="2" marker-end="url(#arrow)" /><line x1="1067" y1="839" x2="1067" y2="745" stroke="#596a66" stroke-width="2" marker-end="url(#arrow)" /><line x1="1115" y1="839" x2="1115" y2="745" stroke="#596a66" stroke-width="2" marker-end="url(#arrow)" /><line x1="1163" y1="839" x2="1163" y2="745" stroke="#596a66" stroke-width="2" marker-end="url(#arrow)" /><text x="805" y="888" font-size="28" fill="#283b38" text-anchor="start" font-weight="400">张力均匀、可控</text><text x="805" y="930" font-size="26" fill="#596a66" text-anchor="start" font-weight="400">不拉长异常发段</text><text x="70" y="1008" font-size="24" fill="#596a66" text-anchor="start" font-weight="400">本例暂停化学烫｜S4、S5、S6 为独立观察项；具体产品与设备要求另行核对</text></svg>