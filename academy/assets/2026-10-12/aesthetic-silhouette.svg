<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="-apple-system, PingFang SC, Noto Sans CJK SC, sans-serif"><title>先决定线条在哪里转折</title><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#f7f6f2" /><text x="70" y="78" font-size="44" fill="#283b38" text-anchor="start" font-weight="600">先决定线条在哪里转折</text><text x="70" y="124" font-size="28" fill="#596a66" text-anchor="start" font-weight="400">目标：颧骨旁少扩张，下颌附近柔和转折 · 虚构成年人物，不是效果照片</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" stroke="#596a66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><text x="70" y="164" font-size="24" fill="#596a66" text-anchor="start" font-weight="400">无化学、无加热的轮廓讨论 · 同一虚构成年人物</text><text x="280" y="196" font-size="30" fill="#647b93" text-anchor="middle" font-weight="600">可讨论方案 A</text><path d="M210 363 C205 280 355 280 350 363 L342 451 Q320 518 280 537 Q240 518 218 451 Z" stroke="#596a66" stroke-width="3" fill="#ebe2d7" stroke-linecap="round" stroke-linejoin="round" /><line x1="240" y1="389" x2="260" y2="389" stroke="#596a66" stroke-width="2" /><line x1="300" y1="389" x2="320" y2="389" stroke="#596a66" stroke-width="2" /><path d="M280 398 L275 430 L286 430" stroke="#596a66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="267" y1="463" x2="293" y2="463" stroke="#596a66" stroke-width="2" /><path d="M249 531 L246 588 M311 531 L314 588 M130 655 Q280 562 430 655" stroke="#596a66" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 355 C102 367 127 641 150 750 M362 355 C458 367 433 641 410 750" stroke="#a4b5ae" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" /><path d="M280 278 C204 261 172 295 178 350 C125 361 138 441 160 486 Q188 603 159 740 M280 278 C356 261 388 295 382 350 C435 361 422 441 400 486 Q372 603 401 740" stroke="#647b93" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="280" y="797" font-size="23" fill="#596a66" text-anchor="middle" font-weight="400">同一人物 · 同一比例与发长</text><text x="710" y="196" font-size="30" fill="#608d81" text-anchor="middle" font-weight="600">本例偏好 B</text><path d="M640 363 C635 280 785 280 780 363 L772 451 Q750 518 710 537 Q670 518 648 451 Z" stroke="#596a66" stroke-width="3" fill="#ebe2d7" stroke-linecap="round" stroke-linejoin="round" /><line x1="670" y1="389" x2="690" y2="389" stroke="#596a66" stroke-width="2" /><line x1="730" y1="389" x2="750" y2="389" stroke="#596a66" stroke-width="2" /><path d="M710 398 L705 430 L716 430" stroke="#596a66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="697" y1="463" x2="723" y2="463" stroke="#596a66" stroke-width="2" /><path d="M679 531 L676 588 M741 531 L744 588 M560 655 Q710 562 860 655" stroke="#596a66" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M628 355 C532 367 557 641 580 750 M792 355 C888 367 863 641 840 750" stroke="#a4b5ae" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9" /><path d="M710 278 C634 261 602 295 608 350 C607 411 623 460 599 507 Q559 605 599 740 M710 278 C786 261 818 295 812 350 C813 411 797 460 821 507 Q861 605 821 740" stroke="#608d81" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="710" y="797" font-size="23" fill="#596a66" text-anchor="middle" font-weight="400">同一人物 · 同一比例与发长</text><text x="90" y="845" font-size="25" fill="#647b93" text-anchor="start" font-weight="400">颧骨旁扩张位置</text><text x="531" y="845" font-size="25" fill="#608d81" text-anchor="start" font-weight="400">下颌附近转折位置</text><path d="M1086 297 Q1188 239 1233 325 L1261 367 L1240 388 L1261 427 Q1240 485 1192 513 L1177 567" stroke="#596a66" stroke-width="3" fill="#ebe2d7" stroke-linecap="round" stroke-linejoin="round" /><path d="M1112 306 C1014 349 1046 514 1036 598 Q1055 664 1176 682 M1112 306 Q1201 257 1233 325 M1175 392 Q1138 472 1169 524 Q1215 605 1176 682" stroke="#608d81" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="1137" y1="288" x2="1325" y2="288" stroke="#a4b5ae" stroke-width="2" /><text x="1010" y="338" font-size="25" fill="#596a66" text-anchor="start" font-weight="400">自然顶高</text><line x1="1197" y1="498" x2="1325" y2="498" stroke="#a4b5ae" stroke-width="2" /><text x="1010" y="548" font-size="25" fill="#596a66" text-anchor="start" font-weight="400">下颌附近转折</text><line x1="1165" y1="652" x2="1325" y2="652" stroke="#a4b5ae" stroke-width="2" /><text x="1010" y="702" font-size="25" fill="#596a66" text-anchor="start" font-weight="400">尾端连贯收束</text><rect x="1008" y="742" width="345" height="153" rx="16" fill="#eeefea" /><ellipse cx="1090" cy="801" rx="18" ry="30" fill="none" stroke="#596a66" stroke-width="3" /><path d="M1060 766 Q1012 850 1109 857" stroke="#608d81" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1130" y="807" font-size="25" fill="#283b38" text-anchor="start" font-weight="400">耳后收发</text><text x="1028" y="875" font-size="25" fill="#596a66" text-anchor="start" font-weight="400">日常动作也要看</text><text x="70" y="906" font-size="24" fill="#596a66" text-anchor="start" font-weight="400">线色只区分方案，非发色变化或改造前后</text><text x="70" y="954" font-size="25" fill="#596a66" text-anchor="start" font-weight="400">设计目标可讨论；实现方式受发况约束｜B 不是普遍脸型规则｜非化学效果保证</text></svg>