 <rect x="62" y="625" width="1076" height="59" rx="12" fill="#ede6dd"/><text x="88" y="663" font-size="20" fill="#55504d">这是抽象人物教学图，不是真实顾客前后对比；具体方向以自然毛流与肩颈比例判断。</text>
