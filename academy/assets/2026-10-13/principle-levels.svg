<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960"><rect width="960" height="960" fill="#f6f4ef"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="40" y="58" font-size="38" fill="#293936" text-anchor="start">图1 · 卷度与蓬松：先区分观察层级</text><rect x="40" y="100" width="880" height="220" rx="20" fill="#fff" stroke="#d8dfda" stroke-width="2"/><text x="240" y="152" font-size="34" fill="#293936" text-anchor="start">① 毛束曲线</text><text x="240" y="212" font-size="28" fill="#293936" text-anchor="start">描述弯曲与卷数，记录湿 / 干状态。</text><text x="240" y="263" font-size="28" fill="#293936" text-anchor="start">不把一束的曲线当作整头结果。</text><path d="M90 250 C75 185 190 185 170 230 C150 265 92 265 102 214" fill="none" stroke="#507b6b" stroke-width="8"/><rect x="40" y="370" width="880" height="220" rx="20" fill="#fff" stroke="#d8dfda" stroke-width="2"/><text x="240" y="422" font-size="34" fill="#293936" text-anchor="start">② 发束落点</text><text x="240" y="482" font-size="28" fill="#293936" text-anchor="start">把位置写清：顶部、两侧或下缘。</text><text x="240" y="533" font-size="28" fill="#293936" text-anchor="start">同样曲线可处于不同观察位置。</text><ellipse cx="135" cy="475" rx="55" ry="78" fill="#eee7dd"/><circle cx="135" cy="397" r="13" fill="#507b6b"/><circle cx="196" cy="477" r="13" fill="#ae7357"/><rect x="40" y="640" width="880" height="220" rx="20" fill="#fff" stroke="#d8dfda" stroke-width="2"/><text x="240" y="692" font-size="34" fill="#293936" text-anchor="start">③ 人物轮廓</text><text x="240" y="752" font-size="28" fill="#293936" text-anchor="start">分别看上部空间、两侧宽度与维护目标。</text><text x="240" y="803" font-size="28" fill="#293936" text-anchor="start">是否符合本人诉求，需要另行验证。</text><path d="M68 820 Q50 650 135 674 Q220 650 202 820" fill="none" stroke="#507b6b" stroke-width="7"/><ellipse cx="135" cy="755" rx="36" ry="49" fill="#eee7dd"/><path d="M130 320 v30" stroke="#7b847c" stroke-width="3" stroke-dasharray="6 6"/><text x="240" y="351" font-size="26" fill="#293936" text-anchor="start">需另测 · 不画成确定的因果公式</text><path d="M130 590 v30" stroke="#7b847c" stroke-width="3" stroke-dasharray="6 6"/><text x="240" y="621" font-size="26" fill="#293936" text-anchor="start">需另测 · 不画成确定的因果公式</text><text x="40" y="917" font-size="27" fill="#293936" text-anchor="start">原创教学示意 · 非论文图、非数值模型、非效果保证</text></g></svg>