<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1090" viewBox="0 0 960 1090"><rect width="960" height="1090" fill="#f6f4ef"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="40" y="58" font-size="38" fill="#293936" text-anchor="start">图2 · “向上卷”不是完整技术记录</text><rect x="40" y="95" width="880" height="345" rx="20" fill="#fff" stroke="#d8dfda" stroke-width="2"/><text x="65" y="139" font-size="32" fill="#293936" text-anchor="start">同一发片：三个项目分别命名</text><path d="M110 320 Q260 230 410 320" fill="none" stroke="#9caaa0" stroke-width="7"/><path d="M130 275 L410 275" stroke="#9caaa0" stroke-width="3" stroke-dasharray="8 8"/><path d="M260 275 L260 175" stroke="#507b6b" stroke-width="8"/><path d="M251 190 L260 175 L269 190" fill="none" stroke="#507b6b" stroke-width="5"/><ellipse cx="350" cy="244" rx="35" ry="14" fill="#ddd3c5" stroke="#6b6052" stroke-width="3"/><path d="M334 233 Q366 220 374 244 Q366 268 334 255" fill="none" stroke="#ae7357" stroke-width="4"/><path d="M334 255 L346 253 L339 242" fill="none" stroke="#ae7357" stroke-width="4"/><path d="M210 285 L210 325 M310 285 L310 325" stroke="#7d648f" stroke-width="4"/><path d="M210 323 L310 323" stroke="#7d648f" stroke-width="3" stroke-dasharray="5 5"/><path d="M350 258 V328" stroke="#ae7357" stroke-width="3" stroke-dasharray="4 4"/><text x="112" y="358" font-size="23" fill="#293936" text-anchor="start">紫线＝分区边界</text><text x="470" y="215" font-size="27" fill="#293936" text-anchor="start">基座：杠的落点相对分区</text><text x="470" y="268" font-size="27" fill="#293936" text-anchor="start">提拉：发片相对局部切线</text><text x="470" y="321" font-size="27" fill="#293936" text-anchor="start">缠绕：绕杠的方向</text><text x="70" y="398" font-size="27" fill="#293936" text-anchor="start">灰虚线＝局部切线；箭头无通用角度或张力数值</text><rect x="40" y="470" width="880" height="475" rx="20" fill="#fff" stroke="#d8dfda" stroke-width="2"/><text x="65" y="520" font-size="32" fill="#293936" text-anchor="start">五区检查 · 不是整头统一加大卷度</text><text x="70" y="588" font-size="29" fill="#293936" text-anchor="start">顶部</text><text x="250" y="588" font-size="29" fill="#293936" text-anchor="start">分旋 / 自然落向 / 目标空间</text><text x="70" y="653" font-size="29" fill="#293936" text-anchor="start">枕骨区</text><text x="250" y="653" font-size="29" fill="#293936" text-anchor="start">后部过渡 / 头型待确认</text><text x="70" y="718" font-size="29" fill="#293936" text-anchor="start">两侧</text><text x="250" y="718" font-size="29" fill="#293936" text-anchor="start">最宽位置 / 允许的宽度</text><text x="70" y="783" font-size="29" fill="#293936" text-anchor="start">后颈</text><text x="250" y="783" font-size="29" fill="#293936" text-anchor="start">下缘 / 肩颈 / 自然发流</text><text x="70" y="848" font-size="29" fill="#293936" text-anchor="start">脸周</text><text x="250" y="848" font-size="29" fill="#293936" text-anchor="start">第一弯设想 / 收纳退路</text><text x="40" y="1000" font-size="27" fill="#293936" text-anchor="start">杠径、张力等只作现场记录，不给真人固定处方</text><text x="40" y="1045" font-size="27" fill="#293936" text-anchor="start">原创模型示意 · 无药剂、无热工具、非操作指导</text></g></svg>