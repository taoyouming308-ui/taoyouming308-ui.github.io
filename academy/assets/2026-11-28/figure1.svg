<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420"><title>外层覆盖与内层接触：两件不同的事</title><rect width="720" height="420" rx="16" fill="#f5f1e9"/><g font-family="sans-serif" fill="#394943"><text x="30" y="38" font-size="24">外层覆盖与内层接触：两件不同的事</text><rect x="30" y="65" width="315" height="285" rx="12" fill="#dce8eb"/><rect x="375" y="65" width="315" height="285" rx="12" fill="#dfe8dd"/><g font-size="19" text-anchor="middle"><text x="187" y="100">外层积膏</text><text x="532" y="100">分开观察内层</text></g><g stroke="#77695e" stroke-width="8" stroke-linecap="round"><path d="M70 154H302"/><path d="M415 154H647"/><path d="M70 184H302"/><path d="M415 184H647"/><path d="M70 214H302"/><path d="M415 214H647"/><path d="M70 244H302"/><path d="M415 244H647"/><path d="M70 274H302"/><path d="M415 274H647"/></g><g stroke="#a88c77" stroke-width="19" stroke-linecap="round"><path d="M70 135H302"/><path d="M70 295H302"/></g><g stroke="#8aa59b" stroke-width="7" stroke-linecap="round"><path d="M415 143H647"/><path d="M415 173H647"/><path d="M415 203H647"/><path d="M415 233H647"/><path d="M415 263H647"/></g><path d="M340 220H289m12 -9 -12 9 12 9M684 220H650m12 -9 -12 9 12 9" stroke="#b47e6d" stroke-width="3" fill="none"/><g font-size="17" text-anchor="middle"><text x="187" y="333">外观厚 ≠ 内层接触充分</text><text x="532" y="333">覆盖 ≠ 皮质内浓度</text><text x="360" y="390">示意图，非药剂渗透实测，也非涂药顺序</text></g></g></svg>