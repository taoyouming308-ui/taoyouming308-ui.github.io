<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420"><title>六区：密厚区的发片覆盖与卷向</title><rect width="720" height="420" rx="16" fill="#f5f1e9"/><g font-family="sans-serif" fill="#394943"><text x="30" y="38" font-size="24">六区：密厚区的发片覆盖与卷向</text><ellipse cx="190" cy="225" rx="145" ry="153" fill="#e2e9df" stroke="#819b8d" stroke-width="3"/><g fill="#bed6d7"><rect x="132" y="85" width="116" height="43" rx="8"/><rect x="132" y="138" width="116" height="43" rx="8"/></g><g fill="#c7d9c9"><rect x="57" y="191" width="82" height="89" rx="8"/><rect x="148" y="191" width="84" height="89" rx="8"/><rect x="241" y="191" width="82" height="89" rx="8"/></g><rect x="130" y="290" width="120" height="47" rx="8" fill="#dfc5b8"/><g font-size="17" text-anchor="middle"><text x="190" y="112">刘海脸周</text><text x="190" y="165">顶部</text><text x="98" y="239">左侧</text><text x="190" y="239">枕骨</text><text x="282" y="239">右侧</text><text x="190" y="320">后颈</text></g><g stroke="#b47e6d" stroke-width="3" fill="none"><path d="M325 224H382m-12 -9 12 9 -12 9"/><path d="M250 315H382m-12 -9 12 9 -12 9"/></g><g font-size="18"><text x="400" y="116">顶部：有限支撑</text><text x="400" y="154">脸周：保留覆盖</text><text x="400" y="199">枕骨密厚：分片检查</text><text x="400" y="237">两侧：错开主卷峰</text><text x="400" y="315">后颈：避免流挂与堆积</text><text x="400" y="354" font-size="14">箭头是观察路径，不是涂药顺序</text></g></g></svg>