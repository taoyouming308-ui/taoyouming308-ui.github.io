<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 550"><rect width="980" height="550" rx="22" fill="#F5F1EB"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#343536"><text x="40" y="60" font-size="28" font-weight="bold">技术图｜六区记录染烫历史与排杠任务</text><text x="42" y="90" font-size="17">先确认安全有效长度，再讨论C/S曲线；箭头不是药剂涂放顺序</text><ellipse cx="295" cy="313" rx="158" ry="185" fill="#E1E8DB" stroke="#779588" stroke-width="5"/><path d="M141 315Q296 231 448 315M294 130V490M159 401Q297 456 433 401" fill="none" stroke="#97AA9B" stroke-width="3" stroke-dasharray="8 7"/><g font-size="21"><text x="274" y="199">顶部</text><text x="172" y="340">左侧</text><text x="357" y="340">右侧</text><text x="265" y="281">枕骨</text><text x="269" y="442">后颈</text><text x="271" y="245">脸周</text></g><rect x="500" y="132" width="426" height="358" rx="18" fill="#FFFDFC" stroke="#D6E0D7"/><text x="520" y="181" font-size="21" font-weight="bold">每个发区先核实</text><g font-size="20"><text x="520" y="234">1  染剂日期和旧漂旧烫史</text><text x="520" y="286">2  断丝、失弹、头皮刺激</text><text x="520" y="338">3  安全有效长度和底线</text><text x="520" y="390">4  第一弯、杠轴与发流</text></g><text x="520" y="459" font-size="18" fill="#B07B6B">不由深棕色推算药力</text><text x="42" y="520" font-size="15">正式六区边界沿用门店标准图；本图不提供真人pH、时间或温度。</text></g></svg>
