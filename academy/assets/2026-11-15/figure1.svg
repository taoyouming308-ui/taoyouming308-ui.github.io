<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 550"><rect width="980" height="550" rx="22" fill="#F6F1EB"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#343536"><text x="42" y="60" font-size="29" font-weight="bold">原理图｜颜色显色与二硫键不是同一指标</text><text x="42" y="92" font-size="17">教学示意 · 色素状态与角蛋白结构必须分别记录</text><rect x="40" y="122" width="445" height="352" rx="20" fill="#DCE8E9"/><rect x="507" y="122" width="430" height="352" rx="20" fill="#E8DFD5"/><text x="66" y="165" font-size="22">氧化染色与色素</text><text x="529" y="165" font-size="22">还原与氧化的交联概念</text><rect x="92" y="230" width="333" height="125" rx="62" fill="#C6A68D" stroke="#927A6B" stroke-width="6"/><g fill="#685146"><circle cx="152" cy="267" r="9"/><circle cx="211" cy="300" r="10"/><circle cx="269" cy="269" r="9"/><circle cx="342" cy="298" r="10"/></g><path d="M539 244Q608 210 680 255T895 242M539 331Q608 289 680 329T895 329" fill="none" stroke="#65918D" stroke-width="12"/><g stroke="#B97D70" stroke-width="5"><line x1="614" y1="228" x2="614" y2="307"/><line x1="772" y1="230" x2="772" y2="305"/></g><text x="68" y="414" font-size="18">深棕不代表内部完全健康</text><text x="529" y="414" font-size="18">颜色不能推算二硫键反应</text><text x="44" y="515" font-size="15">色素点和联结线都是抽象符号，并非显微观察、实测含量或安全参数。</text></g></svg>
