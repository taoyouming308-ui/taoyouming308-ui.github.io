<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#F7F4EE"/><rect x="30" y="32" width="1140" height="696" rx="30" fill="#FFFFFF" stroke="#DED9CF" stroke-width="2"/><text x="75" y="99" font-family="Noto Sans CJK SC" font-size="33" font-weight="bold" fill="#303439">图2｜氧化操作前的分区核对</text><text x="75" y="136" font-family="Noto Sans CJK SC" font-size="19" fill="#656A6D">这是发片、接触与工序记录图，不是药剂涂布说明</text><line x1="75" y1="158" x2="1125" y2="158" stroke="#DED9CF" stroke-width="2"/><rect x="72" y="201" width="554" height="411" rx="24" fill="#F3F3ED"/><text x="102" y="249" font-family="Noto Sans CJK SC" font-size="27" fill="#303439" font-weight="bold">头部分区 / 二剂覆盖核查</text><ellipse cx="329" cy="432" rx="148" ry="179" fill="#E8E3D7" stroke="#928A81" stroke-width="5"/><path d="M230 295 Q329 245 430 295 L420 383 L233 384 Z" fill="#BCCAD0"/><path d="M233 390 L320 391 L320 516 L208 514 Z" fill="#D7C2B5"/><path d="M326 390 L420 388 L449 515 L323 519 Z" fill="#D4DED4"/><path d="M226 518 L431 518 L397 581 L260 585 Z" fill="#DABBB7"/><path d="M325 266 L325 591 M181 391 L472 391 M199 518 L449 518" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="11 10" fill="none"/><text x="292" y="331" font-family="Noto Sans CJK SC" font-size="19" fill="#303439" font-weight="bold">顶区</text><text x="238" y="450" font-family="Noto Sans CJK SC" font-size="19" fill="#303439" font-weight="bold">左侧</text><text x="336" y="450" font-family="Noto Sans CJK SC" font-size="19" fill="#303439" font-weight="bold">右侧</text><text x="280" y="561" font-family="Noto Sans CJK SC" font-size="19" fill="#303439" font-weight="bold">后颈</text><path d="M445 305 L519 274" stroke="#8B9CA5" stroke-width="3" fill="none"/><text x="475" y="270" font-family="Noto Sans CJK SC" font-size="16" fill="#303439">首尾片时差</text><rect x="650" y="204" width="466" height="406" rx="23" fill="#EDF2F1"/><text x="682" y="254" font-family="Noto Sans CJK SC" font-size="28" fill="#303439" font-weight="bold">逐片观察四个变量</text><circle cx="695" cy="305" r="10" fill="#80958A"/><text x="721" y="311" font-family="Noto Sans CJK SC" font-size="22" fill="#303439" font-weight="bold">01  接触范围</text><text x="722" y="341" font-family="Noto Sans CJK SC" font-size="17" fill="#303439">覆盖是否到达设计发段</text><circle cx="695" cy="385" r="10" fill="#80958A"/><text x="721" y="391" font-family="Noto Sans CJK SC" font-size="22" fill="#303439" font-weight="bold">02  发片厚度</text><text x="722" y="421" font-family="Noto Sans CJK SC" font-size="17" fill="#303439">厚片内外差异、纸尾折叠</text><circle cx="695" cy="465" r="10" fill="#80958A"/><text x="721" y="471" font-family="Noto Sans CJK SC" font-size="22" fill="#303439" font-weight="bold">03  操作时序</text><text x="722" y="501" font-family="Noto Sans CJK SC" font-size="17" fill="#303439">分区先后及厂家规定步骤</text><circle cx="695" cy="545" r="10" fill="#80958A"/><text x="721" y="551" font-family="Noto Sans CJK SC" font-size="22" fill="#303439" font-weight="bold">04  化学历史</text><text x="722" y="581" font-family="Noto Sans CJK SC" font-size="17" fill="#303439">漂损旧尾必须先判耐受</text><text x="82" y="655" font-family="Noto Sans CJK SC" font-size="19" fill="#7E6260">记录操作，不凭卷度松紧推断“氧化百分比”。</text><text x="75" y="691" font-family="Noto Sans CJK SC" font-size="16" fill="#73777A">烫发研习院 · 2026.10.18 · 原创教学示意，非实验照片/安全配方</text></svg>