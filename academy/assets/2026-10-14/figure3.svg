<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="锁骨中发卷度位置美感对比示意图"><title>锁骨中发卷度位置美感对比示意图</title><rect x="0" y="0" width="900" height="520" rx="24" fill="#FFFDFC" /><text x="450" y="45" fill="#2E2B29" font-size="30" font-weight="700" text-anchor="middle" font-family="PingFang SC,Microsoft Yahei,sans-serif">同一人物：不同卷度位置带来不同轮廓</text><ellipse cx="245" cy="235" rx="100" ry="145" fill="#EEDFD4" stroke="#CFC7BE" stroke-width="3" /><path d="M155 145 C80 210 90 285 153 365 M335 145 C410 210 400 285 337 365" stroke="#A47158" stroke-width="16" fill="none" stroke-linecap="round" /><ellipse cx="245" cy="235" rx="170" ry="60" fill="none" stroke="#A47158" stroke-width="5" stroke-dasharray="10 8" /><text x="245" y="420" fill="#A47158" font-size="18" font-weight="700" text-anchor="middle" font-family="PingFang SC,Microsoft Yahei,sans-serif">最大体积与颧骨最宽处重叠</text><text x="245" y="485" fill="#2E2B29" font-size="22" font-weight="700" text-anchor="middle" font-family="PingFang SC,Microsoft Yahei,sans-serif">A｜颧骨区膨胀</text><ellipse cx="655" cy="235" rx="100" ry="145" fill="#EEDFD4" stroke="#CFC7BE" stroke-width="3" /><path d="M569 145 C545 225 505 305 560 380 M741 145 C765 225 805 305 750 380" stroke="#74816C" stroke-width="16" fill="none" stroke-linecap="round" /><line x1="655" y1="92" x2="655" y2="48" stroke="#708595" stroke-width="6" /><ellipse cx="655" cy="320" rx="155" ry="70" fill="none" stroke="#74816C" stroke-width="5" stroke-dasharray="10 8" /><text x="655" y="420" fill="#74816C" font-size="18" font-weight="700" text-anchor="middle" font-family="PingFang SC,Microsoft Yahei,sans-serif">轮廓增高，主要纹理落在下半区</text><text x="655" y="485" fill="#2E2B29" font-size="22" font-weight="700" text-anchor="middle" font-family="PingFang SC,Microsoft Yahei,sans-serif">B｜顶部支撑、纹理下移</text></svg>