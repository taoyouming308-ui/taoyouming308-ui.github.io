<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect x="0" y="0" width="900" height="520" rx="24" fill="#FFFDFC"/><text x="450" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#2E2B29">pH只是一个变量：还原表现由系统共同决定</text><rect x="45" y="95" width="185" height="180" rx="22" fill="#D7E2EA"/><text x="137" y="145" text-anchor="middle" font-size="21" font-weight="700" fill="#708595">活性还原剂</text><text x="137" y="185" text-anchor="middle" font-size="16" font-weight="400" fill="#746F69">种类与反应形态</text><circle cx="137" cy="230" r="20" fill="#708595"/>
 <rect x="255" y="95" width="185" height="180" rx="22" fill="#DCE4D4"/><text x="347" y="145" text-anchor="middle" font-size="21" font-weight="700" fill="#74816C">有效浓度</text><text x="347" y="185" text-anchor="middle" font-size="16" font-weight="400" fill="#746F69">含量与可反应比例</text><circle cx="347" cy="230" r="20" fill="#74816C"/>
 <rect x="465" y="95" width="185" height="180" rx="22" fill="#E8D8D2"/><text x="557" y="145" text-anchor="middle" font-size="21" font-weight="700" fill="#A07870">配方环境</text><text x="557" y="185" text-anchor="middle" font-size="16" font-weight="400" fill="#746F69">pH、缓冲与载体</text><circle cx="557" cy="230" r="20" fill="#A07870"/>
 <rect x="675" y="95" width="185" height="180" rx="22" fill="#E9E2D6"/><text x="767" y="145" text-anchor="middle" font-size="21" font-weight="700" fill="#A47158">现场条件</text><text x="767" y="185" text-anchor="middle" font-size="16" font-weight="400" fill="#746F69">发质、时间与温度</text><circle cx="767" cy="230" r="20" fill="#A47158"/>
 <rect x="170" y="330" width="560" height="95" rx="24" fill="#E5CDBD"/><text x="450" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#A47158">最终：软化、卷度、弹性、持久度、损伤</text><text x="450" y="405" text-anchor="middle" font-size="19" font-weight="700" fill="#2E2B29">不能只凭一个 pH 数字预测</text><text x="450" y="480" text-anchor="middle" font-size="16" font-weight="400" fill="#746F69">pH 9.0 与 5.5 的数值平均也不等于混合液必然为 7.25</text></svg>