<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="#f5f1e9"/><text x="55" y="70" fill="#333a3b" font-size="32" font-weight="700">六区：化学历史分层，再分配C／S执行任务</text><text x="55" y="107" fill="#747b75" font-size="18">教学简图不替代门店正式六区边界｜箭头非药剂涂放顺序</text>
<ellipse cx="320" cy="320" rx="182" ry="218" fill="#e8e2d8" stroke="#526a63" stroke-width="4"/>
<path d="M160 250 Q320 130 480 250" stroke="#bca58f" stroke-width="5" fill="none"/>
<path d="M320 104 L320 532 M160 320 L480 320 M215 445 Q320 405 425 445" stroke="#fffaf2" stroke-width="8" fill="none"/>
<path d="M190 200 Q320 160 448 200" stroke="#8098a2" stroke-width="4" fill="none"/>
<text x="320" y="205" text-anchor="middle" font-size="24" fill="#384c50">顶部：柔C支撑</text>
<text x="234" y="305" text-anchor="middle" font-size="22" fill="#384c50">左侧</text><text x="402" y="305" text-anchor="middle" font-size="22" fill="#384c50">右侧</text>
<text x="320" y="397" text-anchor="middle" font-size="24" fill="#384c50">枕骨：衔接</text><text x="320" y="486" text-anchor="middle" font-size="23" fill="#384c50">后颈：重量</text><text x="320" y="552" text-anchor="middle" font-size="19" fill="#8d6b59">刘海脸周另查发旋与毛流</text>
<rect x="570" y="170" width="560" height="350" rx="22" fill="#dce4db"/>
<text x="605" y="220" font-size="24" fill="#40584f">每区先问三件事</text>
<text x="605" y="281" font-size="23" fill="#3a4946">① 新生 / 染后 / 旧漂 / 曾烫的边界在哪里？</text>
<text x="605" y="345" font-size="23" fill="#3a4946">② 异常失弹、发黏、断丝等停止信号？</text>
<text x="605" y="409" font-size="23" fill="#3a4946">③ 安全有效长度能否容纳目标第一弯？</text>
<text x="605" y="473" font-size="20" fill="#9a6851">药剂、时间、氧化只按实际厂家完整说明。</text>
<text x="65" y="611" font-size="22" fill="#4b5a55">连接线：顶部→枕骨；两侧→侧枕；枕骨→后颈，关注第一弯和体积重心。</text>
</svg>
