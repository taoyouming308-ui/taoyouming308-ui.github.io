<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440"><rect width="920" height="440" rx="22" fill="#F6F1EA"/><text x="34" y="52" font-size="30" fill="#34403F">图二｜分区排杠与流程核验</text><ellipse cx="258" cy="230" rx="145" ry="139" fill="#E8E0D4" stroke="#34403F" stroke-width="3"/><path d="M125 199 Q253 87 387 201" fill="none" stroke="#8EAAB7" stroke-width="24"/><path d="M135 261 Q260 185 381 264" fill="none" stroke="#9AAFA3" stroke-width="25"/><path d="M173 330 Q259 284 344 330" fill="none" stroke="#CEAAAC" stroke-width="24"/><text x="239" y="143" font-size="19" fill="#34403F">顶区</text><text x="153" y="249" font-size="18" fill="#34403F">左侧</text><text x="309" y="249" font-size="18" fill="#34403F">右侧</text><text x="230" y="290" font-size="18" fill="#34403F">枕骨</text><text x="229" y="348" font-size="18" fill="#34403F">后颈</text><rect x="452" y="115" width="424" height="86" rx="16" fill="#DDE8EB"/><text x="472" y="149" font-size="20" fill="#34403F">一、发片均匀、尾纸平顺</text><text x="472" y="177" font-size="16" fill="#34403F">避免压根、折痕与局部强张力</text><rect x="452" y="214" width="424" height="86" rx="16" fill="#DDE8DF"/><text x="472" y="249" font-size="20" fill="#34403F">二、按毛流调整方向与圈数</text><text x="472" y="277" font-size="16" fill="#34403F">后颈可不卷，左右不机械镜像</text><rect x="452" y="314" width="424" height="86" rx="16" fill="#EEDCDF"/><text x="472" y="348" font-size="20" fill="#34403F">三、冷却与氧化只按厂家执行</text><text x="472" y="377" font-size="16" fill="#34403F">图中没有真人温度或涂放参数</text></svg>