<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440"><rect width="920" height="440" rx="22" fill="#F6F1EA"/><text x="34" y="52" font-size="30" fill="#34403F">图一｜降温不是二剂</text><text x="34" y="85" font-size="17" fill="#34403F">机理拆解：仅教学概念，实际步骤按厂家说明</text><rect x="40" y="130" width="188" height="128" rx="15" fill="#D9E6EB"/><rect x="259" y="130" width="188" height="128" rx="15" fill="#DCE8DF"/><rect x="478" y="130" width="188" height="128" rx="15" fill="#EEDCDF"/><rect x="697" y="130" width="188" height="128" rx="15" fill="#E9DBC8"/><text x="91" y="178" font-size="23" fill="#34403F">还原</text><text x="54" y="214" font-size="17" fill="#34403F">部分二硫键变化</text><text x="293" y="178" font-size="23" fill="#34403F">卷绕与热</text><text x="273" y="214" font-size="17" fill="#34403F">几何与结构松弛</text><text x="524" y="178" font-size="23" fill="#34403F">冷却核验</text><text x="493" y="214" font-size="17" fill="#34403F">温度回落不等固定</text><text x="747" y="178" font-size="23" fill="#34403F">氧化</text><text x="713" y="214" font-size="17" fill="#34403F">部分共价交联恢复</text><path d="M230 188 L255 188 M449 188 L474 188 M668 188 L693 188" stroke="#B7866E" stroke-width="4"/><path d="M255 188 l-10 -7 v14Z M474 188 l-10 -7 v14Z M693 188 l-10 -7 v14Z" fill="#B7866E"/><path d="M60 335 C120 285 175 390 240 334 C302 281 350 390 418 337" fill="none" stroke="#8EAAB7" stroke-width="7"/><text x="454" y="330" font-size="21" fill="#34403F">观察实际状态，不自创时间</text><text x="40" y="408" font-size="16" fill="#B7866E">不可由图推算冷却分钟、发芯温度或二硫键恢复百分比</text></svg>