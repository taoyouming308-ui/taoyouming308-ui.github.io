<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430"><title>二剂氧化并非任意配套</title><rect width="800" height="430" fill="#F7F3EE"/><text x="30" y="42" font-size="25" fill="#333B3D">二剂都叫定型，但配方不等于相同</text><rect x="26" y="80" width="203" height="246" rx="18" fill="#DCE8EB"/><text x="127" y="125" text-anchor="middle" font-size="21" fill="#405C65">一剂还原</text><text x="127" y="165" text-anchor="middle" font-size="18" fill="#405C65">冲水之后</text><text x="127" y="208" text-anchor="middle" font-size="18" fill="#405C65">部分硫醇位点</text><text x="127" y="242" text-anchor="middle" font-size="18" fill="#405C65">等待配套工艺</text><rect x="289" y="79" width="196" height="114" rx="16" fill="#DCE7D9"/><text x="387" y="123" text-anchor="middle" font-size="21" fill="#405B4B">过氧化氢体系</text><text x="387" y="154" text-anchor="middle" font-size="16" fill="#405B4B">具体条件需核对</text><rect x="289" y="213" width="196" height="114" rx="16" fill="#DCE7D9"/><text x="387" y="256" text-anchor="middle" font-size="21" fill="#405B4B">溴酸钠体系</text><text x="387" y="287" text-anchor="middle" font-size="16" fill="#405B4B">不能自动换用</text><rect x="543" y="80" width="226" height="246" rx="18" fill="#E8D5CD"/><text x="656" y="124" text-anchor="middle" font-size="21" fill="#6C4E43">安全判断</text><text x="656" y="169" text-anchor="middle" font-size="18" fill="#6C4E43">厂家配伍说明</text><text x="656" y="207" text-anchor="middle" font-size="18" fill="#6C4E43">产品浓度与时序</text><text x="656" y="245" text-anchor="middle" font-size="18" fill="#6C4E43">漂染烫历史</text><text x="656" y="283" text-anchor="middle" font-size="18" fill="#6C4E43">停止信号</text><path d="M239 205H276L268 196M276 205L268 214M495 205H531L522 196M531 205L522 214" stroke="#B48370" stroke-width="4" fill="none"/><text x="398" y="389" text-anchor="middle" font-size="17" fill="#66716E">教学示意：不是化学计量、药剂推荐或毛发安全实测</text></svg>