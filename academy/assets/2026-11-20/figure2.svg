<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440"><title>六区记录与配套氧化工艺</title><rect width="800" height="440" fill="#F7F3EE"/><text x="30" y="42" font-size="26" fill="#333B3D">六区设计任务不同，化学流程必须配套</text><ellipse cx="265" cy="242" rx="175" ry="174" fill="#E1EAE0" stroke="#77998B" stroke-width="3"/><rect x="202" y="83" width="126" height="62" rx="14" fill="#C0DADD"/><rect x="102" y="172" width="128" height="100" rx="20" fill="#D5E3D7"/><rect x="300" y="172" width="128" height="100" rx="20" fill="#E8D6D0"/><rect x="212" y="170" width="106" height="100" rx="16" fill="#BFD5C1"/><rect x="210" y="298" width="111" height="79" rx="16" fill="#D7C1B8"/><g font-size="21" fill="#3F564D" text-anchor="middle"><text x="266" y="124">顶部</text><text x="166" y="230">左侧</text><text x="364" y="230">右侧</text><text x="265" y="228">枕骨</text><text x="266" y="348">后颈</text></g><path d="M431 219H477L465 209M477 219L465 230" stroke="#B88675" fill="none" stroke-width="4"/><g font-size="19" fill="#4B5D53"><text x="493" y="123">逐区回读与记录</text><text x="493" y="167">一剂与配套二剂型号</text><text x="493" y="210">首次接触、观察、冲水</text><text x="493" y="254">厂家允许的氧化程序</text><text x="493" y="298">异常与停止处理</text><text x="493" y="341">刘海脸周：另记流向</text></g><text x="400" y="417" text-anchor="middle" font-size="16" fill="#707670">六区边界为示意，箭头不代表药剂涂放顺序</text></svg>