<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><title>六区密度和卷度任务</title><rect width="720" height="400" rx="20" fill="#f1f3ec"/><g font-family="sans-serif" fill="#3d5148"><text x="26" y="33" font-size="22">六区：顶部支撑与侧后控量分开</text><ellipse cx="200" cy="210" rx="155" ry="155" fill="#e0e8dd" stroke="#809c8f" stroke-width="3"/><g stroke="#6f9588" stroke-width="2"><rect x="141" y="66" width="118" height="42" rx="10" fill="#d1dfe2"/><rect x="141" y="122" width="118" height="58" rx="10" fill="#b7d0d3"/><rect x="62" y="194" width="82" height="86" rx="10" fill="#d3dfd0"/><rect x="155" y="194" width="90" height="86" rx="10" fill="#d5dfce"/><rect x="256" y="194" width="82" height="86" rx="10" fill="#d3dfd0"/><rect x="141" y="294" width="118" height="42" rx="10" fill="#e3cfc3"/></g><g text-anchor="middle" font-size="17"><text x="200" y="92">刘海脸周</text><text x="200" y="155">顶部</text><text x="103" y="241">左侧</text><text x="200" y="241">枕骨</text><text x="297" y="241">右侧</text><text x="200" y="320">后颈</text></g><path d="M260 151H385M373 143L385 151L373 159M340 237H385M373 229L385 237L373 245M260 315H385M373 307L385 315L373 323" fill="none" stroke="#b18473" stroke-width="3"/><g font-size="18"><text x="400" y="92">刘海：保留额角覆盖</text><text x="400" y="150">顶部：轻C，不削薄</text><text x="400" y="218">两侧：分薄发片，弱化卷峰</text><text x="400" y="246">枕骨：控制叠层与连接</text><text x="400" y="315">后颈：控制底线重量</text><text x="26" y="380" font-size="15">箭头指区域任务；不是药剂顺序。实际六区边界以门店标准为准。</text></g></g></svg>
