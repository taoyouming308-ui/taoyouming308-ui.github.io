<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450"><title>六区与发段历史</title><rect width="760" height="450" rx="18" fill="#f7f3ed"/><g font-family="sans-serif" fill="#394341"><text x="36" y="42" font-size="25" font-weight="bold">六区任务与发段历史分别记录</text><ellipse cx="238" cy="240" rx="173" ry="173" fill="#e0e9df" stroke="#78998d" stroke-width="3"/><g font-size="19" text-anchor="middle"><rect x="161" y="83" width="154" height="48" rx="12" fill="#cfdae1"/><text x="238" y="113">刘海脸周</text><rect x="161" y="144" width="154" height="49" rx="12" fill="#b9d3d1"/><text x="238" y="175">顶部</text><rect x="80" y="208" width="95" height="91" rx="13" fill="#c4d9c9"/><text x="127" y="258">左侧</text><rect x="181" y="208" width="114" height="91" rx="13" fill="#b8cfc0"/><text x="238" y="258">枕骨</text><rect x="301" y="208" width="95" height="91" rx="13" fill="#c4d9c9"/><text x="348" y="258">右侧</text><rect x="161" y="314" width="154" height="62" rx="12" fill="#d8d8c4"/><text x="238" y="351">后颈</text></g><path d="M412 238H454L443 229M454 238L443 247" stroke="#b58270" stroke-width="4" fill="none"/><g font-size="19"><text x="480" y="95">同一发束</text><rect x="485" y="115" width="60" height="82" rx="7" fill="#b8d1c4"/><rect x="485" y="197" width="60" height="90" fill="#d4c4b4"/><rect x="485" y="287" width="60" height="80" rx="7" fill="#bc8b79"/><text x="560" y="162">新生</text><text x="560" y="245">旧染/烫</text><text x="560" y="330">旧漂尾</text><text x="460" y="395" font-size="16">干硬不是药力依据</text></g><text x="36" y="437" font-size="15">区域仅为教学示意；箭头非涂药顺序。</text></g></svg>
