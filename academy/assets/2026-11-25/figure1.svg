<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450"><title>刚度与强度不同</title><rect width="760" height="450" rx="18" fill="#f7f3ed"/><g font-family="sans-serif" fill="#394341"><text x="36" y="42" font-size="25" font-weight="bold">刚度高 ≠ 断裂强度高</text><path d="M82 76V372H702" stroke="#536360" stroke-width="3" fill="none"/><text x="36" y="69" font-size="18">应力</text><text x="620" y="408" font-size="18">应变 →</text><path d="M83 370L160 238Q193 207 245 199" stroke="#b58270" stroke-width="6" fill="none"/><circle cx="245" cy="199" r="7" fill="#b58270"/><path d="M83 370L222 290Q380 155 564 120" stroke="#7195a1" stroke-width="6" fill="none"/><circle cx="564" cy="120" r="7" fill="#7195a1"/><path d="M279 145L245 199L244 183M245 199L259 191M553 85L564 120L550 111M564 120L572 105" stroke="#6c7773" stroke-width="2.5" fill="none"/><text x="278" y="141" font-size="20" fill="#9d6959">较低断裂应力</text><text x="465" y="80" font-size="20" fill="#527b87">较高断裂应力</text><text x="125" y="257" font-size="18" fill="#9d6959">初段更陡</text><text x="255" y="313" font-size="18" fill="#527b87">初段较缓</text><text x="36" y="437" font-size="16">假想曲线；非实测数据，不是安全阈值。</text></g></svg>
