<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"><rect width="760" height="420" fill="#F7F4EF"/><text font-family="Noto Sans CJK SC" x="30" y="40" font-size="24" font-weight="700" fill="#302E2B">同一杠径，不同发片厚度</text><text font-family="Noto Sans CJK SC" x="30" y="68" font-size="13" fill="#746F69">原理教学示意：层间路径差≠已测得的温度差</text><rect x="30" y="90" width="340" height="285" rx="18" fill="#FFFFFF" stroke="#E2DED7"/><rect x="390" y="90" width="340" height="285" rx="18" fill="#FFFFFF" stroke="#E2DED7"/><text font-family="Noto Sans CJK SC" x="51" y="124" font-size="18" font-weight="700" fill="#516C64">A  薄发片</text><text font-family="Noto Sans CJK SC" x="412" y="124" font-size="18" font-weight="700" fill="#A76E63">B  厚发片</text><circle cx="200" cy="234" r="82" fill="#D7E2EA" stroke="#7899A8" stroke-width="4"/><circle cx="200" cy="234" r="66" fill="#DCE4D4" stroke="#7F9A8C" stroke-width="11"/><circle cx="200" cy="234" r="46" fill="#F7F4EF" stroke="#B6AC9F" stroke-width="3"/><circle cx="560" cy="234" r="98" fill="#D7E2EA" stroke="#A76E63" stroke-width="4"/><circle cx="560" cy="234" r="82" fill="#DCE4D4" stroke="#8B9E91" stroke-width="10"/><circle cx="560" cy="234" r="65" fill="#E8D8D2" stroke="#A76E63" stroke-width="10"/><circle cx="560" cy="234" r="48" fill="#F7F4EF" stroke="#B6AC9F" stroke-width="3"/><path d="M115 177 Q178 132 215 156" fill="none" stroke="#516C64" stroke-width="4"/><path d="M460 166 Q551 113 613 149" fill="none" stroke="#A76E63" stroke-width="4"/><text font-family="Noto Sans CJK SC" x="62" y="350" font-size="14" fill="#516C64">层数较少，仍应检查张力</text><text font-family="Noto Sans CJK SC" x="409" y="350" font-size="14" fill="#A76E63">外层路径更长，叠压需复查</text><text font-family="Noto Sans CJK SC" x="31" y="406" font-size="13" fill="#746F69">判断：发片干重/宽度 → 是否平铺 → 张力 → 干燥一致性</text></svg>