<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650"><rect width="1100" height="650" fill="#f8f5f0"/><text x="55" y="79" font-size="33" fill="#303638">技术图｜六区判断与温和分段解结</text><ellipse cx="337" cy="351" rx="218" ry="216" fill="#e6ece5" stroke="#8aa194" stroke-width="5"/><path d="M119 342 L555 342 M337 135 L337 567 M205 212 L476 496 M481 211 L201 495" stroke="#8aa194" stroke-width="4" stroke-dasharray="10 10"/><text x="287" y="225" font-size="25" fill="#435b50">顶部</text><text x="133" y="334" font-size="23" fill="#435b50">左侧</text><text x="463" y="334" font-size="23" fill="#435b50">右侧</text><text x="281" y="426" font-size="24" fill="#435b50">枕骨</text><text x="279" y="520" font-size="24" fill="#435b50">后颈</text><rect x="616" y="143" width="427" height="392" rx="24" fill="#ede3dd"/><text x="645" y="195" font-size="25" fill="#414a49">刘海脸周：先看原生毛流</text><path d="M694 248 C637 324 780 353 704 433 C675 460 703 495 755 490" fill="none" stroke="#88a492" stroke-width="16"/><path d="M938 448 L894 419 L910 414 L897 393 L944 423 Z" fill="#b77760"/><text x="780" y="304" font-size="24" fill="#475a4c">先从发尾解结</text><text x="786" y="343" font-size="24" fill="#475a4c">再逐段向上</text><text x="788" y="471" font-size="22" fill="#985d48">遇到阻力不强拉</text><text x="55" y="610" font-size="19" fill="#8a6355">仅公仔头无药无热练习；箭头不是药剂、温度或真人排杠处方</text></svg>