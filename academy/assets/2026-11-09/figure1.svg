<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650"><rect width="1100" height="650" fill="#f8f5f0"/><text x="55" y="82" font-size="34" fill="#303638">原理图｜单次拉伸 ≠ 反复受力疲劳</text><rect x="52" y="130" width="480" height="420" rx="26" fill="#dfebee"/><rect x="568" y="130" width="480" height="420" rx="26" fill="#e3ebe2"/><text x="80" y="189" font-size="25" fill="#3a4850">单次拉伸：一次到断点</text><text x="593" y="189" font-size="25" fill="#3a594c">反复轻微受力：累积循环</text><path d="M286 225 L286 446" stroke="#7796a4" stroke-width="20"/><path d="M286 211 L270 240 L302 240 Z M286 464 L270 435 L302 435 Z" fill="#b67760"/><path d="M607 278 Q659 221 710 278 T814 278 T925 278" fill="none" stroke="#6c967e" stroke-width="15"/><path d="M607 372 Q659 315 710 372 T814 372 T925 372" fill="none" stroke="#6c967e" stroke-width="15"/><path d="M751 350 l33 33 m-4-38 l-32 41" stroke="#b67760" stroke-width="5"/><text x="75" y="501" font-size="21" fill="#3d484c">一次性强度不是长期耐久</text><text x="601" y="501" font-size="21" fill="#3d594e">裂纹仅示意，不是显微证据</text><text x="58" y="600" font-size="19" fill="#9d6c59">2026-11-09原创教学示意｜不能据此预测某位顾客一定断发</text></svg>