<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><rect width="960" height="560" rx="24" fill="#faf7f1"/><text x="35" y="57" font-size="29" fill="#343c3a" font-weight="600">方向原理：根部、杠轴、第一弯是三种变量</text><text x="36" y="88" font-size="16" fill="#687572">原创教学示意；箭头不是还原或断键数据</text><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b9806d"/></marker></defs>
