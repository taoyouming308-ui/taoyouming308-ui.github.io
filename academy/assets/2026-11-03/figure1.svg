<path d="M690 214 C744 168 769 260 801 284 S865 333 824 396" stroke="#dcc0bc" stroke-width="16" fill="none" stroke-linecap="round"/><line x1="791" y1="284" x2="848" y2="330" stroke="#b9806d" stroke-width="4" marker-end="url(#a)"/>
<text x="67" y="444" font-size="17" fill="#343c3a">干发观察头皮根向</text><text x="365" y="444" font-size="17" fill="#343c3a">工具方向由目标决定</text><text x="665" y="444" font-size="17" fill="#343c3a">检查脸周弯点落位</text>
<rect x="32" y="489" width="897" height="44" rx="12" fill="#e9ddca"/><text x="56" y="519" font-size="17" fill="#343c3a">这张图看什么：三个方向分别记录；不能从发尾外翻直接推算二硫键断裂率。</text></svg>