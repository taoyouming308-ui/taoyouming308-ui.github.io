<text x="57" y="164" font-size="22" fill="#343c3a">① 原生根向</text><text x="365" y="164" font-size="22" fill="#343c3a">② 卷杠轴向</text><text x="669" y="164" font-size="22" fill="#343c3a">③ 第一弯方向</text>
<path d="M110 394 Q114 302 243 216" stroke="#9eafa0" stroke-width="17" fill="none" stroke-linecap="round"/><line x1="112" y1="356" x2="238" y2="237" stroke="#b9806d" stroke-width="4" marker-end="url(#a)"/><circle cx="110" cy="394" r="11" fill="#343c3a"/>
