<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI陪练 · 自由手艺人</title>
<style>
:root {
  --bg: #000000;
  --surface: #16181c;
  --surface-light: #1d1f23;
  --text: #e7e9ea;
  --text-secondary: #71767b;
  --accent: #e7e9ea;
  --border: #2f3336;
  --danger: #f4212e;
  --success: #00ba7c;
  --warning: #ffd700;
  --font: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  min-height: 100vh; max-width: 480px; margin: 0 auto;
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface); padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 18px; font-weight: 700; text-align: center; }
.header .sub { font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: 2px; }
.page { display: none; min-height: calc(100vh - 56px); }
.page.active { display: flex; flex-direction: column; }

/* 场景选择 */
.scenario-grid { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.scenario-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; cursor: pointer; transition: all 0.2s;
}
.scenario-card:active { background: var(--surface-light); transform: scale(0.98); }
.scenario-card .name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.scenario-card .desc { font-size: 13px; color: var(--text-secondary); }

/* 对话页 */
.chat-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.chat-header .back-btn { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px 8px; }
.chat-header .scenario-name { font-size: 14px; font-weight: 600; flex: 1; }
.chat-header .end-btn {
  background: none; border: 1px solid var(--danger); color: var(--danger);
  font-size: 12px; padding: 4px 12px; border-radius: 16px; cursor: pointer; font-family: var(--font);
}
.chat-messages {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-break: break-word; }
.msg.customer { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 4px; }
.msg.customer::before { content: '💇‍♀️ '; font-size: 14px; }
.msg.stylist { align-self: flex-end; background: #1d4ed8; color: white; border-bottom-right-radius: 4px; }
.msg.stylist::before { content: '✂️ '; font-size: 14px; }
.msg.typing { align-self: flex-start; background: var(--surface); color: var(--text-secondary); font-style: italic; }
.chat-input-bar {
  display: flex; gap: 8px; padding: 10px 16px 16px;
  background: var(--surface); border-top: 1px solid var(--border);
}
.chat-input-bar textarea {
  flex: 1; border: 1px solid var(--border); border-radius: 20px;
  background: var(--bg); color: var(--text); padding: 10px 16px; font-size: 15px;
  font-family: var(--font); resize: none; outline: none; min-height: 40px; max-height: 100px;
}
.chat-input-bar textarea:focus { border-color: var(--text); }
.chat-input-bar .send-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--text); color: var(--bg); border: none;
  font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.chat-input-bar .send-btn:disabled { opacity: 0.3; }

/* 评分页 */
.score-page { padding: 16px; }
.total-score { text-align: center; padding: 24px 0 16px; }
.total-score .number { font-size: 56px; font-weight: 800; color: var(--accent); }
.total-score .label { font-size: 14px; color: var(--text-secondary); }
.score-bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.score-item .label-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
.score-item .bar-bg { height: 6px; background: var(--surface); border-radius: 3px; overflow: hidden; }
.score-item .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
.attitude-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; }
.attitude-row .arrow { color: var(--text); font-size: 18px; }
.attitude-row .val { color: var(--success); font-weight: 600; }
.prob { color: var(--success); font-weight: 600; }
.section-title { font-size: 14px; font-weight: 600; margin: 16px 0 8px; color: var(--text); }
.strength-box { background: var(--surface); border-radius: 10px; padding: 12px; font-size: 14px; color: var(--success); margin-bottom: 8px; }
.improvement-item { background: var(--surface); border-radius: 10px; padding: 12px; font-size: 14px; color: var(--text); margin-bottom: 6px; border-left: 3px solid var(--danger); }
.action-btns { display: flex; gap: 10px; margin-top: 16px; }
.action-btns button {
  flex: 1; padding: 12px; border-radius: 24px; border: none;
  font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font);
}
.btn-primary { background: var(--text); color: var(--bg); }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

/* 加载状态 */
.loading-dots { display: inline-block; }
.loading-dots::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

/* 当前没有对话的记录 */
#historyPanel { padding: 12px 16px; }
.history-item { padding: 12px; background: var(--surface); border-radius: 10px; margin-bottom: 8px; cursor: pointer; border: 1px solid var(--border); }
.history-item:active { background: var(--surface-light); }
.history-item .scenario-tag { font-size: 12px; color: var(--text-secondary); }
.history-item .score-tag { font-size: 13px; color: var(--success); float: right; }
</style>
</head>
<body>

<div class="header">
  <h1>AI 陪练</h1>
  <div class="sub">真实顾客对话模拟 · 练口才 · 练专业 · 练自信</div>
</div>

<!-- 场景选择页 -->
<div id="scenarioPage" class="page active">
  <div class="scenario-grid" id="scenarioList"></div>
</div>

<!-- 对话页 -->
<div id="chatPage" class="page">
  <div class="chat-header">
    <button class="back-btn" onclick="endChat()">←</button>
    <span class="scenario-name" id="chatScenarioName"></span>
    <button class="end-btn" onclick="endChat()">结束</button>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div style="text-align:center;padding:40px;color:var(--text-secondary);font-size:14px;">
      ⏳ 等待AI顾客开口...
    </div>
  </div>
  <div class="chat-input-bar">
    <textarea id="chatInput" rows="1" placeholder="输入你的回答..." disabled
      onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>→</button>
  </div>
</div>

<!-- 评分页 -->
<div id="scorePage" class="page">
  <div class="score-page" id="scoreContent"></div>
</div>

<script>
// Supabase 配置
const SB_URL = 'https://pdssrmpeiuwvxzsgschm.supabase.co';
const SB_KEY = 'sb_publishable_MDx4d2QzQpTojF8yLRHIqw_uKQW7A7t';

let currentSessionId = null;
let currentScenario = '';
let pollTimer = null;
let userName = localStorage.getItem('barber_name') || '发型师';
let totalTurns = 0;
let endedByUser = false;

const SCENARIOS = [
  {id:'price_sensitive', name:'嫌贵型顾客', desc:'觉得烫发染发太贵，想砍价，需要你说服'},
  {id:'damage_worried', name:'怕伤发质型顾客', desc:'上次烫染伤发了，心有余悸，需要专业知识安抚'},
  {id:'undecided', name:'纠结型顾客', desc:'想改变但不知道做什么，需要你引导推荐'},
  {id:'recommendation_seeker', name:'让发型师推荐的顾客', desc:'"你帮我推荐吧我不懂"——信任你但要求高'},
  {id:'already_done_elsewhere', name:'做坏了来补救的顾客', desc:'在别家做坏了，沮丧焦虑，需要专业诊断和方案'}
];

// === Supabase REST 封装 ===
function sbGet(table, params) {
  var qs = params ? Object.entries(params).map(function(kv){
    return encodeURIComponent(kv[0]) + '=' + encodeURIComponent(kv[1]);
  }).join('&') : '';
  var url = SB_URL + '/rest/v1/' + table + (qs ? '?' + qs : '');
  return fetch(url, {
    headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}
  }).then(function(r){ return r.json(); });
}

function sbPost(table, data) {
  return fetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: {
      'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(data)
  }).then(function(r){ return r.json(); });
}

function sbPatch(table, idVal, data) {
  return fetch(SB_URL + '/rest/v1/' + table + '?id=eq.' + encodeURIComponent(idVal), {
    method: 'PATCH',
    headers: {
      'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(data)
  });
}

// === 页面 ===
function showPage(id) {
  ['scenarioPage','chatPage','scorePage'].forEach(function(p){
    document.getElementById(p).classList.toggle('active', p === id);
  });
}

function loadScenarios() {
  var list = document.getElementById('scenarioList');
  list.innerHTML = SCENARIOS.map(function(s){
    return '<div class="scenario-card" onclick="startChat(\'' + s.id + '\')">' +
      '<div class="name">' + s.name + '</div>' +
      '<div class="desc">' + s.desc + '</div></div>';
  }).join('') +
  '<div style="text-align:center;padding:16px;color:var(--text-secondary);font-size:13px;border-top:1px solid var(--border);margin-top:8px;">' +
    '选一个场景开始练习<br>对话结束后AI会给你评分和改进建议</div>';
}

// === 开始对话 ===
function startChat(scenarioId) {
  currentScenario = scenarioId;
  totalTurns = 0;
  endedByUser = false;
  var s = SCENARIOS.find(function(x){ return x.id === scenarioId; });
  document.getElementById('chatScenarioName').textContent = s ? s.name : '顾客';
  document.getElementById('chatMessages').innerHTML =
    '<div style="text-align:center;padding:40px;color:var(--text-secondary);font-size:14px;">⏳ 创建对话...</div>';
  document.getElementById('chatInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  showPage('chatPage');

  // 创建session
  sbPost('coach_sessions', {
    user_id: userName,
    user_name: userName,
    scenario: scenarioId,
    status: 'active'
  }).then(function(sessions){
    if (!sessions || !sessions.length) {
      document.getElementById('chatMessages').innerHTML =
        '<div style="text-align:center;padding:40px;color:var(--danger);font-size:14px;">❌ 创建失败，请稍后再试</div>';
      return;
    }
    currentSessionId = sessions[0].id;
    document.getElementById('chatMessages').innerHTML =
      '<div style="text-align:center;padding:40px;color:var(--text-secondary);font-size:14px;">⏳ 等待AI顾客开口...</div>';
    // 开始轮询新消息
    startPolling();
  });
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function(){ pollMessages(); }, 2000);
  // 立即查一次
  setTimeout(pollMessages, 500);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function pollMessages() {
  if (!currentSessionId) return;
  sbGet('coach_messages', {
    'session_id': 'eq.' + currentSessionId,
    'order': 'created_at.asc'
  }).then(function(msgs){
    if (!msgs || !msgs.length) return;
    renderMessages(msgs);
  });
}

function renderMessages(msgs) {
  var container = document.getElementById('chatMessages');
  var lastRole = msgs.length > 0 ? msgs[msgs.length-1].role : null;
  var html = '';
  msgs.forEach(function(m){
    html += '<div class="msg ' + m.role + '">' + escHtml(m.content) + '</div>';
  });
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;

  // 最后一条是顾客消息 → 启用输入框
  if (lastRole === 'customer' && !endedByUser) {
    document.getElementById('chatInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('chatInput').focus();
  }
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// === 发送消息 ===
function sendMessage() {
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text || !currentSessionId || document.getElementById('chatInput').disabled) return;

  input.value = '';
  document.getElementById('chatInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;

  // 添加用户消息
  sbPost('coach_messages', {
    session_id: currentSessionId,
    role: 'stylist',
    content: text
  }).then(function(){
    totalTurns++;
    // 立即显示
    var container = document.getElementById('chatMessages');
    container.innerHTML += '<div class="msg stylist">✂️ ' + escHtml(text) + '</div>';
    container.scrollTop = container.scrollHeight;
    // 显示"正在输入"
    container.innerHTML += '<div class="msg customer typing" id="typingMsg">💇‍♀️ 正在输入<span class="loading-dots"></span></div>';
    container.scrollTop = container.scrollHeight;
  });
}

// === 结束对话 ===
function endChat() {
  if (!currentSessionId) { backToScenarios(); return; }
  if (totalTurns === 0) {
    // 还没聊就结束
    sbPatch('coach_sessions', currentSessionId, {status: 'cancelled'});
    stopPolling();
    currentSessionId = null;
    backToScenarios();
    return;
  }
  endedByUser = true;
  stopPolling();
  document.getElementById('chatInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;

  // 标记session为ended
  sbPatch('coach_sessions', currentSessionId, {status: 'ended'});

  showPage('scorePage');
  document.getElementById('scoreContent').innerHTML =
    '<div style="text-align:center;padding:40px;color:var(--text-secondary);font-size:14px;">🧠 AI正在分析你的对话表现...</div>';

  // 轮询评分结果
  waitForScore();
}

function waitForScore() {
  var attempts = 0;
  var scoreTimer = setInterval(function(){
    attempts++;
    sbGet('coach_scores', {'session_id': 'eq.' + currentSessionId}).then(function(scores){
      if (scores && scores.length > 0) {
        clearInterval(scoreTimer);
        renderScore(scores[0]);
      } else if (attempts > 30) {
        clearInterval(scoreTimer);
        document.getElementById('scoreContent').innerHTML =
          '<div style="text-align:center;padding:40px;">' +
          '<div style="font-size:40px;margin-bottom:12px;">⏰</div>' +
          '<div style="color:var(--text-secondary);margin-bottom:12px;">评分生成较慢，请稍后查看</div>' +
          '<button class="btn-secondary" onclick="backToScenarios()" ' +
          'style="padding:12px 24px;border-radius:24px;border:1px solid var(--border);background:var(--surface);' +
          'color:var(--text);font-family:var(--font);cursor:pointer;">返回首页</button></div>';
      }
    });
  }, 2000);
}

function renderScore(data) {
  var s = data.scores || {};
  var total = data.total_score || Math.round(
    ((s.专业度||0) + (s.共情力||0) + (s.引导能力||0) + (s.应变能力||0) + (s.自然度||0)) / 5 * 10
  );

  document.getElementById('scoreContent').innerHTML =
    '<div class="total-score"><div class="number">' + total + '</div><div class="label">综合评分</div></div>' +
    '<div class="score-bars">' +
    ['专业度','共情力','引导能力','应变能力','自然度'].map(function(k){
      var v = s[k] || 0;
      return '<div class="score-item"><div class="label-row"><span>' + k + '</span><span>' + v + '/10</span></div>' +
        '<div class="bar-bg"><div class="bar-fill" style="width:' + (v*10) + '%"></div></div></div>';
    }).join('') +
    '</div>' +
    '<div class="attitude-row"><span>态度变化:</span><span class="val">' + (data.initial_attitude||'未知') + '</span>' +
    '<span class="arrow">→</span><span class="val">' + (data.final_attitude||'未知') + '</span></div>' +
    '<div style="text-align:center;margin-bottom:12px;"><span style="font-size:14px;color:var(--text-secondary);">成交可能性: </span>' +
    '<span class="prob">' + (data['成交可能性']||'中') + '</span></div>' +
    '<div class="section-title">👍 做得好的</div><div class="strength-box">' + (data.strength||'继续加油！') + '</div>' +
    '<div class="section-title">💡 改进建议</div>' +
    (data.improvements||[]).map(function(i){ return '<div class="improvement-item">' + i + '</div>'; }).join('') +
    '<div style="margin-top:8px;font-size:12px;color:var(--text-secondary);text-align:center;">本次训练 ' + totalTurns + ' 轮对话</div>' +
    '<div class="action-btns">' +
    '<button class="btn-primary" onclick="retrySame()">再来一次</button>' +
    '<button class="btn-secondary" onclick="backToScenarios()">换场景</button></div>';
}

function retrySame() {
  currentSessionId = null;
  showPage('scenarioPage');
  setTimeout(function(){ startChat(currentScenario); }, 300);
}

function backToScenarios() {
  currentSessionId = null;
  stopPolling();
  showPage('scenarioPage');
}

// 加载场景
loadScenarios();
</script>
</body>
</html>
