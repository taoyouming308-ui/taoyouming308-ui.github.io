name: Publish reviewed academy lessons
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-academy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish approved draft if available
        run: python scripts/publish-academy.py
      - name: Commit newly published lesson
        run: |
          git add academy/
          if git diff --cached --quiet; then
            echo "No new approved lesson"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish approved academy lesson"
          git push
