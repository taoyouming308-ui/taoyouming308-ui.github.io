name: Validate shared app

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - name: Type-check operations-api with its frozen lockfile
        run: deno check --config=supabase/functions/operations-api/deno.json --node-modules-dir=none --frozen supabase/functions/operations-api/index.ts
      - name: Validate Supabase release command contract
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
        run: |
          test "$(supabase --version)" = "2.109.1"
          supabase db push --help | grep -q -- '--dry-run'
          supabase functions deploy --help | grep -q -- '--use-api'
      - name: Install pinned browser-test tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate release integrity
        run: node scripts/check-release-integrity.js
      - name: Validate synchronized versions
        run: node scripts/check-version-sync.js
      - name: Run app smoke tests
        run: |
          node scripts/smoke-test-app.js
          node scripts/test-version-update-flow.js
      - name: Protect customer Codex analysis routing
        run: node scripts/test-ai-codex-route.js
      - name: Run care outbound tests
        run: |
          node scripts/test-care-outbound.js
          python3 -m unittest scripts/test_care_outbound_worker.py
      - name: Run hair task state tests
        run: |
          node scripts/test-hair-task-state.js
          node scripts/test-hair-service-photos.js
          node scripts/test-hair-save-durability.js
      - name: Protect customer archive rendering
        run: node scripts/test-customer-archive-rendering.js
      - name: Protect backend workflows
        run: node scripts/test-admin-workflow.js
      - name: Protect admin customer archive access
        run: node scripts/test-customer-admin-api.js
      - name: Protect booking page UI
        run: node scripts/test-booking-ui.js
      - name: Protect iPad frontdesk customer center
        run: node scripts/test-frontdesk.js
      - name: Validate shared finance test manifest
        run: node scripts/test-zysyr-validation-manifest.js
      - name: Protect complete finance regression suite
        run: node scripts/run-zysyr-finance-tests.js
      - name: Protect shared app UI system
        run: node scripts/test-app-ui-system.js
      - name: Protect aesthetic training and knowledge governance
        run: |
          node scripts/test-module-boundaries.js
          node scripts/test-aesthetic-system.js
          python3 -m unittest scripts/test_aesthetic_coach_endpoint.py
      - name: Run Meiguanjia sync tests
        run: python3 -m unittest scripts/test_sync_mgj_bookings.py scripts/test_mgj_keepalive.py scripts/test_sync_mgj_customer_profiles.py
      - name: Validate Codex and Hermes handoff
        run: node scripts/check-agent-sync-status.js
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
