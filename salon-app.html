<!doctype html>
<html lang="zh-CN" data-salon-version="0.8.0-test">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自由手艺人 · 门店经营系统（离线测试）</title>
<style>
:root{--bg:#0f1115;--panel:#181b21;--line:#2b3039;--text:#f2f3f5;--muted:#9299a6;--gold:#d8b36b;--blue:#6aa9ff;--red:#ef806f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100dvh}.side{border-right:1px solid var(--line);padding:20px 14px;background:#121419}.brand{padding:4px 10px 18px}.brand b{font-size:18px}.brand small{display:block;color:var(--gold);margin-top:6px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:9px;text-align:left}.nav button.on{background:#252a33;color:#fff}.main{padding:24px}.top{display:flex;gap:12px;align-items:center;margin-bottom:20px}.top h1{font-size:24px;margin:0}.badge{margin-left:auto;color:var(--gold);border:1px solid #5c4c2f;border-radius:999px;padding:7px 11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.card h3{margin:0 0 8px}.card p{margin:0;color:var(--muted);line-height:1.7}.card em{display:inline-block;margin-top:12px;color:var(--blue);font-style:normal;font-size:12px}.empty{margin-top:18px;border:1px dashed var(--line);padding:32px;border-radius:14px;color:var(--muted);text-align:center}.customer-tools,.form-row{display:flex;gap:10px;flex-wrap:wrap}.field{display:grid;gap:6px;min-width:150px;flex:1}.field label{font-size:11px;color:var(--muted)}input,select{border:1px solid var(--line);background:#11141a;color:var(--text);border-radius:9px;padding:10px}.primary,.ghost,.danger{border-radius:9px;padding:10px 14px;font-weight:700}.primary{border:0;background:var(--gold);color:#17130d}.ghost{border:1px solid var(--line);background:transparent;color:var(--text)}.danger{border:1px solid var(--red);background:transparent;color:var(--red)}.customer-list{display:grid;gap:10px;margin-top:14px}.customer-row{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:13px}.customer-row small{display:block;color:var(--muted);margin-top:4px}.status-frozen{color:var(--red)}.accounts{display:flex;gap:6px;flex-wrap:wrap}.account-chip{background:#242a34;border-radius:999px;padding:5px 8px;font-size:11px}.customer-forms{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.panel h3{margin:0 0 14px}.msg{min-height:20px;color:var(--gold);margin-top:10px;font-size:12px}@media(max-width:900px){.customer-row{grid-template-columns:1fr 1fr}.customer-forms{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block}.side{position:sticky;top:0;z-index:2;border-right:0;border-bottom:1px solid var(--line);padding:10px}.brand{padding:4px 6px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:16px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.badge{font-size:11px}}@media(max-width:440px){.grid{grid-template-columns:1fr}.customer-row{grid-template-columns:1fr}.field{min-width:100%}}
.schedule-layout{display:grid;grid-template-columns:1.4fr .8fr;gap:12px}.schedule-list,.queue-list{display:grid;gap:9px;margin-top:12px}.schedule-row,.queue-row{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;align-items:center;gap:12px}.schedule-row strong,.queue-row strong{display:block}.schedule-row small,.queue-row small{color:var(--muted)}.row-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.row-actions button{padding:7px 9px}.subforms{display:grid;gap:12px}.status-confirmed{color:var(--blue)}.status-arrived,.status-serving{color:var(--gold)}@media(max-width:980px){.schedule-layout{grid-template-columns:1fr}}
.cashier-layout{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.order-lines{display:grid;gap:8px;margin:12px 0}.order-line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.order-total{display:grid;gap:6px;margin:14px 0;padding:12px;background:#11141a;border-radius:10px}.order-total div{display:flex;justify-content:space-between}.order-total .due{font-size:18px;color:var(--gold)}.receipt{white-space:pre-wrap;line-height:1.8;color:var(--muted)}@media(max-width:980px){.cashier-layout{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand"><b>自由手艺人</b><small>门店经营系统 · 离线开发版</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><div><h1 id="title">经营桌面</h1><div style="color:var(--muted);margin-top:5px" id="purpose">完整业务闭环总览</div></div><span class="badge">不连接生产数据</span></div><div id="workspace"><div class="grid" id="features"></div><div class="empty">当前为独立开发外壳。后续模块将在此分批接入，完成全部离线测试后才与员工端、前台、悦西智营合并。</div></div></main></div>
<script src="packages/salon-core/customer-domain.js"></script>
<script src="packages/salon-core/scheduling-domain.js"></script>
<script src="packages/salon-core/order-domain.js"></script>
<script src="packages/salon-core/catalog-inventory-domain.js"></script>
<script src="packages/salon-core/workforce-domain.js"></script>
<script src="packages/salon-core/reporting-domain.js"></script>
<script>
const modules=[
 {name:'经营桌面',purpose:'待办、预约、服务、收款与预警总览',features:['今日预约','待接待','服务中','待收款','库存预警','交班提醒']},
 {name:'顾客会员',purpose:'顾客档案、会员卡和关系维护',features:['顾客查询','顾客档案','储值卡','次卡/疗程','套餐','冻结记录']},
 {name:'预约排客',purpose:'预约、休假、轮牌和工位协同',features:['预约日历','创建预约','休假设置','轮牌队列','工位状态','爽约记录']},
 {name:'开单收银',purpose:'从开单、服务到结算的订单主链',features:['会员消费','散客消费','开卡充值','组合支付','退款冲正','交班']},
 {name:'服务现场',purpose:'无纸化服务过程和履约状态',features:['进行中服务','服务时间线','服务前后照','项目配方','服务完成','回访任务']},
 {name:'项目商品',purpose:'项目、商品、价目和卡项配置',features:['服务项目','商品资料','分类','价目表','会员价','套餐规则']},
 {name:'库存管理',purpose:'入库、出库、调拨、盘点和预警',features:['库存余量','采购入库','销售/耗用','门店调拨','盘点','安全库存']},
 {name:'员工组织',purpose:'员工生命周期、门店、角色和工位',features:['员工资料','入离职','调店','角色权限','考勤','工位']},
 {name:'业绩工资',purpose:'业绩分配、提成、奖罚和工资试算',features:['业绩分配','员工业绩','提成规则','工资方案','奖罚','工资单']},
 {name:'财务报表',purpose:'营业、资金、卡金与经营报表',features:['营业汇总','收款流水','卡金流水','支出收入','日报','月报']},
 {name:'作品评价',purpose:'作品授权、审核、评价和打赏',features:['作品库','顾客授权','作品审核','评价记录','打赏记录','回访']},
 {name:'营销顾客端',purpose:'顾客自助预约、通知和营销',features:['顾客端','自助预约','消息通知','优惠券/红包','活动','效果归因']},
 {name:'系统设置',purpose:'多门店、审批、日志与基础参数',features:['组织门店','管理员','权限','审批','操作日志','参数设置']}
];
const nav=document.getElementById('nav'),workspace=document.getElementById('workspace'),storageKey='salon-core-offline-v1';let customerState=SalonCustomerDomain.deserialize(localStorage.getItem(storageKey));
const scheduleStorageKey='salon-schedule-offline-v1';let scheduleState=SalonSchedulingDomain.deserialize(localStorage.getItem(scheduleStorageKey));
const orderStorageKey='salon-orders-offline-v1';let orderState=SalonOrderDomain.deserialize(localStorage.getItem(orderStorageKey)),activeOrderId=(orderState.orders.slice().reverse().find(order=>order.status==='draft')||{}).id||null;
const catalogStorageKey='salon-catalog-inventory-offline-v1';let catalogState=SalonCatalogInventoryDomain.deserialize(localStorage.getItem(catalogStorageKey));
const workforceStorageKey='salon-workforce-offline-v1';let workforceState=SalonWorkforceDomain.deserialize(localStorage.getItem(workforceStorageKey));
const reportingStorageKey='salon-reporting-offline-v1';let reportingState=SalonReportingDomain.deserialize(localStorage.getItem(reportingStorageKey));
function saveCustomerState(){localStorage.setItem(storageKey,SalonCustomerDomain.serialize(customerState))}
function genericView(item){workspace.innerHTML='<div class="grid" id="features">'+item.features.map((name,i)=>`<article class="card"><h3>${name}</h3><p>${item.purpose}</p><em>${i<3?'P0 / 开发排期中':'P1-P2 / 后续批次'}</em></article>`).join('')+'</div><div class="empty">当前为独立开发外壳。完成全部离线测试后才与现有三个板块合并。</div>'}
function customerView(){workspace.innerHTML=`<section class="panel"><div class="customer-tools"><div class="field"><label>查询姓名或手机号</label><input id="customer-query" placeholder="输入姓名或手机号"></div><div class="field"><label>顾客状态</label><select id="customer-status"><option value="all">全部状态</option><option value="active">正常</option><option value="frozen">已冻结</option></select></div></div><div class="customer-list" id="customer-list"></div></section><div class="customer-forms"><form class="panel" id="customer-form"><h3>顾客建档</h3><div class="form-row"><div class="field"><label>顾客姓名 *</label><input name="name" required maxlength="80"></div><div class="field"><label>手机号</label><input name="phone" inputmode="tel" maxlength="20"></div><div class="field"><label>生日</label><input name="birthday" type="date"></div><div class="field"><label>归属门店 *</label><input name="store" required value="自由手艺人"></div><div class="field"><label>负责人</label><input name="owner"></div><div class="field"><label>来源</label><select name="source"><option value="walkin">直接到店</option><option value="appointment">预约</option><option value="referral">顾客介绍</option><option value="online">线上</option></select></div><div class="field"><label>标签（逗号分隔）</label><input name="tags"></div></div><button class="primary" type="submit">保存顾客档案</button><div class="msg" id="customer-msg"></div></form><form class="panel" id="account-form"><h3>开立会员账户</h3><div class="form-row"><div class="field"><label>顾客 *</label><select name="customerId" id="account-customer" required></select></div><div class="field"><label>账户类型 *</label><select name="type"><option value="stored_value">储值卡</option><option value="times_card">次卡/疗程</option><option value="package">套餐</option></select></div><div class="field"><label>卡项名称 *</label><input name="name" required></div><div class="field"><label>初始金额（测试）</label><input name="amount" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>初始次数</label><input name="units" type="number" min="0" step="1" value="0"></div><div class="field"><label>有效期至</label><input name="expiresOn" type="date"></div></div><button class="primary" type="submit">开立测试账户</button><div class="msg" id="account-msg"></div></form></div>`;bindCustomerView();renderCustomers()}
function bindCustomerView(){document.getElementById('customer-query').oninput=renderCustomers;document.getElementById('customer-status').onchange=renderCustomers;document.getElementById('customer-form').onsubmit=function(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));try{SalonCustomerDomain.createCustomer(customerState,data);saveCustomerState();e.currentTarget.reset();e.currentTarget.store.value='自由手艺人';document.getElementById('customer-msg').textContent='顾客档案已保存到离线测试数据';renderCustomers()}catch(error){document.getElementById('customer-msg').textContent=error.message}};document.getElementById('account-form').onsubmit=function(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));try{SalonCustomerDomain.openAccount(customerState,data);saveCustomerState();document.getElementById('account-msg').textContent='会员账户已开立（仅离线测试）';renderCustomers()}catch(error){document.getElementById('account-msg').textContent=error.message}}}
function renderCustomers(){const list=document.getElementById('customer-list');if(!list)return;const q=document.getElementById('customer-query').value,status=document.getElementById('customer-status').value,rows=SalonCustomerDomain.searchCustomers(customerState,q,status),select=document.getElementById('account-customer');select.innerHTML='<option value="">请选择顾客</option>'+customerState.customers.filter(c=>c.status==='active').map(c=>`<option value="${c.id}">${c.name} ${c.phone||''}</option>`).join('');list.innerHTML=rows.length?rows.map(row=>{const c=row.customer,r=row.relation||{};return `<div class="customer-row"><div><strong>${escapeHtml(c.name)}</strong><small>${escapeHtml(c.phone||'未留手机号')} · <span class="${c.status==='frozen'?'status-frozen':''}">${c.status==='frozen'?'已冻结':'正常'}</span></small></div><div>${escapeHtml(r.store||'')}<small>负责人：${escapeHtml(r.owner||'未分配')} · ${escapeHtml((r.tags||[]).join('、')||'无标签')}</small></div><div class="accounts">${row.accounts.length?row.accounts.map(a=>`<span class="account-chip">${escapeHtml(a.name)} · ${a.type==='stored_value'?'¥'+a.cashBalance:'剩'+a.remainingUnits+'次'}</span>`).join(''):'<small>暂无会员账户</small>'}</div><button class="${c.status==='frozen'?'ghost':'danger'}" type="button" data-freeze="${c.id}">${c.status==='frozen'?'恢复':'冻结'}</button></div>`}).join(''):'<div class="empty">暂无符合条件的顾客</div>';list.querySelectorAll('[data-freeze]').forEach(btn=>btn.onclick=function(){const id=Number(btn.dataset.freeze),c=customerState.customers.find(x=>x.id===id),reason=prompt(c.status==='frozen'?'请输入恢复原因':'请输入冻结原因');if(reason===null)return;try{SalonCustomerDomain.setCustomerFrozen(customerState,id,c.status!=='frozen',reason);saveCustomerState();renderCustomers()}catch(error){alert(error.message)}})}
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function saveScheduleState(){localStorage.setItem(scheduleStorageKey,SalonSchedulingDomain.serialize(scheduleState))}
function dateTimeLabel(value){const d=new Date(value);return Number.isNaN(d.getTime())?'—':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function schedulingView(){workspace.innerHTML=`<div class="schedule-layout"><section class="panel"><h3>预约记录</h3><form id="appointment-form"><div class="form-row"><div class="field"><label>顾客姓名 *</label><input name="customerName" required></div><div class="field"><label>手机号</label><input name="customerPhone" inputmode="tel"></div><div class="field"><label>手艺人 *</label><select name="staffId" id="appointment-staff" required></select></div><div class="field"><label>预约项目 *</label><input name="service" required></div><div class="field"><label>预约时间 *</label><input name="startsAt" type="datetime-local" required></div><div class="field"><label>预计分钟 *</label><input name="duration" type="number" min="15" max="720" step="15" value="60"></div><div class="field"><label>客源</label><select name="source"><option value="staff">门店创建</option><option value="customer">顾客端</option><option value="phone">电话</option></select></div><label style="display:flex;align-items:center;gap:7px"><input name="specified" type="checkbox" style="width:auto">指定手艺人</label></div><button class="primary" type="submit">创建预约</button><div class="msg" id="appointment-msg"></div></form><div class="schedule-list" id="appointment-list"></div></section><aside class="subforms"><form class="panel" id="staff-form"><h3>当班手艺人</h3><div class="form-row"><div class="field"><label>姓名 *</label><input name="name" required></div><div class="field"><label>工位</label><input name="station"></div></div><button class="primary" type="submit">添加手艺人</button><div class="msg" id="staff-msg"></div><div id="staff-list" class="schedule-list"></div></form><form class="panel" id="leave-form"><h3>休假 / 不可预约</h3><div class="form-row"><div class="field"><label>手艺人 *</label><select name="staffId" id="leave-staff" required></select></div><div class="field"><label>开始 *</label><input name="startsAt" type="datetime-local" required></div><div class="field"><label>结束 *</label><input name="endsAt" type="datetime-local" required></div><div class="field"><label>原因 *</label><input name="reason" required></div></div><button class="ghost" type="submit">保存休假</button><div class="msg" id="leave-msg"></div></form><section class="panel"><h3>轮牌队列</h3><div class="queue-list" id="queue-list"></div></section></aside></div>`;bindScheduling();renderScheduling()}
function bindScheduling(){document.getElementById('staff-form').onsubmit=e=>{e.preventDefault();try{SalonSchedulingDomain.addStaff(scheduleState,Object.fromEntries(new FormData(e.currentTarget)));saveScheduleState();e.currentTarget.reset();document.getElementById('staff-msg').textContent='手艺人已加入离线班表';renderScheduling()}catch(error){document.getElementById('staff-msg').textContent=error.message}};document.getElementById('leave-form').onsubmit=e=>{e.preventDefault();try{SalonSchedulingDomain.addLeave(scheduleState,Object.fromEntries(new FormData(e.currentTarget)));saveScheduleState();e.currentTarget.reset();document.getElementById('leave-msg').textContent='休假时段已保存';renderScheduling()}catch(error){document.getElementById('leave-msg').textContent=error.message}};document.getElementById('appointment-form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));data.specified=e.currentTarget.specified.checked;try{SalonSchedulingDomain.createAppointment(scheduleState,data);saveScheduleState();document.getElementById('appointment-msg').textContent='预约已创建并通过冲突检查';renderScheduling()}catch(error){document.getElementById('appointment-msg').textContent=error.message}}}
function renderScheduling(){const options='<option value="">请选择</option>'+scheduleState.staff.filter(s=>s.status==='active').map(s=>`<option value="${s.id}">${escapeHtml(s.name)}${s.station?' · '+escapeHtml(s.station):''}</option>`).join('');document.getElementById('appointment-staff').innerHTML=options;document.getElementById('leave-staff').innerHTML=options;document.getElementById('staff-list').innerHTML=scheduleState.staff.length?scheduleState.staff.map(s=>`<div class="queue-row"><div><strong>${escapeHtml(s.name)}</strong><small>${escapeHtml(s.station||'未设置工位')}</small></div></div>`).join(''):'<small>请先添加当班手艺人</small>';const statusName={confirmed:'已确认',arrived:'已到店',completed:'已完成',cancelled:'已取消',no_show:'爽约'};document.getElementById('appointment-list').innerHTML=scheduleState.appointments.length?scheduleState.appointments.slice().sort((a,b)=>a.startsAt.localeCompare(b.startsAt)).map(a=>`<div class="schedule-row"><div><strong>${escapeHtml(a.customerName)} · ${escapeHtml(a.service)}</strong><small>${dateTimeLabel(a.startsAt)}—${dateTimeLabel(a.endsAt)} · ${escapeHtml((scheduleState.staff.find(s=>s.id===a.staffId)||{}).name||'未分配')} ${a.specified?'· 指定':''}</small></div><span class="status-${a.status}">${statusName[a.status]||a.status}</span><div class="row-actions">${a.status==='confirmed'?`<button class="primary" data-appointment="${a.id}" data-status="arrived">到店</button><button class="ghost" data-appointment="${a.id}" data-status="no_show">爽约</button><button class="danger" data-appointment="${a.id}" data-status="cancelled">取消</button>`:a.status==='arrived'?`<button class="ghost" data-appointment="${a.id}" data-status="completed">预约完成</button>`:''}</div></div>`).join(''):'<div class="empty">暂无预约</div>';document.querySelectorAll('[data-appointment]').forEach(btn=>btn.onclick=()=>{try{SalonSchedulingDomain.setAppointmentStatus(scheduleState,btn.dataset.appointment,btn.dataset.status);saveScheduleState();renderScheduling()}catch(error){alert(error.message)}});const statusLabel={waiting:'候客',away:'暂离',serving:'服务中'};document.getElementById('queue-list').innerHTML=SalonSchedulingDomain.orderedQueue(scheduleState).map(q=>`<div class="queue-row"><div><strong>${escapeHtml(q.customerName)}</strong><small>${q.specified?'指定客':'轮客'} · 第${q.round}轮 · ${statusLabel[q.status]||q.status}</small></div><div class="row-actions">${q.status==='waiting'?`<button class="primary" data-queue="${q.id}" data-qstatus="serving">开始服务</button><button class="ghost" data-queue="${q.id}" data-qstatus="away">暂离</button>`:q.status==='away'?`<button class="ghost" data-queue="${q.id}" data-qstatus="waiting">回牌</button>`:q.status==='serving'?`<button class="primary" data-queue="${q.id}" data-qstatus="completed">服务完成</button>`:''}</div></div>`).join('')||'<small>预约顾客点击“到店”后自动进入轮牌</small>';document.querySelectorAll('[data-queue]').forEach(btn=>btn.onclick=()=>{try{SalonSchedulingDomain.setQueueStatus(scheduleState,btn.dataset.queue,btn.dataset.qstatus);if(btn.dataset.qstatus==='completed')SalonSchedulingDomain.setQueueStatus(scheduleState,btn.dataset.queue,'waiting');saveScheduleState();renderScheduling()}catch(error){alert(error.message)}})}
function saveOrderState(){localStorage.setItem(orderStorageKey,SalonOrderDomain.serialize(orderState))}

function reportingView(){const today=new Date().toISOString().slice(0,10);workspace.innerHTML=`<form class="panel" id="report-filter"><h3>营业日报 / 营业月报</h3><div class="form-row"><div class="field"><label>报表类型</label><select name="mode"><option value="daily">营业日报</option><option value="monthly">营业月报</option></select></div><div class="field"><label>日期</label><input name="date" type="date" value="${today}"></div><div class="field"><label>月份</label><input name="month" type="month" value="${today.slice(0,7)}"></div><div class="field"><label>门店</label><input name="store" value="自由手艺人"></div></div><button class="primary">生成报表</button></form><div class="grid" id="report-summary" style="margin-top:12px"></div><div class="customer-forms"><form class="panel" id="finance-entry"><h3>手工收支</h3><div class="form-row"><div class="field"><label>日期</label><input name="date" type="date" value="${today}" required></div><div class="field"><label>类型</label><select name="type"><option value="expense">支出</option><option value="income">收入</option></select></div><div class="field"><label>分类</label><input name="category" required></div><div class="field"><label>金额</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>说明</label><input name="note" required></div><input name="store" type="hidden" value="自由手艺人"></div><button class="ghost">保存收支记录</button><div class="msg" id="report-msg"></div></form><section class="panel"><h3>收款流水</h3><div id="payment-report"></div><h3 style="margin-top:18px">卡金流水</h3><div id="card-report"></div></section></div>`;document.getElementById('report-filter').onsubmit=e=>{e.preventDefault();renderReport(Object.fromEntries(new FormData(e.currentTarget)))};document.getElementById('finance-entry').onsubmit=e=>{e.preventDefault();try{SalonReportingDomain.addEntry(reportingState,Object.fromEntries(new FormData(e.currentTarget)));saveReporting();document.getElementById('report-msg').textContent='收支记录已追加';document.getElementById('report-filter').requestSubmit()}catch(error){document.getElementById('report-msg').textContent=error.message}};document.getElementById('report-filter').requestSubmit()}
function renderReport(f){const r=f.mode==='monthly'?SalonReportingDomain.monthly(reportingState,orderState.orders,orderState.payments,orderState.accountLedger,f.store,f.month):SalonReportingDomain.daily(reportingState,orderState.orders,orderState.payments,orderState.accountLedger,f.store,f.date),cards=[['经营净额',r.net],['净收款',r.receipts],['其他收入',r.manualIncome],['支出',r.expense]];document.getElementById('report-summary').innerHTML=cards.map(x=>`<article class="card"><h3>${x[0]}</h3><p>¥${x[1].toFixed(2)}</p></article>`).join('');const names={cash:'现金',wechat:'微信',alipay:'支付宝',member_value:'储值卡',member_units:'次卡/套餐'};document.getElementById('payment-report').innerHTML=Object.entries(r.methods).map(x=>`<div>${names[x[0]]}：¥${x[1].toFixed(2)}</div>`).join('');document.getElementById('card-report').innerHTML=r.cardLedger.length?r.cardLedger.map(x=>`<div>${escapeHtml(x.type)}：${x.balanceBefore} → ${x.balanceAfter}</div>`).join(''):'暂无卡金流水'}
function render(index){const item=modules[index];document.getElementById('title').textContent=item.name;document.getElementById('purpose').textContent=item.purpose;[...nav.children].forEach((b,i)=>b.classList.toggle('on',i===index));if(item.name==='顾客会员')customerView();else if(item.name==='预约排客')schedulingView();else if(item.name==='开单收银')cashierView();else if(item.name==='项目商品'||item.name==='库存管理')catalogInventoryView();else if(item.name==='员工组织'||item.name==='业绩工资')workforceView();else if(item.name==='财务报表')reportingView();else genericView(item)}
modules.forEach((m,i)=>{const b=document.createElement('button');b.type='button';b.textContent=m.name;b.onclick=()=>render(i);nav.appendChild(b)});render(0);
</script></body></html>
