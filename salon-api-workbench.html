<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salon 本机接口联调</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#ecf1f6;font:16px system-ui}main{max-width:880px;margin:auto;padding:24px}h1{font-size:26px}section{background:#1d2a36;padding:20px;margin:16px 0;border-radius:12px}button,input,select{font:inherit;min-height:44px;border-radius:8px;padding:10px;max-width:100%}button{background:#c3eab2;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:default}label{display:block;margin:12px 0}input,select{width:100%;margin-top:6px}p{line-height:1.6}#status{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#bfcedb}fieldset{border:0;padding:0;margin:0}nav{display:flex;gap:12px;flex-wrap:wrap}
</style></head><body><main>
<h1>门店业务 · 本机联调</h1><p>合成数据专用：页面 → HTTP → 真实业务处理器 → 临时 PostgreSQL。不是正式登录、真实收款或上线验收；不会导入旧原型数据。</p>
<nav><button id="connect">连接本机测试环境</button><button id="retry" disabled>按原请求重试</button></nav>
<p id="status" role="status">请先运行 node scripts/salon-local-integration.cjs，并打开终端给出的地址。</p>
<fieldset id="panel" disabled>
<section><h2>1 · 选择门店</h2><label>授权门店<select id="store"></select></label><small>切店清空顾客、项目和订单选择，不按姓名匹配跨店对象。</small></section>
<section><h2>2 · 顾客建档</h2><label>合成顾客姓名<input id="name" maxlength="100" value="本机测试顾客" autocomplete="off"></label><button id="createCustomer">建立合成顾客</button><label>当前门店顾客<select id="customer"></select></label></section>
<section><h2>3 · 创建订单草稿</h2><label>当前门店项目／商品<select id="item"></select></label><button id="createOrder">创建订单草稿</button><p id="order">尚未创建订单</p><button id="saveLines" disabled>保存所选商品明细</button><p>草稿和明细分两步保存。明细失败时保留原订单，不重新开单。本批不提供支付入口。</p></section>
</fieldset><script type="module" src="/packages/salon-core/workbench.mjs"></script></main></body></html>
