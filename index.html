<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface-light: #232342;
  --text: #e8e8f0;
  --text-secondary: #9a9ab8;
  --accent: #d4a574;
  --accent-glow: rgba(212, 165, 116, 0.25);
  --danger: #e0556a;
  --warning: #e0b055;
  --border: #2a2a45;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Header ── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  padding: 12px 16px 0;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}

.header h1 {
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 10px;
  background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.tabs {
  display: flex;
  gap: 0;
}

.tab-btn {
  flex: 1;
  padding: 10px 0;
  border: none;
  background: none;
  color: var(--text-secondary);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  transition: var(--transition);
  font-family: var(--font);
}

.tab-btn.active {
  color: var(--accent);
}

.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 20%;
  width: 60%;
  height: 2.5px;
  background: var(--accent);
  border-radius: 2px;
}

/* ── Main Content ── */
.main {
  padding: 16px;
  min-height: calc(100vh - 180px);
}

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Query Tab ── */
.selector-group {
  margin-bottom: 14px;
}

.selector-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.select-wrapper {
  position: relative;
}

.select-wrapper select {
  width: 100%;
  padding: 14px 40px 14px 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 15px;
  font-family: var(--font);
  appearance: none;
  cursor: pointer;
  transition: var(--transition);
}

.select-wrapper select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.select-wrapper::after {
  content: '▾';
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent);
  pointer-events: none;
  font-size: 14px;
}

.query-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, var(--accent), #b8864e);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  margin-top: 4px;
  transition: var(--transition);
  letter-spacing: 1px;
}

.query-btn:active {
  transform: scale(0.97);
  opacity: 0.9;
}

.query-btn:disabled {
  opacity: 0.4;
  transform: none;
  cursor: not-allowed;
}

/* ── Result Cards ── */
.result-area {
  margin-top: 20px;
}

.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 14px;
  overflow: hidden;
  animation: cardIn 0.4s ease-out both;
  box-shadow: var(--shadow);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-header {
  padding: 12px 16px;
  background: var(--surface-light);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.card-icon {
  font-size: 22px;
}

.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
}

.card-body {
  padding: 14px 16px;
}

.param-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  font-size: 14px;
}

.param-row:last-child {
  border-bottom: none;
}

.param-label {
  color: var(--text-secondary);
  flex-shrink: 0;
}

.param-value {
  font-weight: 600;
  text-align: right;
  margin-left: 12px;
  flex: 1;
  word-break: break-word;
  white-space: normal;
  min-width: 0;
}

.param-value.highlight {
  color: var(--accent);
}

.param-value.warn {
  color: var(--warning);
}

/* ── Rod Table ── */
.rod-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  font-size: 13px;
}

.rod-table th {
  background: var(--surface-light);
  color: var(--accent);
  padding: 8px 6px;
  font-weight: 600;
  text-align: center;
  font-size: 12px;
}

.rod-table td {
  padding: 8px 6px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  font-weight: 500;
}

.rod-table tr:last-child td {
  border-bottom: none;
}

/* ── Warning Notice ── */
.warning-notice {
  background: rgba(224, 85, 106, 0.12);
  border-left: 3px solid var(--danger);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 10px 14px;
  margin-top: 12px;
  font-size: 13px;
  color: var(--danger);
  animation: cardIn 0.5s ease-out both;
}

/* ── General Tips ── */
.tips-section {
  margin-top: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  animation: cardIn 0.6s ease-out both;
  box-shadow: var(--shadow);
}

.tips-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tips-list {
  list-style: none;
}

.tips-list li {
  padding: 5px 0;
  font-size: 13px;
  color: var(--text-secondary);
  padding-left: 16px;
  position: relative;
}

.tips-list li::before {
  content: '•';
  position: absolute;
  left: 0;
  color: var(--accent);
}

/* ── Calculator ── */
.calc-toggle {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  background: transparent;
  border: 1px dashed #555;
  border-radius: 10px;
  color: #999;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.calc-toggle:active { border-color: var(--accent); color: var(--accent); }
.calc-panel { margin-bottom: 16px; }
.calc-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #1a1a2e;
  font-size: 14px;
}
.calc-row:last-child { border-bottom: none; }
.calc-row .label { color: #999; }
.calc-row .value { color: var(--accent); font-weight: 600; }

/* ── Knowledge Base Tab ── */
.search-box {
  position: relative;
  margin-bottom: 16px;
}

.search-box input {
  width: 100%;
  padding: 13px 40px 13px 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 24px;
  color: var(--text);
  font-size: 14px;
  font-family: var(--font);
  transition: var(--transition);
}

.search-box input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-box input::placeholder {
  color: var(--text-secondary);
}

.search-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  color: var(--text-secondary);
}

.search-results-count {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  padding-left: 4px;
}

/* ── Accordion ── */
.accordion {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.accordion-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.accordion-header {
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: var(--transition);
  font-size: 15px;
  font-weight: 600;
}

.accordion-header:active {
  background: var(--surface-light);
}

.accordion-arrow {
  font-size: 12px;
  color: var(--accent);
  transition: var(--transition);
}

.accordion-item.open .accordion-arrow {
  transform: rotate(180deg);
}

.accordion-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}

.accordion-item.open .accordion-body {
  max-height: 2000px;
}

.accordion-content {
  padding: 0 16px 16px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
}

.accordion-content .kb-subtitle {
  color: var(--accent);
  font-weight: 600;
  margin: 10px 0 4px;
  font-size: 14px;
}

.accordion-content .kb-subtitle:first-child {
  margin-top: 0;
}

.accordion-content p {
  margin: 4px 0;
}

.accordion-content .highlight {
  color: var(--accent);
  font-weight: 600;
}

.accordion-content .search-highlight {
  background: rgba(212, 165, 116, 0.3);
  border-radius: 2px;
  padding: 0 2px;
}

.no-results {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}

.no-results .icon {
  font-size: 40px;
  margin-bottom: 12px;
}

/* ── Footer ── */
.footer {
  text-align: center;
  padding: 16px;
  font-size: 12px;
  color: var(--text-secondary);
  border-top: 1px solid var(--border);
  background: var(--surface);
}

.footer .dot {
  color: var(--accent);
  margin: 0 4px;
}

/* ── Floating Back to Top ── */
.back-to-top {
  position: fixed;
  bottom: 24px;
  right: 20px;
  width: 42px;
  height: 42px;
  background: var(--accent);
  border: none;
  border-radius: 50%;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  opacity: 0;
  transform: translateY(20px);
  transition: var(--transition);
  box-shadow: 0 4px 16px rgba(212, 165, 116, 0.35);
  z-index: 50;
  pointer-events: none;
}

.back-to-top.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface-light);
  color: var(--text);
  padding: 10px 22px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
  box-shadow: var(--shadow);
  pointer-events: none;
}

.toast.show {
  opacity: 1;
}

</style>

      const wTension = hairLevel <= 2 ? '中高张力（拉紧但不拉扯）' : '中低张力（拉紧但不拉扯）';
      html += `<div style="margin-top:10px;padding:10px;background:rgba(212,165,116,0.06);border-radius:8px;font-size:12px;color:var(--text-secondary);line-height:1.8;">
        <div style="color:var(--accent);font-weight:600;margin-bottom:4px;">🐑 羊毛卷核心法则</div>
        ▸ <b>发片</b>：宽度≈杠长，厚度≈杠直径，<b>宁薄勿厚</b><br>
        ▸ <b>张力</b>：${wTension}<br>
        ▸ <b>方向</b>：顶部向后 · 侧区向后向下 · 后区自然下落<br>
        ▸ <b>杠号梯度</b>：顶部13mm(紧) → 两侧14mm(中) → 后区15mm(松) → 上紧下松<br>▸ <b>卷度逻辑</b>：软化90~100% + 小杠 + 高密度 + 充分加热 = 标准羊毛卷<br>
        ▸ <b>口诀</b>：发片要薄 · 提拉要高 · 杠子要小 · 排杠要密 · 软化要足
      </div>`;
    }

    html += `</div></div>`;

    // 🔥 加热建议
    const heatInfo = hairLevel <= 1 ? {temp:'110~120℃',time:'15~18分',note:'健康发可高温快烤'} :
                     hairLevel === 2 ? {temp:'110℃',time:'12~15分',note:'中度健康标准烤'} :
                     hairLevel === 3 ? {temp:'100~110℃',time:'10~12分',note:'受损发减温减时'} :
                     hairLevel === 4 ? {temp:'90~100℃',time:'8~10分',note:'严重受损低温慢烤'} :
                                       {temp:'80~90℃',time:'5~8分',note:'极度脆弱，宁欠勿过'};
    html += `<div class="result-card" style="animation-delay:0.15s">
      <div class="card-header">
        <span class="card-icon">🔥</span>
        <span class="card-title">加热建议</span>
      </div>
      <div class="card-body">
        <div class="param-row"><span class="param-label">烘干打底</span><span class="param-value">包棉 60℃ × 15分（去多余水分）</span></div>
        <div class="param-row"><span class="param-label">正式加热</span><span class="param-value highlight">${heatInfo.temp} × ${heatInfo.time}</span></div>
        <div class="param-row"><span class="param-label">注意</span><span class="param-value" style="font-size:12px;color:var(--warning);">${heatInfo.note}</span></div>
        <div class="param-row"><span class="param-label">检查标准</span><span class="param-value" style="font-size:12px;">八成干即可，全干反而不卷</span></div>
      </div>
    </div>`;

    // Warning
    if (data.warning) {
      html += `<div class="warning-notice">${data.warning}</div>`;
    }

    // Tips
    html += renderTips();

    resultArea.innerHTML = html;
  }

  function renderTips() {
    return `<div class="tips-section" style="animation-delay:0.2s">
      <div class="tips-title">💡 核心法则</div>
      <ul class="tips-list">
        <li><b>假性软化鉴别：</b>细软发摸软但有硬感 → 喷水冲掉药水 → 拉不动=假性，拉得动=真到位</li>
        <li><b>软化核心：</b>张力强→去除 / 张力中→保留 / 张力弱→加强。用一种软化度套所有发质必翻车</li>
        <li><b>渗透式三步：</b>①同级药水:水=2:1稀释→10分→拆杠 ②正式药水→15分→拆杠 ③需更高→同级药水:水=1:1→10分→冲水</li>
        <li><b>药卷三场景：</b>①发根蓬松→最后一遍涂药时发根上药就卷 ②难烫发质→提前上药卷抢变卷时间 ③质感造型烫→吹干+高温夹板+喷水再烫→卷度弹性好</li>
        <li><b>混合发质：</b>受损区先涂CA → 全头一次涂对应等级药水 → CA自动降级受损区。如需高软化度，CA后接渗透式继续操作</li>
      </ul>
    </div>`;
  }

  // === Back to top ===
  window.addEventListener('scroll', () => {
    backToTop.classList.toggle('show', window.scrollY > 400);
  });

  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // === Calculator ===
  const calcToggle = document.getElementById('calc-toggle');
  const calcPanel = document.getElementById('calc-panel');
  const calcBtn = document.getElementById('calc-btn');
  const calcResult = document.getElementById('calc-result');

  calcToggle.addEventListener('click', () => {
    const show = calcPanel.style.display === 'none';
    calcPanel.style.display = show ? 'block' : 'none';
    calcToggle.textContent = show ? '🧮 收起换算' : '🧮 自由比例换算';
    if (show) calcPanel.scrollIntoView({ behavior: 'smooth' });
  });

  calcBtn.addEventListener('click', () => {
    const tga = parseFloat(document.getElementById('calc-tga').value) || 0;
    const ca = parseFloat(document.getElementById('calc-ca').value) || 0;
    const amount = parseFloat(document.getElementById('calc-amount').value) || 50;
    const extra = parseFloat(document.getElementById('calc-extra').value) || 0;

    if (tga <= 0 && ca <= 0) { showToast('请至少输入一份 TGA 或 CA'); return; }

    const totalParts = tga + ca;
    const tgaG = totalParts > 0 ? (tga / totalParts * amount) : 0;
    const caG = totalParts > 0 ? (ca / totalParts * amount) : 0;
    const total = amount + extra;

    let html = '';
    html += `<div style="padding:4px 0;color:#999;font-size:13px;margin-bottom:8px;">`;
    html += `TGA:CA = <b style="color:var(--accent);">${tga}:${ca}</b>`;
    if (totalParts > 0) {
      const pct = (tga / totalParts * 100).toFixed(0);
      html += ` · TGA占比 ${pct}%`;
    }
    html += `</div>`;

    html += `<div class="calc-row"><span class="label">TGA 用量</span><span class="value" style="color:var(--accent);">${tgaG.toFixed(1)} g</span></div>`;
    html += `<div class="calc-row"><span class="label">CA 用量</span><span class="value" style="color:var(--danger);">${caG.toFixed(1)} g</span></div>`;
    if (extra > 0) {
      html += `<div class="calc-row"><span class="label">稀释液（水/蛋白）</span><span class="value">${extra.toFixed(0)} g</span></div>`;
    }
    html += `<div class="calc-row" style="border-top:1px solid #333;margin-top:4px;padding-top:8px;"><span class="label">调配总量</span><span class="value" style="font-weight:700;">${total.toFixed(1)} g</span></div>`;

    // Quick reference — TGA 原液≈9.5%, CA 原液≈2%
    const tgaPH = 9, caPH = 5.5;
    if (totalParts > 0) {
      const mixPH = ((tga * tgaPH + ca * caPH) / totalParts).toFixed(1);
      const tgaThio = 9.5, caThio = 2;
      // 额外稀释降低硫代浓度：硫代总量 / 调配总量
      const thioTotal = (tgaG * tgaThio / 100) + (caG * caThio / 100);
      const mixThio = (thioTotal / total * 100).toFixed(1);
      html += `<div style="margin-top:12px;padding:10px;background:#1a1a2e;border-radius:8px;font-size:12px;color:#999;">`;
      html += `📊 混合后 ≈ PH <b style="color:var(--accent);">${mixPH}</b> · 硫代 ≈ <b style="color:var(--accent);">${mixThio}%</b>`;
      if (extra > 0) html += ` <span style="color:#666;">(已含稀释)</span>`;
      html += `<br>💡 加水/蛋白稀释 → 降药性不降PH</div>`;
    }

    calcResult.innerHTML = html;
  });

  // === Toast ===
  function showToast(msg, duration = 2000) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
      toast.classList.remove('show');
    }, duration);
  }

  // === PWA Service Worker ===
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const swCode = `
        const CACHE = 'perm-app-v1';
        const URLS = ['.'];
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(URLS)));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(
            caches.match(e.request).then(r => r || fetch(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    });
  }
});
  // === 自动更新检测 ===
  const APP_VERSION = 'v2.4';
  let updateTimer = null;
  
  function checkUpdate() {
    fetch(location.href, { method: 'HEAD', cache: 'no-store' })
      .then(r => r.headers.get('content-length'))
      .then(len => {
        const key = 'app_content_len';
        const prev = localStorage.getItem(key);
        if (prev && prev !== len) {
          // 内容变了，显示更新提示
          const banner = document.createElement('div');
          banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#d4a574;color:#000;text-align:center;padding:10px;z-index:999;font-weight:700;cursor:pointer;font-size:14px;';
          banner.textContent = '🔄 有更新，点击刷新';
          banner.onclick = () => { localStorage.setItem(key, len); location.reload(); };
          document.body.prepend(banner);
        }
        localStorage.setItem(key, len);
      })
      .catch(() => {});
  }
  
  // 页面加载时立即存
  fetch(location.href, { method: 'HEAD', cache: 'no-store' })
    .then(r => r.headers.get('content-length'))
    .then(len => localStorage.setItem('app_content_len', len))
    .catch(() => {});
  
  // 每60秒检查一次
  updateTimer = setInterval(checkUpdate, 60000);
</script>

</body>
</html>
