<!DOCTYPE html>
<html lang="zh-CN" data-version="23">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>自由手艺人 · X</title>
<link rel="apple-touch-icon" href="apple-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #000000;
  --surface: #16181c;
  --surface-light: #1d1f23;
  --text: #e7e9ea;
  --text-secondary: #71767b;
  --accent: #e7e9ea;
  --accent-glow: rgba(231, 233, 234, 0.12);
  --danger: #f4212e;
  --warning: #ffd700;
  --border: #2f3336;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Header ── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  padding: 14px 16px 6px;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}

.header h1 {
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 10px;
  color: #ffffff;
}

.tabs {
  display: flex;
  gap: 0;
}

.tab-btn {
  flex: 1;
  padding: 10px 0;
  border: none;
  background: none;
  color: var(--text-secondary);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  transition: var(--transition);
  font-family: var(--font);
}

.tab-btn.active {
  color: var(--accent);
}

.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 20%;
  width: 60%;
  height: 2.5px;
  background: var(--accent);
  border-radius: 2px;
}

/* ── Main Content ── */
.main {
  padding: 16px;
  min-height: calc(100vh - 180px);
}

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Query Tab ── */
.selector-group {
  margin-bottom: 14px;
}

.selector-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.select-wrapper {
  position: relative;
}

.select-wrapper select {
  width: 100%;
  padding: 14px 40px 14px 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 15px;
  font-family: var(--font);
  appearance: none;
  cursor: pointer;
  transition: var(--transition);
}

.select-wrapper select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.select-wrapper::after {
  content: '▾';
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent);
  pointer-events: none;
  font-size: 14px;
}

.query-btn {
  width: 100%;
  padding: 15px;
  background: #e7e9ea;
  border: none;
  border-radius: var(--radius);
  color: #000;
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  margin-top: 4px;
  transition: var(--transition);
  letter-spacing: 1px;
}

.query-btn:active {
  transform: scale(0.97);
  opacity: 0.9;
}

.query-btn:disabled {
  opacity: 0.4;
  transform: none;
  cursor: not-allowed;
}

/* ── Result Cards ── */
.result-area {
  margin-top: 20px;
}

.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 14px;
  overflow: hidden;
  animation: cardIn 0.4s ease-out both;
  box-shadow: var(--shadow);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-header {
  padding: 12px 16px;
  background: var(--surface-light);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.card-icon {
  font-size: 22px;
}

.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
}

.card-body {
  padding: 14px 16px;
}

.param-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  font-size: 14px;
}

.param-row:last-child {
  border-bottom: none;
}

.param-label {
  color: var(--text-secondary);
  flex-shrink: 0;
}

.param-value {
  font-weight: 600;
  text-align: right;
  margin-left: 12px;
  flex: 1;
  word-break: break-word;
  white-space: normal;
  min-width: 0;
}

.param-value.highlight {
  color: var(--accent);
}

.param-value.warn {
  color: var(--warning);
}

/* ── Rod Table ── */
.rod-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  font-size: 13px;
}

.rod-table th {
  background: var(--surface-light);
  color: var(--accent);
  padding: 8px 6px;
  font-weight: 600;
  text-align: center;
  font-size: 12px;
}

.rod-table td {
  padding: 8px 6px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  font-weight: 500;
}

.rod-table tr:last-child td {
  border-bottom: none;
}

/* ── Warning Notice ── */
.warning-notice {
  background: rgba(224, 85, 106, 0.12);
  border-left: 3px solid var(--danger);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 10px 14px;
  margin-top: 12px;
  font-size: 13px;
  color: var(--danger);
  animation: cardIn 0.5s ease-out both;
}

/* ── General Tips ── */
.tips-section {
  margin-top: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  animation: cardIn 0.6s ease-out both;
  box-shadow: var(--shadow);
}

.tips-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tips-list {
  list-style: none;
}

.tips-list li {
  padding: 5px 0;
  font-size: 13px;
  color: var(--text-secondary);
  padding-left: 16px;
  position: relative;
}

.tips-list li::before {
  content: '•';
  position: absolute;
  left: 0;
  color: var(--accent);
}

/* ── Calculator ── */
.calc-toggle {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  background: transparent;
  border: 1px dashed #555;
  border-radius: 10px;
  color: #999;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.calc-toggle:active { border-color: var(--accent); color: var(--accent); }
.calc-panel { margin-bottom: 16px; }
.calc-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.calc-row:last-child { border-bottom: none; }
.calc-row .label { color: #999; }
.calc-row .value { color: var(--accent); font-weight: 600; }

.preset-btn:hover { border-color: var(--accent) !important; color: var(--accent) !important; background: rgba(231,233,234,0.08) !important; }
.preset-btn:active { background: rgba(231,233,234,0.14) !important; }

/* ── Knowledge Base Tab ── */
.search-box {
  position: relative;
  margin-bottom: 16px;
}

.search-box input {
  width: 100%;
  padding: 13px 40px 13px 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 24px;
  color: var(--text);
  font-size: 14px;
  font-family: var(--font);
  transition: var(--transition);
}

.search-box input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-box input::placeholder {
  color: var(--text-secondary);
}

.search-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  color: var(--text-secondary);
}

.search-results-count {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  padding-left: 4px;
}

/* ── Accordion ── */
.accordion {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.accordion-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.accordion-header {
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: var(--transition);
  font-size: 15px;
  font-weight: 600;
}

.accordion-header:active {
  background: var(--surface-light);
}

.accordion-arrow {
  font-size: 12px;
  color: var(--accent);
  transition: var(--transition);
}

.accordion-item.open .accordion-arrow {
  transform: rotate(180deg);
}

.accordion-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}

.accordion-item.open .accordion-body {
  max-height: 2000px;
}

.accordion-content {
  padding: 0 16px 16px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
}

.accordion-content .kb-subtitle {
  color: var(--accent);
  font-weight: 600;
  margin: 10px 0 4px;
  font-size: 14px;
}

.accordion-content .kb-subtitle:first-child {
  margin-top: 0;
}

.accordion-content p {
  margin: 4px 0;
}

.accordion-content .highlight {
  color: var(--accent);
  font-weight: 600;
}

.accordion-content .search-highlight {
  background: rgba(212, 165, 116, 0.3);
  border-radius: 2px;
  padding: 0 2px;
}

.no-results {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}

.no-results .icon {
  font-size: 40px;
  margin-bottom: 12px;
}

/* ── Footer ── */
.footer {
  text-align: center;
  padding: 16px;
  font-size: 12px;
  color: var(--text-secondary);
  border-top: 1px solid var(--border);
  background: var(--surface);
}

.footer .dot {
  color: var(--accent);
  margin: 0 4px;
}

/* ── Floating Back to Top ── */
.back-to-top {
  position: fixed;
  bottom: 24px;
  right: 20px;
  width: 42px;
  height: 42px;
  background: var(--accent);
  border: none;
  border-radius: 50%;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  opacity: 0;
  transform: translateY(20px);
  transition: var(--transition);
  box-shadow: 0 4px 16px rgba(212, 165, 116, 0.35);
  z-index: 50;
  pointer-events: none;
}

.back-to-top.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface-light);
  color: var(--text);
  padding: 10px 22px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
  box-shadow: var(--shadow);
  pointer-events: none;
}

.toast.show {
  opacity: 1;
}

</style>
</head>
<body>

<!-- WiFi检测锁：仅店内WiFi可查看 -->
<div id="wifi-lock" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;">
  <div>
    <div style="font-size:48px;margin-bottom:16px;">🔒</div>
    <h2 style="color:var(--accent);margin-bottom:8px;">仅限店内网络</h2>
    <p style="color:var(--text-secondary);font-size:14px;line-height:1.6;margin-bottom:24px;">
      请连接「自由手艺人」店内 WiFi 后刷新
    </p>
    <div style="border-top:1px solid var(--border);padding-top:20px;margin-top:8px;">
      <p style="color:var(--text-secondary);font-size:12px;margin-bottom:12px;">管理员远程访问</p>
      <input type="password" id="admin-pwd" placeholder="输入管理密码" style="width:100%;max-width:200px;padding:10px 14px;background:var(--surface-light);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;text-align:center;margin-bottom:12px;">
      <br>
      <button onclick="unlockAdmin()" style="padding:10px 28px;background:var(--accent);color:var(--bg);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">🔓 解锁</button>
      <div id="pwd-error" style="color:var(--danger);font-size:12px;margin-top:8px;display:none;">密码错误</div>
    </div>
  </div>
</div>

<script>
// 如果之前解锁过，直接放行
if (localStorage.getItem('perm-admin-unlocked') === '1') {
  document.getElementById('wifi-lock').style.display = 'none';
  document.body.style.overflow = '';
} else {
  checkWiFi();
}

function checkWiFi() {
  var lock = document.getElementById('wifi-lock');
  lock.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  var unlocked = false;
  function unlock() {
    if (!unlocked) { unlocked = true; lock.style.display = 'none'; document.body.style.overflow = ''; }
  }

  // 方法1：WebRTC 获取本机IP（桌面端快）
  var pc = new RTCPeerConnection({iceServers:[]});
  pc.createDataChannel('');
  pc.createOffer().then(function(o){pc.setLocalDescription(o)});
  var webRTCdone = false;
  pc.onicecandidate = function(e){
    if (!e.candidate) { webRTCdone = true; try { pc.close(); } catch(e) {} return; }
    var m = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
    if (m) {
      var parts = m[1].split('.');
      if (parts[0]==='192' && parts[1]==='168' && parts[2]==='3') {
        unlock();
      }
      webRTCdone = true;
      try { pc.close(); } catch(e) {}
    }
  };

  // 方法2：尝试访问店内服务器（手机端更可靠）
  // 同时用 fetch 和 img 双路探测
  setTimeout(function(){
    // 2a: fetch探测（支持no-cors的浏览器）
    var ctrl = new AbortController();
    setTimeout(function(){ ctrl.abort(); }, 3000);
    fetch('http://192.168.3.250:8899/', {mode:'no-cors',signal:ctrl.signal})
      .then(function(){ unlock(); })
      .catch(function(){});
    // 2b: img探测（兜底旧浏览器）
    var img = new Image();
    var timer = setTimeout(function(){ img.src = ''; }, 4000);
    img.onload = function(){ clearTimeout(timer); unlock(); };
    img.onerror = function(){ clearTimeout(timer); };
    img.src = 'http://192.168.3.250:8899/?' + Date.now();
    // 2c: 路由器探测（兜底，路由器永远在线）
    var img2 = new Image();
    var timer2 = setTimeout(function(){ img2.src = ''; }, 3000);
    img2.onload = function(){ clearTimeout(timer2); unlock(); };
    img2.onerror = function(){ clearTimeout(timer2); };
    img2.src = 'http://192.168.3.1/favicon.ico?' + Date.now();
  }, 500);

  // 8秒总超时 → 显示锁屏
  setTimeout(function(){
    try { pc.close(); } catch(e) {}
    if (!unlocked) {
      lock.style.display = 'flex';
    }
  }, 8000);
}

function unlockAdmin() {
  if (document.getElementById('admin-pwd').value === 'tao19841206') {
    document.getElementById('wifi-lock').style.display = 'none';
    document.body.style.overflow = '';
    localStorage.setItem('perm-admin-unlocked', '1');
    document.getElementById('pwd-error').style.display = 'none';
  } else {
    document.getElementById('pwd-error').style.display = 'block';
  }
}
</script>

<!-- Header -->
<header class="header">
  <h1>自由手艺人</h1>
</header>

<!-- Tab Nav -->
<nav class="tab-nav">
  <button class="tab-btn active" data-tab="query">🔍 查询方案</button>
  <button class="tab-btn" data-tab="calc">🧮 自由换算</button>
</nav>

<!-- Main -->
<main class="main">

  <!-- Query Tab -->
  <section class="tab-content active" id="tab-query">
    <div class="selector-group">
      <label>发质类型</label>
      <div class="select-wrapper">
        <select id="hair-type">
          <option value="">请选择发质类型</option>
        </select>
      </div>
    </div>
    <div class="selector-group">
      <label>烫发款式</label>
      <div class="select-wrapper">
        <select id="perm-style">
          <option value="">请选择烫发款式</option>
        </select>
      </div>
    </div>
    <button class="query-btn" id="query-btn" disabled>🔍 查询方案</button>

  <!-- Calc Tab -->

      <div class="card-header">
        <span class="card-icon">🧪</span>
        <span class="card-title">自由比例调配</span>
      </div>
      <div class="card-body">
        <!-- 快速预设 -->
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
          <button class="preset-btn" data-tga="3" data-ca="0" style="flex:1;min-width:55px;padding:8px 4px;background:var(--surface-light);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font);">纯TGA</button>
          <button class="preset-btn" data-tga="6" data-ca="1" style="flex:1;min-width:45px;padding:8px 4px;background:var(--surface-light);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font);">6:1</button>
          <button class="preset-btn" data-tga="3" data-ca="1" style="flex:1;min-width:45px;padding:8px 4px;background:var(--surface-light);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font);">3:1</button>
          <button class="preset-btn" data-tga="1" data-ca="1" style="flex:1;min-width:45px;padding:8px 4px;background:var(--surface-light);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font);">1:1</button>
          <button class="preset-btn" data-tga="1" data-ca="10" style="flex:1;min-width:50px;padding:8px 4px;background:var(--surface-light);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font);">1:10</button>
          <button class="preset-btn" data-tga="0" data-ca="1" style="flex:1;min-width:55px;padding:8px 4px;background:var(--surface-light);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font);">纯CA</button>
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;">
          <div class="selector-group" style="flex:1;margin-bottom:0;">
            <label>TGA 份数</label>
            <input type="number" id="calc-tga" value="1" min="0" max="50" step="0.5" style="width:100%;padding:12px;background:#0d0d0d;border:1px solid var(--border);border-radius:8px;color:#fff;font-size:16px;text-align:center;">
          </div>
          <span style="color:var(--accent);font-size:20px;font-weight:700;margin-top:20px;">:</span>
          <div class="selector-group" style="flex:1;margin-bottom:0;">
            <label>CA 份数</label>
            <input type="number" id="calc-ca" value="1" min="0" max="50" step="0.5" style="width:100%;padding:12px;background:#0d0d0d;border:1px solid var(--border);border-radius:8px;color:#fff;font-size:16px;text-align:center;">
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-bottom:12px;">

document.addEventListener('DOMContentLoaded', () => {

  const queryBtn = document.getElementById('query-btn');
  const resultArea = document.getElementById('result-area');
  const backToTop = document.getElementById('back-to-top');
  const toast = document.getElementById('toast');

  // === Init selectors ===
  HAIR_TYPES.forEach(ht => {
    const opt = document.createElement('option');
    opt.value = ht.id;
    opt.textContent = ht.label;
    hairTypeSelect.appendChild(opt);
  });

  PERM_STYLES.forEach(ps => {
    const opt = document.createElement('option');
    opt.value = ps.id;
    opt.textContent = ps.label;
    permStyleSelect.appendChild(opt);
  });

  // === Enable query button ===
  function checkQueryReady() {
    queryBtn.disabled = !(hairTypeSelect.value && permStyleSelect.value);
  }
  hairTypeSelect.addEventListener('change', checkQueryReady);
  permStyleSelect.addEventListener('change', checkQueryReady);

  // === Query ===
  queryBtn.addEventListener('click', async () => {
    const hair = hairTypeSelect.value;
    const style = permStyleSelect.value;
    if (!hair || !style) return;

    // 等待数据加载
    if (!DATA_LOADED) {
      showToast('数据加载中，请稍候再试...');
      return;
    }

    const result = PERM_DATA_CACHE.find(d => d.hairType === hair && d.permStyle === style);
    if (!result) {
      showToast('暂无该组合的数据，请尝试其他搭配');
      resultArea.innerHTML = '';
      return;
    }

    renderResult(result);
    resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

    const heatInfo = hairLevel <= 1 ? {temp:'110~120℃',time:'15~18分',note:'健康发可高温快烤'} :
                     hairLevel === 2 ? {temp:'110℃',time:'12~15分',note:'中度健康标准烤'} :
                     hairLevel === 3 ? {temp:'100~110℃',time:'10~12分',note:'受损发减温减时'} :
                     hairLevel === 4 ? {temp:'90~100℃',time:'8~10分',note:'严重受损低温慢烤'} :
                                       {temp:'80~90℃',time:'5~8分',note:'极度脆弱，宁欠勿过'};
    html += `<div class="result-card" style="animation-delay:0.15s">
      <div class="card-header">
        <span class="card-icon">🔥</span>
        <span class="card-title">加热建议</span>
      </div>
      <div class="card-body">
        <div class="param-row"><span class="param-label">烘干打底</span><span class="param-value">包棉 60℃ × 15分（去多余水分）</span></div>
        <div class="param-row"><span class="param-label">正式加热</span><span class="param-value highlight">${heatInfo.temp} × ${heatInfo.time}</span></div>
        <div class="param-row"><span class="param-label">注意</span><span class="param-value" style="font-size:12px;color:var(--warning);">${heatInfo.note}</span></div>
        <div class="param-row"><span class="param-label">检查标准</span><span class="param-value" style="font-size:12px;">全部加干</span></div>
      </div>
    </div>`;

    // Warning
    if (data.warning) {
      html += `<div class="warning-notice">${data.warning}</div>`;
    }

    // Tips
    html += renderTips();

    resultArea.innerHTML = html;
  }

  function renderTips() {
    return `<div class="tips-section" style="animation-delay:0.2s">
      <div class="tips-title">💡 核心法则</div>
      <ul class="tips-list">
        <li><b>假性软化鉴别：</b>细软发摸软但有硬感 → 喷水冲掉药水 → 拉不动=假性，拉得动=真到位</li>
        <li><b>软化核心：</b>张力强→去除 / 张力中→保留 / 张力弱→加强。用一种软化度套所有发质必翻车</li>
        <li><b>渗透式三步：</b>①同级药水:水=2:1稀释→10分→拆杠 ②正式药水→15分→拆杠 ③需更高→同级药水:水=1:1→10分→冲水</li>
        <li><b>药卷三场景：</b>①发根蓬松→最后一遍涂药时发根上药就卷 ②难烫发质→提前上药卷抢变卷时间 ③质感造型烫→吹干+高温夹板+喷水再烫→卷度弹性好</li>
        <li><b>混合发质：</b>受损区先涂CA → 全头一次涂对应等级药水 → CA自动降级受损区。如需高软化度，CA后接渗透式继续操作</li>
      </ul>
    </div>`;
  }

  // === Back to top ===
  window.addEventListener('scroll', () => {
    backToTop.classList.toggle('show', window.scrollY > 400);
  });

  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // === Tab Switching ===
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn, .tab-content').forEach(function(el) {
        el.classList.remove('active');
      });
      this.classList.add('active');
      document.getElementById('tab-' + this.dataset.tab).classList.add('active');
    });
  });

  // === Calculator ===
  // 固定配比化学值表（独立于方案，不受查询影响）
  function getFixedChem(tga, ca) {
    // 简化配比 → 匹配固定参考值
    if (tga <= 0 && ca <= 0) return null;
    if (ca === 0) return { ph: '9.5', thio: '9.5%' };  // 纯TGA
    if (tga === 0) return { ph: '5.5', thio: '2.0%' };  // 纯CA
    var r = tga / ca;
    if (r >= 5.5 && r <= 6.5) return { ph: '8.9', thio: '8.4%' };
    if (r >= 2.8 && r <= 3.2) return { ph: '8.5', thio: '7.6%' };
    if (r >= 1.4 && r <= 1.6) return { ph: '7.9', thio: '6.5%' };
    if (r >= 0.95 && r <= 1.05) return { ph: '7.5', thio: '5.8%' };
    if (r >= 0.15 && r <= 0.18) return { ph: '6.1', thio: '3.1%' };  // ~1:6
    if (r >= 0.05 && r <= 0.12) return { ph: '5.9', thio: '2.7%' };  // 1:10~1:20
    return null; // 自定义配比
  }

  const calcBtn = document.getElementById('calc-btn');
  const calcResult = document.getElementById('calc-result');

  // 快速预设按钮
  document.querySelectorAll('.preset-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.getElementById('calc-tga').value = this.dataset.tga;
      document.getElementById('calc-ca').value = this.dataset.ca;
      document.getElementById('calc-amount').value = 50;
      document.getElementById('calc-extra').value = 0;
      // 点击预设后自动计算
      calcBtn.click();
    });
  });

  calcBtn.addEventListener('click', () => {
    const tga = parseFloat(document.getElementById('calc-tga').value) || 0;
    const ca = parseFloat(document.getElementById('calc-ca').value) || 0;
    const amount = parseFloat(document.getElementById('calc-amount').value) || 50;
    const extra = parseFloat(document.getElementById('calc-extra').value) || 0;

    if (tga <= 0 && ca <= 0) { showToast('请至少输入一份 TGA 或 CA'); return; }

    const totalParts = tga + ca;
    const tgaG = totalParts > 0 ? (tga / totalParts * amount) : 0;
    const caG = totalParts > 0 ? (ca / totalParts * amount) : 0;
    const total = amount + extra;

    let html = '';
    html += `<div style="padding:4px 0;color:#999;font-size:13px;margin-bottom:8px;">`;
    html += `TGA:CA = <b style="color:var(--accent);">${tga}:${ca}</b>`;
    if (totalParts > 0) {
      const pct = (tga / totalParts * 100).toFixed(0);
      html += ` · TGA占比 ${pct}%`;
    }
    html += `</div>`;

    html += `<div class="calc-row"><span class="label">TGA 用量</span><span class="value" style="color:var(--accent);">${tgaG.toFixed(1)} g</span></div>`;
    html += `<div class="calc-row"><span class="label">CA 用量</span><span class="value" style="color:var(--danger);">${caG.toFixed(1)} g</span></div>`;
    if (extra > 0) {
      html += `<div class="calc-row"><span class="label">稀释液（水/蛋白）</span><span class="value">${extra.toFixed(0)} g</span></div>`;
    }
    html += `<div class="calc-row" style="border-top:1px solid var(--border);margin-top:4px;padding-top:8px;"><span class="label">调配总量</span><span class="value" style="font-weight:700;">${total.toFixed(1)} g</span></div>`;

    // PH/硫代：按固定配比表查询 + 真实稀释计算
    const fixedRef = getFixedChem(tga, ca);
    if (fixedRef) {
      const origThio = parseFloat(fixedRef.thio);
      if (extra > 0) {
        const dilutedThio = (origThio * amount / total).toFixed(1);
        html += `<div style="margin-top:12px;padding:10px;background:var(--surface);border-radius:8px;font-size:12px;color:#999;">`;
        html += `📊 PH <b style="color:var(--accent);">${fixedRef.ph}</b>`;
        html += ` · 原硫代 <span style="color:var(--text-secondary);">${fixedRef.thio}</span>`;
        html += ` → 稀释后 <b style="color:var(--accent);">${dilutedThio}%</b>`;
        html += `<br>💡 ${amount.toFixed(0)}g药水 + ${extra.toFixed(0)}g水 → 总量${total.toFixed(0)}g，硫代稀释至${dilutedThio}%</div>`;
      } else {
        html += `<div style="margin-top:12px;padding:10px;background:var(--surface);border-radius:8px;font-size:12px;color:#999;">`;
        html += `📊 PH <b style="color:var(--accent);">${fixedRef.ph}</b> · 硫代 <b style="color:var(--accent);">${fixedRef.thio}</b>`;
        html += `<br>💡 加水/蛋白稀释 → 降药性不降PH</div>`;
      }
    } else if (totalParts > 0) {
      html += `<div style="margin-top:12px;padding:10px;background:var(--surface);border-radius:8px;font-size:12px;color:#666;">`;
      html += `⚠️ 自定义配比，无预设PH/硫代数据`;
      if (extra > 0) html += ` (已含稀释)`;
      html += `</div>`;
    }

    calcResult.innerHTML = html;
  });

  // === Toast ===
  function showToast(msg, duration = 2000) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
      toast.classList.remove('show');
    }, duration);
  }

  // === PWA Service Worker ===
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const swCode = `
        const CACHE = 'perm-app-v1';
        const URLS = ['.'];
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(URLS)));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(
            caches.match(e.request).then(r => r || fetch(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    });
  }
});
</script>

<!-- 版本更新检测 -->
<div id="update-banner" style="display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:99998;background:var(--accent);color:var(--bg);padding:12px 24px;border-radius:24px;font-size:14px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.5);cursor:pointer;animation:pulse 2s infinite;}" onclick="location.reload()">
  🔄 有新版本，点击刷新
</div>
<script>
(function(){
  var VER = parseInt(document.documentElement.getAttribute('data-version')) || 1;
  setInterval(function(){
    fetch(location.href + '?_t=' + Date.now())
      .then(function(r){return r.text()})
      .then(function(t){
        var m = t.match(/data-version="(\d+)"/);
        if (m && parseInt(m[1]) > VER) {
          document.getElementById('update-banner').style.display = 'block';
        }
      })
      .catch(function(){});
  }, 60000);
})();
</script>
