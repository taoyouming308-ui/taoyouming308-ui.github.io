<!DOCTYPE html>
<html lang="zh-CN" data-version="203">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>自由手艺人 · X</title>
<link rel="apple-touch-icon" href="apple-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #000000;
  --surface: #16181c;
  --surface-light: #1d1f23;
  --text: #e7e9ea;
  --text-secondary: #71767b;
  --accent: #e7e9ea;
  --accent-glow: rgba(232, 233, 234, 0.12);
  --danger: #f4212e;
  --warning: #ffd700;
  --border: #2f3336;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --font: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Header ── */
.tabs {
  display: flex;
  gap: 0;
}

/* ── Main Content ── */
.main {
  padding: 16px;
  min-height: calc(100vh - 180px);
}

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Query Tab ── */
.selector-group {
  margin-bottom: 14px;
}

.selector-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.select-wrapper {
  position: relative;
}

.select-wrapper select {
  width: 100%;
  padding: 14px 40px 14px 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 15px;
  font-family: var(--font);
  appearance: none;
  cursor: pointer;
  transition: var(--transition);
}

.select-wrapper select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

/* ── Chip Selector ── */
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.chip {
  padding: 6px 12px;
  background: var(--surface-light);
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--text-secondary);
  font-size: 11px;
  font-family: var(--font);
  cursor: pointer;
  transition: var(--transition);
  user-select: none;
  white-space: nowrap;
}
.chip.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
}
.chip-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.section-title-sm {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.consistency-pass { color: #2ecc71; }
.consistency-warn { color: var(--warning); }
.consistency-fail { color: var(--danger); }

.select-wrapper::after {
  content: '▾';
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent);
  pointer-events: none;
  font-size: 14px;
}

.query-btn {
  width: 100%;
  padding: 15px;
  background: #e7e9ea;
  border: none;
  border-radius: var(--radius);
  color: #000;
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  margin-top: 4px;
  transition: var(--transition);
  letter-spacing: 1px;
}

.query-btn:active {
  transform: scale(0.97);
  opacity: 0.9;
}

.query-btn:disabled {
  opacity: 0.4;
  transform: none;
  cursor: not-allowed;
}

/* ── Result Cards ── */
.result-area {
  margin-top: 20px;
}

.result-card {
  background: var(--surface);
  border: 1px solid
