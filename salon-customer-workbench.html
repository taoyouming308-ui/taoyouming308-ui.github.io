<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合成顾客 · 改期测试</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#ecf1f6;font:16px system-ui}main{max-width:760px;margin:auto;padding:24px}section{background:#1d2a36;padding:20px;margin:16px 0;border-radius:12px}button,input,select{font:inherit;min-height:44px;border-radius:8px;padding:10px;max-width:100%}button{background:#c3eab2;border:0;cursor:pointer}button:disabled{opacity:.5}input,select{width:100%;margin:8px 0}label{display:block;margin:12px 0}fieldset{border:0;padding:0}nav{display:flex;gap:12px;flex-wrap:wrap}p,li{line-height:1.6;overflow-wrap:anywhere}#status{white-space:pre-wrap}h1{font-size:26px}</style></head>
<body><main><h1>顾客改期 · 本机测试</h1><p>仅合成顾客账号，固定合成机构 1／门店 1。独立令牌保存在当前页面内存；不是正式登录。无绑定数据时不会自动创建顾客或预约。按接口返回的门店时区显示和输入，不使用设备时区。</p><p id="timeZone">门店时区未加载</p>
<nav><button id="connect">连接合成顾客</button><button id="retry" disabled>按原请求重试</button><button id="logout" disabled>退出顾客测试会话</button></nav><p id="status" role="status">尚未连接。</p>
<fieldset id="panel" disabled><button id="refresh">刷新本人数据</button><section><h2>申请改期</h2><label>本人已确认预约<select id="booking"></select></label><label>新开始时间（当前门店时间）<input id="starts" type="datetime-local" step="60"></label><label>改期原因<input id="reason" maxlength="500" autocomplete="off"></label><button id="submit">提交改期申请</button><p>提交不会占用新时段。门店批准后才改变预约；冲突时原预约保留。夏令时不存在或重复的时间请换一个明确时间。</p></section><section><h2>本人申请与处理结果</h2><ul id="results"></ul></section></fieldset>
<script type="module" src="/packages/salon-core/customer-workbench.mjs"></script></main></body></html>
